<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonshot Programme Tracker</title>
<meta name="theme-color" content="#FBFBFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --surface-2:#F5F5F7;
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#8E8E93;
  --line:#E5E5EA; --line-2:#D2D2D7;
  --accent:#0071E3; --accent-soft:#E8F1FE;
  --ok:#34C759; --warn:#FF9500; --danger:#FF3B30;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
  --shadow-soft:0 1px 2px rgba(0,0,0,.05);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Plus Jakarta Sans","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --cell:30px; --labelw:290px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv05","ss01";font-size:13.5px;line-height:1.45}
body{padding:0 0 70px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.02em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(251,251,253,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar .twrap{max-width:1800px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.02em;font-family:var(--font-display);flex:none}
.brand .dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#7ab8ff,#0071E3 62%,#0a3f86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.brand small{font-weight:430;color:var(--ink-3);font-size:13px;letter-spacing:0}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;box-shadow:0 1px 6px rgba(0,0,0,.07);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--surface);font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;transition:background .18s,color .15s;letter-spacing:-.01em;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff}
.seg button:not(.on):hover{background:var(--surface-2);color:var(--ink)}
.seg.mini button{padding:5px 13px;font-size:12.5px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#0062C4}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.dngr{color:#C0271A;border-color:#F3C9C4}
.btn.dngr:hover{background:#FFF1F0}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.on{background:var(--accent-soft);border-color:#B4D3F4;color:var(--accent)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- layout ---------- */
.wrap{padding:22px 24px 0;max-width:1800px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft)}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 13px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--ink-3);font-weight:450}
.card-b{padding:18px 20px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);position:relative;z-index:20;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:12.5px;min-width:0;transition:border-color .13s}
select:hover,input:hover{border-color:#B9BDC6}
select:focus,input:focus{border-color:var(--accent);outline:none}
input[type=color]{width:34px;height:31px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:#fff;cursor:pointer}

/* chips (filters) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4.5px 12px;font-size:12px;font-weight:550;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:.13s}
.fchip i{width:8px;height:8px;border-radius:3px;background:currentColor;flex:none;display:block}
.fchip.on{color:var(--ink);border-color:var(--line-2);background:var(--surface-2)}
.fchip:not(.on){opacity:.42}
.fchip:hover{opacity:1}

/* ---------- sync banner ---------- */
.sync{max-width:1800px;margin:14px auto 0;padding:0 24px}
.sync-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-soft)}
.sync-in.dirty{background:#FFF9EE;border-color:#F0DDB8;color:#7A5A18}
.sync-in.warn{background:#FFF1F0;border-color:#F3C9C4;color:#8C2318}
.dot2{width:7px;height:7px;border-radius:50%;flex:none}
.dot2.g{background:var(--ok)} .dot2.a{background:var(--warn)} .dot2.r{background:var(--danger)} .dot2.c{background:var(--accent)}

/* ---------- generic table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0;z-index:2;white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFAFB}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- milestone matrix (old slide design) ---------- */
.mtx-outer{padding:26px 26px 30px;overflow:auto;-webkit-overflow-scrolling:touch}
.slide-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.slide-head .eyebrow{display:block}
.slide-head h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.slide-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-weight:430}
.slide-head .right{text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.slide-head .right b{color:var(--ink);font-size:13px;font-weight:600;display:block}
table.mtx{border-collapse:separate;border-spacing:0;font-size:13.5px;table-layout:fixed;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 auto}
table.mtx th,table.mtx td{padding:0;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
table.mtx th:last-child,table.mtx td:last-child{border-right:0}
table.mtx tbody tr:last-child td{border-bottom:0}
table.mtx thead th{padding:10px 6px;font-weight:600;font-size:13px;letter-spacing:-.01em;color:#fff;vertical-align:middle}
table.mtx thead th.lead{text-align:left;padding-left:16px;color:var(--ink-2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;background:var(--surface-2)}
table.mtx thead th .oname{line-height:1.16;overflow-wrap:break-word;word-break:break-word}
table.mtx tbody td{height:44px;font-variant-numeric:tabular-nums}
table.mtx tbody tr:nth-child(even) td{background:#FAFAFB}
table.mtx tbody td.lead{text-align:left;font-weight:600;color:var(--ink);padding:0 14px 0 16px;letter-spacing:-.012em;font-size:13px;background:var(--surface-2);border-right:2px solid var(--line-2);white-space:nowrap}
table.mtx tbody tr:nth-child(even) td.lead{background:#F0F0F3}
table.mtx tbody td.lead .num{color:var(--ink-3);font-weight:600;margin-right:11px;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
table.mtx tbody td.lead .cdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:9px;vertical-align:1px}
table.mtx tbody td .dt{display:inline-block;min-width:44px;padding:6px 5px;border-radius:7px;letter-spacing:-.02em;line-height:1.3;font-size:12.5px}
table.mtx tbody td .dt.rng{font-size:12px;white-space:normal}
table.mtx tbody td .dt.pick{cursor:pointer}
table.mtx tbody td .dt.pick:hover{background:var(--accent-soft)}
table.mtx tbody td .dt.done{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}
table.mtx tbody tr.hand td{border-top:2px solid var(--line-2)}
table.mtx tbody tr.hand td.lead{font-weight:700}
table.mtx tbody tr.launch td.lead{font-weight:700;color:var(--accent);background:var(--accent-soft)}
table.mtx tbody tr.launch td{background:rgba(0,113,227,.05)}
.dim{color:var(--line-2)}

/* ---------- gantt ---------- */
.gantt{overflow:auto;-webkit-overflow-scrolling:touch;position:relative;max-height:calc(100vh - 260px);border-radius:0 0 var(--radius) var(--radius)}
.gt{border-collapse:separate;border-spacing:0;font-size:12px}
.gt th,.gt td{padding:0;margin:0}
.gt .lab{position:sticky;left:0;z-index:3;background:var(--surface);min-width:var(--labelw);max-width:var(--labelw);width:var(--labelw);border-right:1px solid var(--line-2);border-bottom:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:middle}
.gt thead .lab{z-index:6;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.gt thead th{position:sticky;top:0;z-index:4;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.gt .d{width:var(--cell);min-width:var(--cell);max-width:var(--cell);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;position:relative}
.gt .dh{cursor:pointer;padding:4px 0 5px;line-height:1.15;transition:.12s}
.gt .dh:hover{background:var(--accent-soft)!important}
.gt .dh .dow{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.gt .dh .dd{font-size:12px;font-weight:620;font-family:var(--mono)}
.gt .dh .mo{font-size:8px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.gt .dh.we{background:#F0F0F3}
.gt .dh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.gt .dh.today .dd{color:var(--accent)}
.gt .dh.hol .dow,.gt .dh.hol .dd,.gt .dh.hol .mo{color:#fff}
.gt tbody .d.we{background:#F7F7F9}
.gt tbody .d.cell{cursor:pointer}
.gt tbody .d.cell:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.gt tbody tr:hover .lab{background:#F5F9FE}
.gbar{position:absolute;inset:3px 0;background:var(--barc,#2b3d4d);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);z-index:2}
.gbar.s{left:2px;border-radius:6px 3px 3px 6px}
.gbar.e{right:2px;border-radius:3px 6px 6px 3px}
.gbar.ms::after{content:"";position:absolute;top:50%;left:50%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:#fff;border-radius:1px}
.holcurtain{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:1}
.holcurtain.soft{opacity:.22}
.holcurtain span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:680;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;opacity:.95}
.tname{font-weight:550;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tmeta{font-size:10px;color:var(--ink-3);display:flex;gap:5px;align-items:center;margin-top:1px}
.catdot{width:7px;height:7px;border-radius:2.5px;flex:none;display:inline-block}
.msflag{color:var(--warn);font-size:10px;font-weight:700}
.rowbtns{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.gt tbody tr:hover .rowbtns{opacity:1}
.ibtn{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--ink-3);font-size:12px;line-height:1;cursor:pointer;transition:.12s}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn.del:hover{background:#FFF1F0;color:#C0271A}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-top:1px}

/* ---------- calendar (old chip design) ---------- */
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:7px;padding:18px 20px 0}
.cal-dow div{text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(96px,auto);gap:8px;padding:8px 20px 20px}
.cell-day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;position:relative;transition:.14s}
.cell-day.quiet{background:transparent;border-style:dashed}
.cell-day .dnum{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cell-day.quiet .dnum{color:var(--ink-3);font-weight:500}
.cell-day.today{border-color:var(--accent)}
.cell-day.today .dnum{color:var(--accent);font-weight:700}
.cell-day.hol{background:var(--hb,#eee);border-color:transparent}
.cell-day.hol .dnum,.cell-day.hol .hlbl{color:var(--ht,#fff)}
.hlbl{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;text-align:right}
.dchips{display:flex;flex-direction:column;gap:5px}
.chip{display:flex;flex-direction:column;gap:1px;color:#fff;padding:6px 9px;border-radius:8px;overflow-wrap:anywhere;border:0;text-align:left;width:100%;cursor:pointer;transition:filter .12s}
.chip:hover{filter:brightness(.94)}
.chip .cn{font-weight:700;font-size:12px;line-height:1.28;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:6px}
.chip .cn .n{font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.chip .cp{font-size:11px;line-height:1.28;opacity:.92;font-weight:480}
.more{font-size:11px;color:var(--ink-2);padding:1px 4px;text-align:left;background:none;border:0;font-weight:550;cursor:pointer}
.more:hover{color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:14px 20px 20px}
.wkcol{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:340px;padding:9px;display:flex;flex-direction:column;gap:6px}
.wkcol.today{border-color:var(--accent)}
.wkhead{font-size:12.5px;font-weight:650;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.daylist{display:flex;flex-direction:column}
.dgroup{border-bottom:1px solid var(--line)}
.dgroup:last-child{border-bottom:0}
.dgroup-h{display:flex;align-items:center;gap:9px;padding:10px 20px;background:var(--surface-2);font-weight:650;font-size:13px;position:sticky;top:0;z-index:2}
.dgroup-h i{width:10px;height:10px;border-radius:3px;flex:none}
.dgroup-h .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.dtask{display:flex;gap:10px;align-items:flex-start;padding:8px 20px 8px 30px;border-top:1px solid var(--line)}
.dtask:first-of-type{border-top:0}
.dtask .who{margin-left:auto;font-size:10.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.cal-legend{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;padding:0 20px 18px}
.cal-legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);font-weight:500}
.cal-legend i{width:9px;height:9px;border-radius:3px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:var(--surface);border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.3);width:min(600px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mod.wide{width:min(940px,100%)}
.mod-h{display:flex;align-items:center;gap:10px;padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.mod-h h3{font-size:17px;font-weight:700}
.mod-h .x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink-2);display:grid;place-items:center;flex:none}
.mod-h .x:hover{background:var(--line)}
.mod-b{padding:18px 24px;overflow:auto}
.mod-f{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fld input,.fld select,.fld textarea{width:100%}
.hint{font-size:12px;color:var(--ink-2);line-height:1.5}
.cbrow{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.cbrow input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.note{background:#FFF9EE;border:1px solid #F0DDB8;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7A5A18;margin-bottom:14px}
.note b{display:block;margin-bottom:3px}
.note.blue{background:var(--accent-soft);border-color:#B4D3F4;color:#0A4E93}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.hidden{display:none!important}

@media(max-width:860px){
  :root{--labelw:180px;--cell:26px}
  .wrap{padding:12px 12px 0}
  .sync{padding:0 12px;margin-top:10px}
  .topbar .twrap{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .seg button{padding:6px 11px;font-size:12px}
  .card-h,.bar{padding:11px 13px}
  .card-b{padding:13px}
  .mtx-outer{padding:14px}
  .grid2{grid-template-columns:1fr}
  .cal-grid{gap:4px;padding:4px 10px 12px;grid-auto-rows:minmax(72px,auto)}
  .cal-dow{gap:4px;padding:12px 10px 0}
  .cell-day{padding:5px 5px;border-radius:9px}
  .chip{padding:4px 6px}

<script>
/* ============================================================
   Moonshot Programme Tracker · v3
   Data sources, in priority order at boot:
     1. Supabase (if connected)  — shared cloud copy, same for every device
     2. localStorage             — this device's draft (also the offline fallback)
     3. data.json                — published file next to index.html
     4. SEED                     — copy baked into this file
   ============================================================ */

const LS  = 'moonshot.tracker.v3';
const LSB = 'moonshot.supabase';      // {url, key} — kept out of the dataset
let DB=null, PUB=null, dirty=false, cloud={on:false, state:'off', at:null};
let UI={ view:'milestones', outlet:null, calMode:'month', calDate:null,
         outlets:null, group:true, msEdit:false };

const PALETTE=["#0071E3","#34C759","#FF9500","#AF52DE","#FF2D55","#E91E8C","#00897B","#F59E0B","#A2845E","#7B1FA2","#C7A500","#8E8E93"];

/* ---------- date helpers ('YYYY-MM-DD' strings throughout) ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function d2s(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function s2d(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d);}
function diffDays(a,b){return Math.round((s2d(b)-s2d(a))/864e5);}
function range(a,b){const o=[];let c=a,g=0;while(c<=b&&g++<3000){o.push(c);c=addDays(c,1);}return o;}
function dowOf(s){return s2d(s).getDay();}
function isWeekend(s){const d=dowOf(s);return d===0||d===6;}
function fmt(s){if(!s)return '·';const d=s2d(s);return d.getDate()+' '+MON[d.getMonth()];}
function fmtY(s){if(!s)return '·';const d=s2d(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
/** "8 Jun" / "27 Jul – 10 Aug" / "27–29 Jul" — compact, matching the old matrix. */
function fmtRange(a,b){
  if(!a) return '·';
  if(!b||a===b) return fmt(a);
  const da=s2d(a), db=s2d(b);
  if(da.getMonth()===db.getMonth()) return da.getDate()+'–'+db.getDate()+' '+MON[da.getMonth()];
  return fmt(a)+' – '+fmt(b);
}
function today(){return d2s(new Date());}
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function darken(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*(1-f)), g=Math.round(((n>>8)&255)*(1-f)), b=Math.round((n&255)*(1-f));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------- lookups ---------- */
const cat=id=>DB.categories.find(c=>c.id===id)||{id:'other',name:'Other',color:'#C7A500',inCalendar:true,inMilestones:true};
const dayType=id=>DB.dayTypes.find(t=>t.id===id)||DB.dayTypes[0];
const outletOf=id=>DB.outlets.find(o=>o.id===id);

/** The programme calendar is global. */
function holidayOn(date){ return DB.holidays.find(h=>h.date===date)||null; }
/** Blocked for this outlet: a non-working day type, unless the outlet has a works-anyway exception. */
function blockedOn(o,date){
  const h=holidayOn(date);
  if(!h) return false;
  if(dayType(h.typeId).working) return false;
  return !(o && (o.worksOn||[]).includes(date));
}
function activeDays(o,t){
  if(!t.start||!t.end||t.end<t.start) return t.start?[t.start]:[];
  const skip=new Set(t.skip||[]);
  return range(t.start,t.end).filter(d=>!skip.has(d)&&!blockedOn(o,d));
}
function workDays(o,t){return activeDays(o,t).length;}
function taskOn(o,t,date){
  if(date<t.start||date>t.end) return false;
  if((t.skip||[]).includes(date)) return false;
  return !blockedOn(o,date);
}
function outletSpan(o){
  let s=o.start,e=o.end;
  o.tasks.forEach(t=>{if(t.start&&(!s||t.start<s))s=t.start;if(t.end&&(!e||t.end>e))e=t.end;});
  return [s||today(),e||today()];
}
function handoverDate(o){
  const h=o.tasks.filter(t=>t.cat==='handover'||/handing over|hand over/i.test(t.name));
  if(h.length) return h.map(t=>t.end).sort().pop();
  return outletSpan(o)[1];
}
/** All milestone-flagged tasks for an outlet in a category, and their combined range. */
function msTasks(o,cid){ return o.tasks.filter(t=>t.ms&&t.cat===cid); }
function msRange(o,cid){
  const ts=msTasks(o,cid);
  if(!ts.length) return null;
  const s=ts.map(t=>t.start).sort()[0], e=ts.map(t=>t.end).sort().pop();
  return {start:s,end:e,n:ts.length};
}

/* ---------- storage ---------- */
function saveLocal(silent){
  try{
    localStorage.setItem(LS,JSON.stringify({savedAt:new Date().toISOString(),base:PUB?PUB.generatedAt:null,data:DB}));
    dirty=false;
    if(!silent) toast(cloud.on?'Saved on this device — pushing to cloud…':'Saved to this device');
    renderSync();
  }catch(e){ toast('Could not save: '+e.message); }
}
function readLocal(){ try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null;}catch(e){return null;} }
function markDirty(){ dirty=true; renderSync(); }

/* ---------- Supabase (plain REST, no SDK) ---------- */
function sbCfg(){ try{return JSON.parse(localStorage.getItem(LSB)||'null');}catch(e){return null;} }
function sbHeaders(cfg){ return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'}; }
async function sbLoad(){
  const cfg=sbCfg(); if(!cfg) return null;
  const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/tracker_state?id=eq.1&select=data,updated_at',
    {headers:sbHeaders(cfg)});
  if(!r.ok) throw new Error('Supabase read failed ('+r.status+')');
  const rows=await r.json();
  return rows.length?rows[0]:null;
}
async function sbSave(){
  const cfg=sbCfg(); if(!cfg) return false;
  const out={...DB}; delete out._localAt; delete out._stale;
  out.generatedAt=today();
  const r=await fetch(cfg.url.replace(/\/$/,'')+'/rest/v1/tracker_state',
    {method:'POST',
     headers:{...sbHeaders(cfg),'Prefer':'resolution=merge-duplicates,return=minimal'},
     body:JSON.stringify({id:1,data:out,updated_at:new Date().toISOString()})});
  if(!r.ok) throw new Error('Supabase write failed ('+r.status+')');
  return true;
}
async function pushCloud(){
  if(!cloud.on) return;
  cloud.state='saving'; renderSync();
  try{ await sbSave(); cloud.state='ok'; cloud.at=new Date(); toast('Synced to cloud — every device sees this now'); }
  catch(e){ cloud.state='err'; toast('Cloud sync failed: '+e.message); }
  renderSync();
}
async function saveAll(){ saveLocal(true); if(cloud.on) await pushCloud(); else toast('Saved to this device'); }

/* ---------- boot ---------- */
async function boot(){
  PUB=JSON.parse(JSON.stringify(SEED));
  try{
    const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const j=await r.json(); if(j&&j.outlets) PUB=j;}
  }catch(e){}

  cloud.on=!!sbCfg();
  let loaded=false;
  if(cloud.on){
    try{
      const row=await sbLoad();
      if(row&&row.data&&row.data.outlets){
        DB=row.data; cloud.state='ok'; cloud.at=row.updated_at?new Date(row.updated_at):null; loaded=true;
      }else{ cloud.state='empty'; }
    }catch(e){ cloud.state='err'; }
  }
  if(!loaded){
    const local=readLocal();
    if(local&&local.data&&local.data.outlets){
      DB=local.data; DB._localAt=local.savedAt;
      DB._stale=!cloud.on&&local.base&&PUB.generatedAt&&local.base!==PUB.generatedAt;
    }else DB=JSON.parse(JSON.stringify(PUB));
  }
  normalise();
  UI.outlet=DB.outlets.length?DB.outlets[0].id:null;
  UI.outlets=new Set(DB.outlets.map(o=>o.id));
  UI.calDate=defaultCalMonth();
  render();
}
function defaultCalMonth(){
  const t=today();
  const all=DB.outlets.flatMap(o=>o.tasks.map(x=>x.end)).filter(Boolean).sort();
  if(!all.length) return t.slice(0,7)+'-01';
  if(t<all[0]) return all[0].slice(0,7)+'-01';
  if(t>all[all.length-1]) return all[all.length-1].slice(0,7)+'-01';
  return t.slice(0,7)+'-01';
}
/** Fill gaps in older / imported files, migrate v2 → v3 holiday model. */
function normalise(){
  DB.categories=DB.categories||[]; DB.dayTypes=DB.dayTypes||[];
  DB.holidays=DB.holidays||[]; DB.outlets=DB.outlets||[];
  DB.categories.forEach(c=>{
    if(c.inMilestones===undefined)c.inMilestones=true;
    if(c.inCalendar===undefined)c.inCalendar=true;
  });
  DB.outlets.forEach((o,i)=>{
    o.tasks=o.tasks||[]; o.worksOn=o.worksOn||[];
    if(o.launch===undefined)o.launch=null;
    if(!o.color)o.color=PALETTE[i%PALETTE.length];
    // v2 files carried per-outlet holidays: fold them into the global calendar
    if(o.holidays&&o.holidays.length){
      o.holidays.forEach(h=>{ if(!DB.holidays.some(g=>g.date===h.date)) DB.holidays.push({date:h.date,label:h.label,typeId:h.typeId}); });
      delete o.holidays;
    }
    o.tasks.forEach(t=>{
      t.skip=t.skip||[]; t.cat=t.cat||'other'; t.ms=!!t.ms;
      if(t.done===undefined)t.done=null;
      if(!t.id)t.id=uid('t');
    });
  });
  DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- chrome ---------- */
const VIEWS=[['milestones','Milestones'],['calendar','Calendar'],['critical','Critical Path'],['manage','Setup'],['data','Data']];
function renderTabs(){
  document.getElementById('tabs').innerHTML=VIEWS.map(([k,l])=>
    `<button class="${UI.view===k?'on':''}" data-v="${k}">${l}</button>`).join('');
}
function renderSync(){
  const el=document.getElementById('sync');
  const stamp=PUB&&PUB.generatedAt?PUB.generatedAt:'—';
  let cls='sync-in', html='';
  const cloudBit = cloud.on
    ? (cloud.state==='ok'   ? `<span class="dot2 c"></span>Cloud connected${cloud.at?' · synced '+cloud.at.toLocaleString():''}`
      :cloud.state==='saving'? `<span class="dot2 c"></span>Syncing to cloud…`
      :cloud.state==='empty' ? `<span class="dot2 a"></span>Cloud connected — nothing stored yet, press Save to push this dataset up`
      :                        `<span class="dot2 r"></span>Cloud unreachable — working from this device`)
    : '';
  if(DB&&DB._stale){
    cls+=' warn';
    html=`<span class="dot2 r"></span><b>The published data has moved on.</b>
      This device is showing your own draft; the published set is dated ${esc(stamp)}.
      <button class="btn sm" id="syncTakePub">Use published</button>
      <button class="btn sm" id="syncKeep">Keep my draft</button>`;
  }else if(dirty){
    cls+=' dirty';
    html=`<span class="dot2 a"></span><b>Unsaved changes.</b>
      <button class="btn sm" id="syncSave">${cloud.on?'Save & sync':'Save draft'}</button>
      ${cloud.on?'':'<button class="btn sm" id="syncPub">Download data.json</button>'}`;
  }else{
    html=`<span class="dot2 g"></span>${DB?DB.outlets.length:0} outlets · ${DB?DB.outlets.reduce((n,o)=>n+o.tasks.length,0):0} tasks
      ${cloudBit?'<span style="margin:0 2px;color:var(--line-2)">|</span>'+cloudBit:''}
      <span class="spacer"></span>
      <button class="btn sm ghost" id="syncPub">Download data.json</button>`;
  }
  el.innerHTML=`<div class="${cls}">${html}</div>`;
  el.querySelector('#syncSave')?.addEventListener('click',saveAll);
  el.querySelector('#syncPub')?.addEventListener('click',exportJSON);
  el.querySelector('#syncKeep')?.addEventListener('click',()=>{DB._stale=false;saveLocal(true);render();});
  el.querySelector('#syncTakePub')?.addEventListener('click',()=>{
    if(!confirm("Replace this device's draft with the published dataset? Your local edits will be lost.")) return;
    DB=JSON.parse(JSON.stringify(PUB)); normalise();
    UI.outlet=DB.outlets[0]?.id; UI.outlets=new Set(DB.outlets.map(o=>o.id));
    localStorage.removeItem(LS); dirty=false; render();
  });
}
/** Re-render, keeping every scroll position where it was (fixes the jump-to-top). */
function render(){
  const winY=window.scrollY;
  const keep={};
  document.querySelectorAll('[data-keepscroll]').forEach(el=>{
    keep[el.dataset.keepscroll]={l:el.scrollLeft,t:el.scrollTop};
  });
  renderTabs(); renderSync();
  const app=document.getElementById('app');
  if(UI.view==='milestones')app.innerHTML=viewMilestones();
  else if(UI.view==='calendar')app.innerHTML=viewCalendar();
  else if(UI.view==='critical')app.innerHTML=viewCritical();
  else if(UI.view==='manage')app.innerHTML=viewManage();
  else app.innerHTML=viewData();
  wire();
  document.querySelectorAll('[data-keepscroll]').forEach(el=>{
    const k=keep[el.dataset.keepscroll];
    if(k){el.scrollLeft=k.l;el.scrollTop=k.t;}
  });
  window.scrollTo(0,winY);
}
function toast(m){
  const t=document.getElementById('toast');
  t.innerHTML=`<div class="toast">${esc(m)}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML='',2600);
}
function closeModal(){document.getElementById('modal').innerHTML='';}
function showModal(html){
  document.getElementById('modal').innerHTML=`<div class="ov" id="ov">${html}</div>`;
  document.getElementById('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal();});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>

<script>
/* ================== MILESTONES (old slide-style matrix) ================== */
/* Outlets are columns with their own colour; categories are numbered rows.
   Each cell is the combined date range of every milestone-flagged task in
   that category — "this is the time range for this milestone". */
function viewMilestones(){
  const cats=DB.categories.filter(c=>c.inMilestones);
  const outs=DB.outlets;
  const pick=UI.msEdit;

  const head=outs.map(o=>`<th style="background:${o.color};min-width:96px">
      <span class="oname">${esc(o.name)}</span></th>`).join('');

  let body='';
  cats.forEach((c,idx)=>{
    const tds=outs.map(o=>{
      const r=msRange(o,c.id);
      if(!r) return `<td><span class="dt dim ${pick?'pick':''}" ${pick?`data-mspick="${o.id}|${c.id}"`:''}>·</span></td>`;
      const txt=fmtRange(r.start,r.end);
      const done=r.end<today();
      return `<td><span class="dt ${r.start!==r.end?'rng':''} ${done&&UI.strike?'done':''} ${pick?'pick':''}"
        ${pick?`data-mspick="${o.id}|${c.id}"`:''} title="${r.n} task${r.n===1?'':'s'} flagged"
        style="color:${darken(o.color,.30)};font-weight:600">${txt}</span></td>`;
    }).join('');
    body+=`<tr><td class="lead"><span class="num">${String(idx+1).padStart(2,'0')}</span><span class="cdot" style="background:${c.color}"></span>${esc(c.name)}</td>${tds}</tr>`;
  });

  // Handover row
  body+=`<tr class="hand"><td class="lead"><span class="num" style="visibility:hidden">00</span>Handover</td>`+
    outs.map(o=>`<td><span class="dt" style="color:${darken(o.color,.30)};font-weight:700">${fmt(handoverDate(o))}</span></td>`).join('')+`</tr>`;
  // Launch row — manual dates
  body+=`<tr class="launch"><td class="lead"><span class="num" style="visibility:hidden">00</span>Launch date</td>`+
    outs.map(o=>{
      const has=!!o.launch;
      return `<td><span class="dt pick" data-launch="${o.id}"
        style="color:${has?'var(--accent)':'var(--line-2)'};font-weight:${has?700:400}">${has?fmt(o.launch):'·'}</span></td>`;
    }).join('')+`</tr>`;

  const totalMs=outs.reduce((n,o)=>n+o.tasks.filter(t=>t.ms).length,0);
  return `<div class="card">
    <div class="bar">
      <div class="chips">${DB.categories.map(c=>
        `<button class="fchip ${c.inMilestones?'on':''}" data-mscat="${c.id}" style="color:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}</div>
      <span class="spacer"></span>
      <button class="btn sm ${UI.strike?'on':''}" id="msStrike" title="Strike through milestones whose last day has passed">Strike past</button>
      <button class="btn sm ${pick?'on':''}" id="msEdit">${pick?'Done editing':'Edit cells'}</button>
      <button class="btn sm" id="expPNG" data-t="msSlide">PNG</button>
      <button class="btn sm" id="expPDF" data-t="msSlide">PDF</button>
    </div>
    <div class="mtx-outer" id="msSlide" data-keepscroll="ms">
      <div class="slide-head">
        <div><span class="eyebrow">Moonshot Programme</span>
          <h2>Milestone Matrix</h2>
          <div class="sub">Combined date range of the flagged tasks in each work package, per outlet</div></div>
        <div class="right"><b>${outs.length} outlets</b>${totalMs} milestones · ${cats.length} of ${DB.categories.length} categories</div>
      </div>
      <table class="mtx">
        <thead><tr><th class="lead" style="width:236px">Milestone</th>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table>
    </div>
    <div class="card-b hint" style="border-top:1px solid var(--line)">
      A cell spans from the first day of the earliest flagged task to the last day of the latest one in that
      category. Flag tasks with ◆ on the Critical Path — or press <b>Edit cells</b> and click any cell to
      choose which of that outlet's tasks count. Click a Launch cell to set the launch date by hand.
    </div>
  </div>`;
}

/* Cell editor: choose which tasks in this outlet+category are flagged. */
function msCellEditor(outId,cid){
  const o=outletOf(outId), c=cat(cid);
  const ts=o.tasks.filter(t=>t.cat===cid);
  const rows=ts.length?ts.map(t=>`<label class="cbrow" style="padding:7px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">
      <input type="checkbox" data-msck="${t.id}" ${t.ms?'checked':''}>

      <span class="mono" style="color:var(--ink-3);font-size:11px">${fmtRange(t.start,t.end)}</span>
    </label>`).join('')
    :`<div class="hint">No tasks in <b>${esc(c.name)}</b> for this outlet yet. Assign tasks to this category from the Critical Path.</div>`;
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${esc(c.name)}</h3><span class="sub">${esc(o.name)}</span>

function launchEditor(outId){

      <span class="sub">${esc(o.name)}</span><span class="spacer"></span>

/* ============================== CALENDAR ============================== */
/* Grouped mode: real categories collapse to one chip per outlet+category.
   Tasks that don't belong to a category ('Other') always show individually. */
function calItemsOn(date){
  const out=[];
  DB.outlets.forEach(o=>{
    if(!UI.outlets.has(o.id)) return;
    o.tasks.forEach(t=>{
      const c=cat(t.cat);
      if(!c.inCalendar) return;
      if(taskOn(o,t,date)) out.push({o,t,c});
    });
  });
  return out;
}
function calChips(date,limit){
  const items=calItemsOn(date);
  if(!items.length) return '';
  let entries=[];
  if(UI.group){
    const m=new Map();
    items.forEach(({o,t,c})=>{
      if(c.id==='other'){ entries.push({sort:o.name+'~'+t.name,html:
        `<button class="chip" data-day="${date}" style="background:${o.color}">
          <span class="cn">${esc(t.name)}</span><span class="cp">${esc(o.name)}</span></button>`}); return; }
      const k=o.id+'|'+c.id;
      if(!m.has(k)) m.set(k,{o,c,n:0});
      m.get(k).n++;
    });
    [...m.values()].forEach(g=>entries.push({sort:g.o.name+'|'+g.c.name,html:
      `<button class="chip" data-day="${date}" style="background:${g.o.color}">
        <span class="cn">${esc(g.o.name)}<span class="n">${g.n}</span></span>
        <span class="cp">${esc(g.c.name)}</span></button>`}));
  }else{
    items.forEach(({o,t})=>entries.push({sort:o.name+'~'+t.name,html:
      `<button class="chip" data-day="${date}" style="background:${o.color}">
        <span class="cn">${esc(t.name)}</span><span class="cp">${esc(o.name)}</span></button>`}));
  }
  entries.sort((a,b)=>a.sort.localeCompare(b.sort));
  const show=limit?entries.slice(0,limit):entries;
  return show.map(e=>e.html).join('')
    +(limit&&entries.length>limit?`<button class="more" data-day="${date}">+${entries.length-limit} more</button>`:'');
}
function calFilters(){
  return `<div class="bar">
    <div class="seg mini">${['day','week','month'].map(m=>
      `<button data-cal="${m}" class="${UI.calMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
    <button class="btn sm" id="calPrev">‹</button>
    <button class="btn sm" id="calToday">Today</button>
    <button class="btn sm" id="calNext">›</button>
    <input type="date" id="calJump" value="${UI.calDate}">
    <select id="calOut"><option value="__all">All outlets (${DB.outlets.length})</option>
      ${DB.outlets.map(o=>`<option value="${o.id}" ${UI.outlets.size===1&&UI.outlets.has(o.id)?'selected':''}>${esc(o.name)}</option>`).join('')}</select>
    <button class="btn sm ${UI.group?'on':''}" id="calGroup">${UI.group?'Grouped':'Every task'}</button>
    <span class="spacer"></span>
    <button class="btn sm" id="expPNG" data-t="calBody">PNG</button>
  </div>
  <div class="bar">
    <div class="chips">
      <button class="fchip on" id="calAll" style="color:var(--ink-2)"><i></i>All</button>
      <button class="fchip on" id="calNone" style="color:var(--ink-2)"><i></i>None</button>
      ${DB.categories.map(c=>`<button class="fchip ${c.inCalendar?'on':''}" data-calcat="${c.id}" style="color:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}
    </div>
  </div>`;
}
function viewCalendar(){
  let body='',title='';
  if(UI.calMode==='month')[body,title]=calMonth();
  else if(UI.calMode==='week')[body,title]=calWeek();
  else [body,title]=calDay();
  const legend=DB.outlets.filter(o=>UI.outlets.has(o.id));
  return `<div class="card">
    <div class="card-h"><h2>${title}</h2>
      <span class="sub">${legend.length} outlet${legend.length===1?'':'s'} · ${DB.categories.filter(c=>c.inCalendar).length} of ${DB.categories.length} categories</span></div>
    ${calFilters()}
    <div id="calBody" data-keepscroll="cal">${body}
      ${UI.calMode!=='day'?`<div class="cal-legend">${legend.map(o=>`<span><i style="background:${o.color}"></i>${esc(o.name)}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}
function calMonth(){
  const first=UI.calDate.slice(0,7)+'-01';
  const d0=s2d(first),y=d0.getFullYear(),m=d0.getMonth();
  const start=addDays(first,-d0.getDay());
  const last=d2s(new Date(y,m+1,0));
  const end=addDays(last,6-s2d(last).getDay());
  const t=today();
  const cells=range(start,end).map(date=>{
    const inMo=date.slice(0,7)===first.slice(0,7);
    const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
    return `<div class="cell-day ${inMo?'':'quiet'} ${date===t?'today':''} ${h?'hol':''}"
      style="${h?`--hb:${dt.color};--ht:${dt.text||'#fff'}`:''}">
      <div class="dnum"><span>${s2d(date).getDate()}</span>${h?`<span class="hlbl">${esc(h.label)}</span>`:''}</div>
      <div class="dchips">${calChips(date,4)}</div>
    </div>`;
  }).join('');
  return [`<div class="cal-dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-grid">${cells}</div>`,
          MONF[m]+' '+y];
}
function calWeek(){
  const start=addDays(UI.calDate,-dowOf(UI.calDate));
  const t=today();
  const cols=range(start,addDays(start,6)).map(date=>{
    const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
    return `<div class="wkcol ${date===t?'today':''}" style="${h?`background:${dt.color}14;border-color:${dt.color}55`:''}">
      <div class="wkhead"><span>${DOW[dowOf(date)]} ${s2d(date).getDate()}</span>
        ${h?`<span class="hlbl" style="color:${dt.color}">${esc(h.label)}</span>`:''}</div>
      ${calChips(date,null)||'<span class="dim" style="text-align:center">·</span>'}</div>`;
  }).join('');
  return [`<div class="wk">${cols}</div>`,'Week of '+fmtY(start)];
}
function calDay(){
  const date=UI.calDate;
  const items=calItemsOn(date);
  const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
  const byOut=new Map();
  items.forEach(({o,t,c})=>{ if(!byOut.has(o.id))byOut.set(o.id,{o,items:[]}); byOut.get(o.id).items.push({t,c}); });
  const groups=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>{
    const list=g.items.sort((a,b)=>a.c.name.localeCompare(b.c.name)||a.t.name.localeCompare(b.t.name))
      .map(({t,c})=>`<div class="dtask">
        <span class="catdot" style="background:${c.color};margin-top:4px"></span>
        <div><div style="font-weight:550">${esc(t.name)}</div>
          <div class="tmeta">${esc(c.name)} · day ${diffDays(t.start,date)+1} of ${diffDays(t.start,t.end)+1}</div></div>
        <div class="who">${esc(t.resp||'')}<br><span style="color:var(--ink-3)">${esc(t.dept||'')}</span></div>
      </div>`).join('');
    return `<div class="dgroup"><div class="dgroup-h"><i style="background:${g.o.color}"></i>${esc(g.o.name)}<span class="cnt">${g.items.length}</span></div>${list}</div>`;
  }).join('');
  const head=h?`<div class="note" style="margin:16px 20px 0;background:${dt.color}12;border-color:${dt.color}44;color:${darken(dt.color,.2)}">
    <b>${esc(h.label)}</b>${dt.working?'Work continues on this day.'
      :'Blocked programme-wide, except outlets with a works-anyway exception.'}</div>`:'';
  return [head+`<div class="daylist">${groups||'<div class="card-b hint">Nothing scheduled on this day for the current filters.</div>'}</div>`,
          DOW[dowOf(date)]+', '+fmtY(date)];
}
function dayDrill(date){
  const items=calItemsOn(date);
  const h=holidayOn(date);
  const byOut=new Map();
  items.forEach(({o,t,c})=>{if(!byOut.has(o.id))byOut.set(o.id,{o,items:[]});byOut.get(o.id).items.push({t,c});});
  const body=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>
    `<div class="out-block" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:6px">
        <i style="width:10px;height:10px;border-radius:3px;background:${g.o.color};display:inline-block"></i>${esc(g.o.name)}
        <span class="mono" style="color:var(--ink-3);font-weight:400;font-size:11px">${g.items.length}</span></div>
      ${g.items.map(({t,c})=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);padding:7px 12px;background:var(--surface-2);border-radius:9px;margin-bottom:5px">
        <span>${esc(t.name)}</span><span style="color:${c.color};font-weight:600;flex:none">${esc(c.name)}</span></div>`).join('')}
    </div>`).join('')||'<div class="hint">Nothing scheduled.</div>';
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${DOW[dowOf(date)]}, ${fmtY(date)}</h3><span class="spacer"></span>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      ${h?`<div class="note"><b>${esc(h.label)}</b>${dayType(h.typeId).working?'Work continues.':'Blocked, except outlets marked works-anyway.'}</div>`:''}
      ${body}</div>
    <div class="mod-f"><button class="btn" id="drillDay">Open day view</button>
      <span class="spacer"></span><button class="btn" onclick="closeModal()">Done</button></div></div>`);
  document.getElementById('drillDay').onclick=()=>{UI.calMode='day';UI.calDate=date;closeModal();render();};
}
</script>

<script>
/* =========================== CRITICAL PATH =========================== */
function viewCritical(){
  const o=outletOf(UI.outlet)||DB.outlets[0];
  if(!o) return `<div class="card"><div class="card-b">
    No outlets yet. <button class="btn pri" id="btnImport2">Import a critical path from Excel</button></div></div>`;
  UI.outlet=o.id;

  const [ws,we]=outletSpan(o);
  const days=range(ws,we);
  const t=today();

  const head=days.map(d=>{
    const h=holidayOn(d); const dt=h?dayType(h.typeId):null;
    const worked=h&&(o.worksOn||[]).includes(d);
    const dd=s2d(d);
    return `<th class="d dh ${isWeekend(d)?'we':''} ${d===t?'today':''} ${h?'hol':''}"
      style="${h?`background:${dt.color};`:''}" data-hday="${d}"
      title="${h?esc(h.label)+(worked?' — '+o.name+' works this day':''):'Click to mark this day'}">
      <div class="dow">${DOW[dd.getDay()][0]}</div>
      <div class="dd">${dd.getDate()}</div>
      <div class="mo">${dd.getDate()===1||d===days[0]?MON[dd.getMonth()]:''}</div></th>`;
  }).join('');

  const rows=o.tasks.map((task,i)=>{
    const c=cat(task.cat);
    const act=new Set(activeDays(o,task));
    const cells=days.map(d=>{
      const h=holidayOn(d); const dt=h?dayType(h.typeId):null;
      const blocked=h&&!dt.working&&!(o.worksOn||[]).includes(d);
      const worked=h&&!dt.working&&(o.worksOn||[]).includes(d);
      const on=act.has(d);
      const first=on&&!act.has(addDays(d,-1)), last=on&&!act.has(addDays(d,1));
      /* Blocked days: full curtain with the label, exactly like the workbook.
         Works-anyway days: faint curtain behind the bars, so the day still reads
         as special but the work shows through. */
      const curtain=h&&!dt.working?`<div class="holcurtain ${worked?'soft':''}" style="background:${dt.color}"></div>`:'';
      const lbl=(h&&!dt.working&&i===0)?`<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:680;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;color:${worked?dt.color:(dt.text||'#fff')};z-index:3;pointer-events:none">${esc(h.label)}</span>`:'';
      return `<td class="d cell ${isWeekend(d)?'we':''}" data-cell="${task.id}" data-d="${d}">
        ${curtain}${on?`<div class="gbar ${first?'s':''} ${last?'e':''} ${task.ms?'ms':''}" style="--barc:${c.color}"></div>`:''}${lbl}</td>`;
    }).join('');
    return `<tr data-row="${task.id}">
      <td class="lab">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="catdot" style="background:${c.color}"></span>
          <div style="min-width:0;flex:1">
            <span class="tname" title="${esc(task.name)}">${task.ms?'<span class="msflag">◆</span> ':''}${esc(task.name)}</span>
            <span class="tmeta mono">${fmt(task.start)}–${fmt(task.end)} · ${workDays(o,task)}d${task.resp?' · '+esc(task.resp.split('/')[0].trim()):''}</span>
          </div>
          <div class="rowbtns noprint">
            <button class="ibtn" data-tedit="${task.id}" title="Edit">✎</button>
            <button class="ibtn" data-tms="${task.id}" title="Milestone" style="${task.ms?'color:var(--warn)':''}">◆</button>
            <button class="ibtn" data-tup="${task.id}" title="Move up">↑</button>
            <button class="ibtn" data-tdn="${task.id}" title="Move down">↓</button>
            <button class="ibtn del" data-tdel="${task.id}" title="Delete">✕</button>
          </div>
        </div>
      </td>${cells}</tr>`;
  }).join('');

  const sug=(DB.suggestedHolidays||[]).filter(s=>!holidayOn(s.date));
  const ms=o.tasks.filter(x=>x.ms).length;
  const worksHere=(o.worksOn||[]).filter(d=>holidayOn(d));

  return `<div class="card">
    <div class="card-h">
      <h2>Critical Path</h2>
      <select id="cpOutlet">${DB.outlets.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <span class="sub hidesm">${fmtY(ws)} → ${fmtY(we)}</span>
      <span class="spacer"></span>
      <button class="btn sm pri" id="cpAdd">Add task</button>
      <button class="btn sm" id="cpToday">Today</button>
      <button class="btn sm" id="expPNG" data-t="cpWrap">PNG</button>
      <button class="btn sm" id="expPDF" data-t="cpWrap">PDF</button>
      <button class="btn sm dngr" id="cpDelOut">Delete outlet</button>
    </div>
    <div class="bar">
      <div class="stat">
        <div><b>${o.tasks.length}</b><span>Tasks</span></div>
        <div><b>${ms}</b><span>Milestones</span></div>
        <div><b>${days.length}</b><span>Cal. days</span></div>
        <div><b>${days.filter(d=>!blockedOn(o,d)).length}</b><span>Work days</span></div>
        <div><b class="mono" style="font-size:16px">${fmt(handoverDate(o))}</b><span>Handover</span></div>
        ${o.launch?`<div><b class="mono" style="font-size:16px;color:var(--accent)">${fmt(o.launch)}</b><span>Launch</span></div>`:''}
      </div>
      <span class="spacer"></span>
      <span class="hint hidesm">Click a date header to mark a holiday · click a cell to extend a bar or knock a day out</span>
    </div>
    ${worksHere.length?`<div class="card-b" style="padding:10px 20px;border-bottom:1px solid var(--line)">
      <span class="hint"><b>${esc(o.name)} works through:</b> ${worksHere.map(d=>{
        const h=holidayOn(d); return fmt(d)+' ('+esc(h.label)+')';}).join(' · ')}</span></div>`:''}
    ${sug.length?`<div class="card-b" style="padding:14px 20px 0;border-bottom:0"><div class="note">
      <b>${sug.length} date${sug.length===1?'':'s'} look like unmarked non-working days</b>
      Tasks pause on ${sug.slice(0,6).map(s=>fmt(s.date)).join(', ')}${sug.length>6?'…':''} across several outlets,
      but nothing is marked. Add them as holidays and every bar recalculates.
      <div style="margin-top:8px"><button class="btn sm" id="cpAddSug">Add all as non-working days</button>
      <button class="btn sm ghost" id="cpDismissSug">Dismiss</button></div></div></div>`:''}
    <div class="gantt" id="cpWrap" data-keepscroll="cp">
      <table class="gt"><thead><tr><th class="lab">Task <span style="color:var(--ink-3);font-weight:400">(${o.tasks.length})</span></th>${head}</tr></thead>
      <tbody>${rows||`<tr><td class="lab" colspan="99" style="padding:20px">No tasks yet — use <b>Add task</b>.</td></tr>`}</tbody></table>
    </div>
  </div>`;
}

/* ------------------------- task editor ------------------------- */
function editTask(outId,taskId){
  const o=outletOf(outId);
  const t=taskId?o.tasks.find(x=>x.id===taskId):{
    id:uid('t'),name:'',start:today(),end:today(),skip:[],resp:'',dept:'',cat:'other',ms:false,done:null};
  const isNew=!taskId;
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${isNew?'Add task':'Edit task'}</h3>
      <span class="sub">${esc(o.name)}</span><span class="spacer"></span>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      <div class="fld"><label>Task name</label>
        <input type="text" id="f_name" value="${esc(t.name)}" placeholder="e.g. Backwall Fitouts (SS | Furniture | Graphics)"></div>
      <div class="grid2">
        <div class="fld"><label>Start date</label><input type="date" id="f_start" value="${t.start}"></div>
        <div class="fld"><label>End date</label><input type="date" id="f_end" value="${t.end}"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Responsibility</label><input type="text" id="f_resp" value="${esc(t.resp)}" placeholder="Udara / Nisal"></div>
        <div class="fld"><label>Department</label><input type="text" id="f_dept" value="${esc(t.dept)}" placeholder="Projects / IT"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Category</label><select id="f_cat">
          ${DB.categories.map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>Progress %</label><input type="number" id="f_done" min="0" max="100" step="5" value="${t.done==null?'':t.done}" placeholder="—"></div>
      </div>
      <div class="fld"><label class="cbrow"><input type="checkbox" id="f_ms" ${t.ms?'checked':''}> Count this task in the milestone for its category</label></div>
      ${(t.skip||[]).length?`<div class="fld"><label>Days knocked out of this task</label>
        <div class="chips">${t.skip.map(d=>`<button class="fchip on" data-unskip="${d}" style="color:var(--danger)"><i></i>${fmt(d)} ✕</button>`).join('')}</div>
        <div class="hint">Inside the range but not worked. Click to put a day back.</div></div>`:''}
      <div class="hint">Working days = start to end, less programme holidays this outlet observes, less the days above.</div>
    </div>
    <div class="mod-f">
      <button class="btn pri" id="f_save">${isNew?'Add task':'Save changes'}</button>
      ${isNew?'':'<button class="btn" id="f_dup">Duplicate</button>'}
      ${isNew?'':'<button class="btn" id="f_up" title="Move up">↑</button><button class="btn" id="f_dn" title="Move down">↓</button>'}
      <span class="spacer"></span>
      ${isNew?'':'<button class="btn dngr" id="f_del">Delete</button>'}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div></div>`);

  const read=()=>{
    const v=id=>document.getElementById(id).value;
    let s=v('f_start'),e=v('f_end');
    if(e<s)[s,e]=[e,s];
    return {...t,name:v('f_name').trim()||'Untitled task',start:s,end:e,
      resp:v('f_resp').trim(),dept:v('f_dept').trim(),cat:v('f_cat'),
      ms:document.getElementById('f_ms').checked,
      done:v('f_done')===''?null:Math.max(0,Math.min(100,+v('f_done'))),
      skip:(t.skip||[]).filter(d=>d>=s&&d<=e)};
  };
  document.getElementById('f_save').onclick=()=>{
    const n=read();
    if(isNew)o.tasks.push(n);else Object.assign(t,n);
    markDirty(); closeModal(); render();
  };
  document.getElementById('f_dup')?.addEventListener('click',()=>{
    const n={...read(),id:uid('t'),name:read().name+' (copy)'};
    o.tasks.splice(o.tasks.indexOf(t)+1,0,n); markDirty(); closeModal(); render();
  });
  const shift=d=>{
    const i=o.tasks.indexOf(t),j=i+d;
    if(j<0||j>=o.tasks.length)return;
    [o.tasks[i],o.tasks[j]]=[o.tasks[j],o.tasks[i]];
    markDirty(); closeModal(); render();
  };
  document.getElementById('f_up')?.addEventListener('click',()=>shift(-1));
  document.getElementById('f_dn')?.addEventListener('click',()=>shift(1));
  document.getElementById('f_del')?.addEventListener('click',()=>{
    if(!confirm('Delete "'+t.name+'"?'))return;
    o.tasks=o.tasks.filter(x=>x.id!==t.id); markDirty(); closeModal(); render();
  });
  document.querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{
    t.skip=t.skip.filter(d=>d!==b.dataset.unskip); markDirty(); editTask(outId,taskId);
  });
}

/* ------------------------- holiday editor ------------------------- */
/* One programme calendar for everyone; per-outlet works-anyway exceptions. */
function editHoliday(outId,date){
  const o=outId?outletOf(outId):null;
  const cur=holidayOn(date);
  const works=o&&(o.worksOn||[]).includes(date);
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${DOW[dowOf(date)]}, ${fmtY(date)}</h3><span class="spacer"></span>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      <div class="fld"><label>Label shown on the chart</label>
        <input type="text" id="h_label" value="${esc(cur?cur.label:'')}" placeholder="POYA DAY"></div>
      <div class="fld"><label>Day type</label><select id="h_type">
        ${DB.dayTypes.map(dt=>`<option value="${dt.id}" ${cur&&cur.typeId===dt.id?'selected':''}>${esc(dt.name)}${dt.working?' — work continues':' — no work'}</option>`).join('')}</select></div>
      <div class="note blue"><b>Applies to every outlet.</b>Marking this day puts it on the programme
        calendar — all outlets pause here and their bars recalculate.</div>
      ${o?`<div class="fld"><label class="cbrow"><input type="checkbox" id="h_works" ${works?'checked':''}>
        ${esc(o.name)} works on this day anyway</label>
        <div class="hint">The exception applies only to this outlet. On the chart the day stays tinted, with the bars showing through.</div></div>`:''}
    </div>
    <div class="mod-f">
      <button class="btn pri" id="h_save">${cur?'Save':'Mark this day'}</button>
      <span class="spacer"></span>
      ${cur?'<button class="btn dngr" id="h_clear">Remove from calendar</button>':''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div></div>`);

  document.getElementById('h_save').onclick=()=>{
    const label=document.getElementById('h_label').value.trim()||'Non-working day';
    const typeId=document.getElementById('h_type').value;
    DB.holidays=DB.holidays.filter(h=>h.date!==date);
    DB.holidays.push({date,label,typeId});
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    if(o){
      const w=document.getElementById('h_works')?.checked;
      o.worksOn=(o.worksOn||[]).filter(d=>d!==date);
      if(w)o.worksOn.push(date), o.worksOn.sort();
    }
    markDirty(); closeModal(); render();
  };
  document.getElementById('h_clear')?.addEventListener('click',()=>{
    DB.holidays=DB.holidays.filter(h=>h.date!==date);
    DB.outlets.forEach(x=>x.worksOn=(x.worksOn||[]).filter(d=>d!==date));
    markDirty(); closeModal(); render();
  });
}

/* --------------- gantt cell click --------------- */
function cellClick(taskId,date){
  const o=outletOf(UI.outlet);
  const t=o.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(blockedOn(o,date)){ editHoliday(UI.outlet,date); return; }
  if(date<t.start){t.start=date;t.skip=(t.skip||[]).filter(d=>d>=t.start);}
  else if(date>t.end){t.end=date;t.skip=(t.skip||[]).filter(d=>d<=t.end);}
  else{
    const s=new Set(t.skip||[]);
    if(s.has(date))s.delete(date);
    else if(date===t.start){const a=activeDays(o,t);if(a.length>1)t.start=a[1];}
    else if(date===t.end){const a=activeDays(o,t);if(a.length>1)t.end=a[a.length-2];}
    else s.add(date);
    t.skip=[...s].sort();
  }
  markDirty(); render();
}
</script>

<script>
/* ===================== SETUP: categories, day types, calendar, outlets ===================== */
function viewManage(){
  const catRows=DB.categories.map(c=>{
    const n=DB.outlets.reduce((a,o)=>a+o.tasks.filter(t=>t.cat===c.id).length,0);
    const m=DB.outlets.reduce((a,o)=>a+o.tasks.filter(t=>t.cat===c.id&&t.ms).length,0);
    return `<tr>
      <td><input type="color" value="${c.color}" data-ccol="${c.id}"></td>
      <td><input type="text" value="${esc(c.name)}" data-cname="${c.id}" style="width:100%;min-width:170px"></td>
      <td class="mono">${n}</td><td class="mono">${m}</td>
      <td><label class="cbrow"><input type="checkbox" data-cms="${c.id}" ${c.inMilestones?'checked':''}> Matrix</label></td>
      <td><label class="cbrow"><input type="checkbox" data-ccal="${c.id}" ${c.inCalendar?'checked':''}> Calendar</label></td>
      <td><button class="ibtn del" data-cdel="${c.id}" title="Delete">✕</button></td>
    </tr>`;}).join('');

  const dtRows=DB.dayTypes.map(d=>`<tr>
      <td><input type="color" value="${d.color}" data-dcol="${d.id}"></td>
      <td><input type="text" value="${esc(d.name)}" data-dname="${d.id}" style="width:100%;min-width:160px"></td>
      <td><label class="cbrow"><input type="checkbox" data-dwork="${d.id}" ${d.working?'checked':''}> Work continues</label></td>
      <td class="mono">${DB.holidays.filter(h=>h.typeId===d.id).length}</td>
      <td><button class="ibtn del" data-ddel="${d.id}">✕</button></td>
    </tr>`).join('');

  const hols=[...DB.holidays].sort((a,b)=>a.date.localeCompare(b.date));
  const holRows=hols.map(h=>{
    const dt=dayType(h.typeId);
    const exc=DB.outlets.filter(o=>(o.worksOn||[]).includes(h.date));
    return `<tr>
      <td class="mono" style="white-space:nowrap">${fmtY(h.date)}<div class="tmeta">${DOW[dowOf(h.date)]}</div></td>
      <td><input type="text" value="${esc(h.label)}" data-hlbl="${h.date}" style="width:100%;min-width:180px"></td>
      <td><select data-htype="${h.date}">${DB.dayTypes.map(x=>`<option value="${x.id}" ${x.id===h.typeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></td>
      <td style="font-size:11.5px;color:var(--ink-2)">${dt.working?'Work continues everywhere'
        :exc.length?`Blocked, except: ${exc.map(o=>esc(o.name)).join(', ')}`:'Blocked for every outlet'}</td>
      <td><button class="ibtn del" data-hdel="${h.date}">✕</button></td>
    </tr>`;}).join('');

  const olRows=DB.outlets.map(o=>{
    const [s,e]=outletSpan(o);
    return `<tr>
      <td><input type="color" value="${o.color}" data-ocol="${o.id}"></td>
      <td><input type="text" value="${esc(o.name)}" data-oname="${o.id}" style="width:100%;min-width:150px"></td>
      <td class="mono">${o.tasks.length}</td>
      <td class="mono">${o.tasks.filter(t=>t.ms).length}</td>
      <td class="mono" style="white-space:nowrap">${fmt(s)} – ${fmt(e)}</td>
      <td class="mono">${(o.worksOn||[]).length}</td>
      <td><button class="ibtn del" data-odel="${o.id}">✕</button></td>
    </tr>`;}).join('');

  return `
  <div class="card">
    <div class="card-h"><h2>Categories</h2>
      <span class="sub">Work packages — each becomes one row of the milestone matrix</span><span class="spacer"></span>
      <button class="btn sm pri" id="catAdd">Add category</button></div>
    <div class="scroll"><table class="tbl"><thead><tr>
      <th></th><th>Name</th><th>Tasks</th><th>Flagged</th><th>Matrix</th><th>Calendar</th><th></th></tr></thead>
      <tbody>${catRows}</tbody></table></div>
    <div class="card-b hint">Switching a category off hides it — nothing is deleted. Deleting one moves its tasks to <b>Other</b>. Tasks in Other always show individually on the calendar.</div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Day types</h2>
      <span class="sub">How a marked day is drawn, and whether work counts</span><span class="spacer"></span>
      <button class="btn sm pri" id="dtAdd">Add day type</button></div>
    <div class="scroll"><table class="tbl"><thead><tr>
      <th></th><th>Name</th><th>Behaviour</th><th>Days marked</th><th></th></tr></thead>
      <tbody>${dtRows}</tbody></table></div>
  </div>

  <div class="card">
    <div class="card-h"><h2>Programme calendar</h2>
      <span class="sub">${hols.length} day${hols.length===1?'':'s'} marked — every holiday applies to all outlets</span><span class="spacer"></span>
      <input type="date" id="holNewDate" value="${today()}">

/* ========================== EXCEL IMPORT ========================== */
const CAT_RULES=[
 ['prep',/tempor|tempory|to the container|equipment removal|rack arrangement|temporary setup/i],
 ['merchandising',/merchandi|merchendi|bulk bin/i],
 ['cookedsweet',/cooked sweet/i],
 ['juicebakery',/juice|bakery/i],
 ['kitchen',/kitchen/i],
 ['backwall',/back ?wall|back area|backwall/i],
 ['fresh',/fresh|leafy|pola bunk/i],
 ['relocation',/relocat|moving pizza|pharmacy|cctv|bottle cooler|8 door|dairy|siren/i],
 ['handover',/handing over|hand over|final finishing|troubleshoot|final touch/i],
 ['civil',/tiling|blockwall|block wall|floor leveling|perimeter wall|sokage|hume pipe|civil|plinth|cool room|demolition/i],
 ['mep',/electric|conduit|plumb|gas line|canopy|network|\bit\b|power supply|linear light|signage|neon|tv bracket|\bac\b|trunking|duct|lighting/i]];
const MS_RULE=/handing over|hand over|partition installation|partition removal|merchandi|merchendi|fit ?out works \(ss\)|back ?wall fitouts|equipment placing|equipment commission|final finishing|new store arrangement|setting up the back wall/i;
function guessCat(n){for(const[id,re]of CAT_RULES)if(re.test(n))return id;return 'other';}
function labelType(l){
  const u=(l||'').toUpperCase();
  if(u.includes('POYA'))return 'poya';
  if(u.includes('PUBLIC')||u.includes('HOLIDAY'))return 'public';
  if(u.includes('STOCK'))return 'stock';
  return 'noworks';
}
function jsd(v){
  if(v instanceof Date&&!isNaN(v))return d2s(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  return null;
}
function parseWorkbook(wb){
  const results=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    if(!grid.length)return;
    let hr=-1,best=0;
    for(let r=0;r<Math.min(8,grid.length);r++){
      const n=(grid[r]||[]).filter((v,i)=>i>=3&&jsd(v)).length;
      if(n>best){best=n;hr=r;}
    }
    if(hr<0||best<3)return;
    const dateCols={};
    (grid[hr]||[]).forEach((v,i)=>{const d=jsd(v);if(d&&i>=3)dateCols[i]=d;});
    const dcIdx=Object.keys(dateCols).map(Number).sort((a,b)=>a-b);
    const firstDC=dcIdx[0];
    const find=(re,fb)=>{const i=(grid[hr]||[]).findIndex((v,i)=>i<firstDC&&typeof v==='string'&&re.test(v));return i>=0?i:fb;};
    const cDesc=find(/descript/i,4),cResp=find(/responsib/i,5),cLvl=find(/completed/i,6),cDept=find(/department/i,7);
    const hols={};
    (ws['!merges']||[]).forEach(m=>{
      if(m.s.c!==m.e.c||m.s.r<=hr)return;
      if(!(m.s.c in dateCols))return;
      const v=(grid[m.s.r]||[])[m.s.c];
      if(typeof v==='string'&&v.trim())hols[dateCols[m.s.c]]={label:v.trim().replace(/\s+/g,' '),typeId:labelType(v)};
    });
    const tasks=[];
    for(let r=hr+1;r<grid.length;r++){
      const row=grid[r]||[];
      const nm=row[cDesc];
      if(typeof nm!=='string'||!nm.trim())continue;
      const bars=dcIdx.filter(i=>{const v=row[i];return v===1||v==='1'||v===true;});
      if(!bars.length)continue;
      const start=dateCols[bars[0]],end=dateCols[bars[bars.length-1]];
      const lvl=row[cLvl];
      const name=String(nm).replace(/\s+/g,' ').trim();
      tasks.push({id:uid('t'),name,start,end,
        _on:new Set(bars.map(i=>dateCols[i])),
        resp:row[cResp]?String(row[cResp]).replace(/\s+/g,' ').trim():'',
        dept:row[cDept]?String(row[cDept]).replace(/\s+/g,' ').trim():'',
        cat:guessCat(name),ms:MS_RULE.test(name),
        done:(typeof lvl==='number'&&lvl<=1)?lvl*100:null});
    }
    if(!tasks.length)return;
    results.push({
      id:sn.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid('o'),
      name:sn.trim(),
      start:tasks.map(t=>t.start).sort()[0],
      end:tasks.map(t=>t.end).sort().pop(),
      _hols:hols, worksOn:[], launch:null, tasks});
  });
  return results;
}
/** After picking sheets: fold holidays into the global calendar, work out
    works-anyway exceptions from the bar data, then compute per-task skips. */
function finaliseImport(imported){
  imported.forEach(o=>{
    Object.entries(o._hols).forEach(([date,h])=>{
      if(!DB.holidays.some(g=>g.date===date))
        DB.holidays.push({date,label:h.label,typeId:h.typeId});
    });
  });
  DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
  const blockedDates=DB.holidays.filter(h=>!dayType(h.typeId).working).map(h=>h.date);
  imported.forEach(o=>{
    const worked=new Set();
    o.tasks.forEach(t=>t._on.forEach(d=>worked.add(d)));
    o.worksOn=blockedDates.filter(d=>worked.has(d));
    const blocked=new Set(blockedDates.filter(d=>!o.worksOn.includes(d)));
    o.tasks.forEach(t=>{
      t.skip=range(t.start,t.end).filter(d=>!t._on.has(d)&&!blocked.has(d));
      delete t._on;
    });
    delete o._hols;
  });
}
function handleXlsx(file){
  const fr=new FileReader();
  fr.onload=e=>{
    let found;
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      found=parseWorkbook(wb);
    }catch(err){toast('Could not read that file: '+err.message);return;}
    if(!found.length){toast('No critical paths found — check for a date row and a Description column');return;}
    const rows=found.map((o,i)=>{
      const exists=DB.outlets.some(x=>x.name.toLowerCase()===o.name.toLowerCase());
      return `<tr><td><label class="cbrow"><input type="checkbox" data-imp="${i}" checked> ${esc(o.name)}</label></td>
        <td class="mono">${o.tasks.length}</td><td class="mono">${fmt(o.start)} – ${fmt(o.end)}</td>
        <td class="mono">${Object.keys(o._hols).length}</td>
        <td>${exists?'<span class="fchip on" style="color:var(--warn)"><i></i>Replaces existing</span>':'<span class="fchip on" style="color:var(--ok)"><i></i>New</span>'}</td></tr>`;
    }).join('');
    showModal(`<div class="mod wide"><div class="mod-h"><h3>Import critical paths</h3>
        <span class="sub">${found.length} sheet${found.length===1?'':'s'} read from ${esc(file.name)}</span>
        <span class="spacer"></span><button class="x" onclick="closeModal()">✕</button></div>
      <div class="mod-b">
        <div class="scroll" style="max-height:46vh"><table class="tbl"><thead><tr>
          <th>Outlet</th><th>Tasks</th><th>Window</th><th>Marked days</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div class="fld" style="margin-top:14px"><label class="cbrow">
          <input type="checkbox" id="imp_keep" checked> Keep my category and milestone choices where the task name is unchanged</label></div>
      </div>
      <div class="mod-f"><button class="btn pri" id="imp_go">Import selected</button>
        <span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button></div></div>`);
    document.getElementById('imp_go').onclick=()=>{
      const keep=document.getElementById('imp_keep').checked;
      const chosen=[...document.querySelectorAll('[data-imp]:checked')].map(cb=>found[+cb.dataset.imp]);
      finaliseImport(chosen);
      chosen.forEach(o=>{
        const old=DB.outlets.find(x=>x.name.toLowerCase()===o.name.toLowerCase());
        if(old&&keep){
          const prev=new Map(old.tasks.map(t=>[t.name.toLowerCase(),t]));
          o.tasks.forEach(t=>{const p=prev.get(t.name.toLowerCase());if(p){t.cat=p.cat;t.ms=p.ms;if(p.done!=null)t.done=p.done;}});
          o.launch=old.launch;
        }
        if(old){o.id=old.id;o.color=old.color;DB.outlets[DB.outlets.indexOf(old)]=o;}
        else DB.outlets.push(o);
      });
      normalise();
      UI.outlets=new Set(DB.outlets.map(o=>o.id));
      UI.view='critical'; UI.outlet=chosen.length?(DB.outlets.find(x=>x.name.toLowerCase()===chosen[0].name.toLowerCase())||DB.outlets[0]).id:DB.outlets[0].id;
      markDirty(); closeModal(); render();
      toast(chosen.length+' outlet'+(chosen.length===1?'':'s')+' imported — check the categories, then Save');
    };
  };
  fr.readAsArrayBuffer(file);
}

function exportJSON(){
  const out={...DB,generatedAt:today(),version:3};
  delete out._localAt;delete out._stale;
  const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='data.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('Commit this next to index.html to publish it');
}
async function exportImage(targetId,pdf){
  const el=document.getElementById(targetId);
  if(!el){toast('Nothing to export');return;}
  toast('Rendering…');
  const prevH=el.style.maxHeight,prevO=el.style.overflow;
  el.style.maxHeight='none';el.style.overflow='visible';
  try{
    const w=el.scrollWidth+40;
    const scale=Math.max(1,Math.min(2,3600/w));
    const canvas=await html2canvas(el,{scale,backgroundColor:'#ffffff',windowWidth:w});
    const name='moonshot-'+UI.view+'-'+today();
    if(pdf){
      const {jsPDF}=window.jspdf;
      const land=canvas.width>canvas.height;
      const doc=new jsPDF({orientation:land?'l':'p',unit:'pt',format:'a3',compress:true});
      const pw=doc.internal.pageSize.getWidth()-36,ph=doc.internal.pageSize.getHeight()-36;
      const r=Math.min(pw/canvas.width,ph/canvas.height);
      doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',18,18,canvas.width*r,canvas.height*r,undefined,'FAST');
      doc.save(name+'.pdf');
    }else{
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');a.download=name+'.png';a.click();
    }
  }catch(e){toast('Export failed: '+e.message);}
  el.style.maxHeight=prevH;el.style.overflow=prevO;
}

  // tabs
  document.querySelectorAll('#tabs [data-v]').forEach(b=>b.onclick=()=>{UI.view=b.dataset.v;render();});

  document.querySelectorAll('#expPNG').forEach(b=>b.onclick=()=>exportImage(b.dataset.t,false));
  document.querySelectorAll('#expPDF').forEach(b=>b.onclick=()=>exportImage(b.dataset.t,true));

  /* ---- milestones ---- */
  document.querySelectorAll('[data-mscat]').forEach(b=>b.onclick=()=>{
    const c=cat(b.dataset.mscat); c.inMilestones=!c.inMilestones; markDirty(); render();
  });
  on('msStrike',()=>{UI.strike=!UI.strike;render();});
  on('msEdit',()=>{UI.msEdit=!UI.msEdit;render();});
  document.querySelectorAll('[data-mspick]').forEach(el=>el.onclick=()=>{
    const [oid,cid]=el.dataset.mspick.split('|'); msCellEditor(oid,cid);

  document.querySelectorAll('[data-launch]').forEach(el=>el.onclick=()=>launchEditor(el.dataset.launch));

  /* ---- calendar ---- */
  document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{UI.calMode=b.dataset.cal;render();});
  const step=n=>{
    if(UI.calMode==='month'){const d=s2d(UI.calDate.slice(0,7)+'-01');d.setMonth(d.getMonth()+n);UI.calDate=d2s(d);}
    else UI.calDate=addDays(UI.calDate,n*(UI.calMode==='week'?7:1));
    render();
  };
  on('calPrev',()=>step(-1)); on('calNext',()=>step(1));
  on('calToday',()=>{UI.calDate=today();render();});
  const cj=$('calJump'); if(cj)cj.onchange=()=>{if(cj.value){UI.calDate=cj.value;render();}};
  const co=$('calOut'); if(co)co.onchange=()=>{
    UI.outlets=co.value==='__all'?new Set(DB.outlets.map(o=>o.id)):new Set([co.value]); render();
  };
  on('calGroup',()=>{UI.group=!UI.group;render();});
  on('calAll',()=>{DB.categories.forEach(c=>c.inCalendar=true);markDirty();render();});
  on('calNone',()=>{DB.categories.forEach(c=>c.inCalendar=false);markDirty();render();});
  document.querySelectorAll('[data-calcat]').forEach(b=>b.onclick=()=>{
    const c=cat(b.dataset.calcat); c.inCalendar=!c.inCalendar; markDirty(); render();
  });
  document.querySelectorAll('.chip[data-day],.more[data-day]').forEach(b=>b.onclick=()=>dayDrill(b.dataset.day));

  /* ---- critical path ---- */
  const cpo=$('cpOutlet'); if(cpo)cpo.onchange=()=>{UI.outlet=cpo.value;render();};
  on('cpAdd',()=>editTask(UI.outlet,null));
  on('btnImport2',()=>$('fileXl').click());
  on('cpToday',()=>{
    const el=document.querySelector(`[data-hday="${today()}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    else toast('Today is outside this outlet\'s window');
  });
  on('cpDelOut',()=>{
    const o=outletOf(UI.outlet);
    if(!o||!confirm('Delete "'+o.name+'" and its '+o.tasks.length+' tasks?'))return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    UI.outlets.delete(o.id);
    UI.outlet=DB.outlets[0]?.id||null;
    markDirty(); render();
  });
  on('cpAddSug',()=>{
    (DB.suggestedHolidays||[]).forEach(s=>{
      if(!holidayOn(s.date))DB.holidays.push({date:s.date,label:'NON-WORKING DAY',typeId:'noworks'});
    });
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    DB.suggestedHolidays=[];
    markDirty(); render();
    toast('Added — bars recalculated');
  });
  on('cpDismissSug',()=>{DB.suggestedHolidays=[];markDirty();render();});
  document.querySelectorAll('[data-hday]').forEach(el=>el.onclick=()=>editHoliday(UI.outlet,el.dataset.hday));
  document.querySelectorAll('[data-cell]').forEach(el=>el.onclick=()=>cellClick(el.dataset.cell,el.dataset.d));
  document.querySelectorAll('[data-tedit]').forEach(b=>b.onclick=e=>{e.stopPropagation();editTask(UI.outlet,b.dataset.tedit);});

  document.querySelectorAll('[data-tdn]').forEach(b=>b.onclick=e=>{e.stopPropagation();moveTask(b.dataset.tdn,1);});
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const o=outletOf(UI.outlet),t=o.tasks.find(x=>x.id===b.dataset.tdel);

    DB.categories=DB.categories.filter(x=>x.id!==c.id);
    markDirty(); render();

  on('dtAdd',()=>{

  });
  document.querySelectorAll('[data-dcol]').forEach(i=>i.onchange=()=>{dayType(i.dataset.dcol).color=i.value;markDirty();render();});
  document.querySelectorAll('[data-dname]').forEach(i=>i.onchange=()=>{dayType(i.dataset.dname).name=i.value.trim()||'Day type';markDirty();render();});
  document.querySelectorAll('[data-dwork]').forEach(i=>i.onchange=()=>{dayType(i.dataset.dwork).working=i.checked;markDirty();render();});
  document.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=()=>{

    DB.dayTypes=DB.dayTypes.filter(x=>x.id!==d.id);
