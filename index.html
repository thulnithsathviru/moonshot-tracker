<script>
/* ============================== WIRING ============================== */
function wire(){
  const $=id=>document.getElementById(id);
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};

  // tabs
  document.querySelectorAll('#tabs [data-v]').forEach(b=>b.onclick=()=>{UI.view=b.dataset.v;render();});

  /* ---- shared outlet picker ---- */
  on('outAll',()=>{UI.outlets=new Set(DB.outlets.map(o=>o.id));render();});
  on('outNone',()=>{UI.outlets=new Set();render();});
  document.querySelectorAll('[data-outsel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.outsel;
    if(UI.outlets.has(id))UI.outlets.delete(id);else UI.outlets.add(id);
    render();
  });

  /* ---- milestones ---- */
  document.querySelectorAll('[data-mscat]').forEach(b=>b.onclick=()=>{
    const c=cat(b.dataset.mscat); c.inMilestones=!c.inMilestones; markDirty(); render();
  });
  on('msStrike',()=>{UI.strike=!UI.strike;render();});
  document.querySelectorAll('[data-launch]').forEach(el=>el.onclick=()=>launchEditor(el.dataset.launch));

  /* ---- calendar ---- */
  document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{UI.calMode=b.dataset.cal;render();});
  const step=n=>{
    if(UI.calMode==='month'){const d=s2d(UI.calDate.slice(0,7)+'-01');d.setMonth(d.getMonth()+n);UI.calDate=d2s(d);}
    else UI.calDate=addDays(UI.calDate,n*(UI.calMode==='week'?7:1));
    render();
  };
  on('calPrev',()=>step(-1)); on('calNext',()=>step(1));
  on('calToday',()=>{UI.calDate=today();render();});
  const cj=$('calJump');
  if(cj){ const go=()=>{if(cj.value&&cj.value!==UI.calDate){UI.calDate=cj.value;render();}};
          cj.onchange=go; cj.oninput=go; }
  const cm=$('calJumpM');
  if(cm){ const go=()=>{if(cm.value&&cm.value!==UI.calDate.slice(0,7)){UI.calDate=cm.value+'-01';render();}};
          cm.onchange=go; cm.oninput=go; }
  document.querySelectorAll('.chip[data-day],.more[data-day]').forEach(b=>b.onclick=()=>dayDrill(b.dataset.day));

  /* ---- critical path ---- */
  const cpo=$('cpOutlet'); if(cpo)cpo.onchange=()=>{UI.outlet=cpo.value;render();};
  on('cpAdd',()=>{
    const o=outletOf(UI.outlet); if(!o)return;
    const [ws]=outletSpan(o);
    o.tasks.push({id:uid('t'),name:'New task',start:ws,end:ws,skip:[],resp:'',dept:'',cat:null,done:null});
    UI.cpEdit=true; markDirty(); render();
    const w=$('cpWrap'); if(w)w.scrollTop=w.scrollHeight;
  });
  on('btnImport2',()=>$('fileXl').click());
  on('cpToday',()=>{
    const el=document.querySelector(`[data-hday="${today()}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    else toast("Today is outside this outlet's window");
  });
  on('cpDelOut',async()=>{
    const o=outletOf(UI.outlet); if(!o)return;
    if(!await uiConfirm(`Delete <b>${esc(o.name)}</b> and its ${o.tasks.length} tasks?`,{title:'Delete outlet',ok:'Delete',danger:true}))return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    UI.outlets.delete(o.id);
    UI.outlet=DB.outlets[0]?.id||null;
    markDirty(); render();
  });
  on('cpAddSug',()=>{
    const nw=dayTypeRaw('noworks')?'noworks':null;   // never stamp a type that isn't there
    (DB.suggestedHolidays||[]).forEach(s=>{
      if(!holidayOn(s.date))DB.holidays.push({date:s.date,label:nw?dayType(nw).name.toUpperCase():'',typeId:nw});
    });
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    DB.suggestedHolidays=[];
    markDirty(); render();
    toast('Added — bars recalculated');
  });
  on('cpDismissSug',()=>{DB.suggestedHolidays=[];markDirty();render();});
  document.querySelectorAll('[data-cell]').forEach(el=>el.onclick=()=>cellClick(el.dataset.cell,el.dataset.d));

  // inline editing (Edit mode)
  const task=id=>{const o=outletOf(UI.outlet);return o&&o.tasks.find(x=>x.id===id);};
  const bindF=(sel,fn,rerender)=>document.querySelectorAll(sel).forEach(inp=>inp.onchange=()=>{
    const t=task(inp.dataset.fname||inp.dataset.fresp||inp.dataset.fdept);
    if(!t)return; fn(t,inp.value); markDirty(); if(rerender)render();
  });
  bindF('[data-fname]',(t,v)=>{
    const name=v.trim()||'Untitled task';
    t.name=name;
    const k=name.toLowerCase();
    if(k in DB.taskMap)t.cat=DB.taskMap[k];     // renamed onto a known task → its category
    else DB.taskMap[k]=t.cat;                    // new name → remember its category
  },true);
  bindF('[data-fresp]',(t,v)=>{t.resp=v.trim();},false);
  bindF('[data-fdept]',(t,v)=>{t.dept=v.trim();},false);
  document.querySelectorAll('[data-tup]').forEach(b=>b.onclick=()=>moveTask(b.dataset.tup,-1));
  document.querySelectorAll('[data-tdn]').forEach(b=>b.onclick=()=>moveTask(b.dataset.tdn,1));
  document.querySelectorAll('[data-tdup]').forEach(b=>b.onclick=()=>{
    const o=outletOf(UI.outlet), t=task(b.dataset.tdup); if(!t)return;
    o.tasks.splice(o.tasks.indexOf(t)+1,0,{...JSON.parse(JSON.stringify(t)),id:uid('t'),name:t.name+' (copy)'});
    markDirty(); render();
  });
  document.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=async()=>{
    const o=outletOf(UI.outlet), t=task(b.dataset.tdel); if(!t)return;
    if(!await uiConfirm(`Delete “${esc(t.name)}”?`,{title:'Delete task',ok:'Delete',danger:true}))return;
    o.tasks=o.tasks.filter(x=>x!==t); markDirty(); render();
  });
  cpAttachAutoPan();

  /* ---- setup ---- */
  on('catAdd',async()=>{
    const name=await uiPrompt('',{title:'Add category',placeholder:'e.g. Signage Works'});
    if(!name)return;
    DB.categories.push({id:uid('c'),name,color:'#5856D6',inMilestones:true,inCalendar:true});
    markDirty(); render();
  });
  document.querySelectorAll('[data-ccol]').forEach(i=>i.onchange=()=>{const c=cat(i.dataset.ccol);if(c){c.color=i.value;markDirty();render();}});
  document.querySelectorAll('[data-cname]').forEach(i=>i.onchange=()=>{const c=cat(i.dataset.cname);if(c){c.name=i.value.trim()||'Category';markDirty();render();}});
  document.querySelectorAll('[data-cms]').forEach(i=>i.onchange=()=>{cat(i.dataset.cms).inMilestones=i.checked;markDirty();render();});
  document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{
    const c=cat(b.dataset.cdel); if(!c)return;
    if(!await uiConfirm(`Delete <b>${esc(c.name)}</b>? Its tasks become uncategorised.`,{title:'Delete category',ok:'Delete',danger:true}))return;
    DB.outlets.forEach(o=>o.tasks.forEach(t=>{if(t.cat===c.id)t.cat=null;}));
    Object.keys(DB.taskMap).forEach(k=>{if(DB.taskMap[k]===c.id)DB.taskMap[k]=null;});
    DB.categories=DB.categories.filter(x=>x.id!==c.id);
    markDirty(); render();
  });

  document.querySelectorAll('[data-tmap]').forEach(s=>s.onchange=()=>{
    DB.taskMap[s.dataset.tmap]=s.value||null;
    applyTaskMap();
    markDirty(); render();
  });

  // special-day dates per type
  document.querySelectorAll('[data-htadd]').forEach(b=>b.onclick=()=>{
    const tid=b.dataset.htadd;
    const from=document.querySelector(`[data-htfrom="${tid}"]`).value;
    const to=document.querySelector(`[data-htto="${tid}"]`).value;
    if(!from){toast('Pick a date first');return;}
    if(!dayTypeRaw(tid))return;
    const dates=to&&to>from?range(from,to):[from];
    dates.forEach(d=>{
      DB.holidays=DB.holidays.filter(x=>x.date!==d);
      DB.holidays.push({date:d,label:dayType(tid).name.toUpperCase(),typeId:tid});
    });
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    markDirty(); render();
  });
  document.querySelectorAll('[data-htdel]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.htdel;
    DB.holidays=DB.holidays.filter(h=>h.date!==d);
    DB.outlets.forEach(o=>o.worksOn=(o.worksOn||[]).filter(x=>x!==d));
    markDirty(); render();
  });

  on('dtAdd',async()=>{
    // an empty name is allowed: those days render as a plain coloured column
    const name=await uiPrompt('',{title:'Add day type',placeholder:'e.g. Stock Count — leave blank for no label',allowEmpty:true});
    if(name===null)return;
    // the legend tells day types apart by colour, so don't hand out a duplicate
    const taken=new Set(DB.dayTypes.map(t=>(t.color||'').toLowerCase()));
    const color=DT_PALETTE.find(c=>!taken.has(c))||DT_PALETTE[DB.dayTypes.length%DT_PALETTE.length];
    DB.dayTypes.push({id:uid('d'),name,color,text:'#ffffff'});
    markDirty(); render();
  });
  document.querySelectorAll('[data-dcol]').forEach(i=>i.onchange=()=>{
    const d=dayTypeRaw(i.dataset.dcol); if(d){d.color=i.value;markDirty();render();}
  });
  document.querySelectorAll('[data-dname]').forEach(i=>i.onchange=()=>{
    const d=dayTypeRaw(i.dataset.dname); if(!d)return;
    d.name=i.value.trim();
    DB.holidays.forEach(h=>{if(h.typeId===d.id)h.label=holLabel(h);});
    markDirty(); render();
  });
  document.querySelectorAll('[data-ddel]').forEach(b=>b.onclick=async()=>{
    const d=dayTypeRaw(b.dataset.ddel); if(!d)return;
    const days=DB.holidays.filter(h=>h.typeId===d.id);
    const nm=d.name?esc(d.name):'this day type';
    if(days.length){
      const ans=await uiConfirm(
        `<b>${days.length} marked day${days.length===1?'':'s'}</b> use ${nm}: ${days.slice(0,8).map(h=>fmt(h.date)).join(', ')}${days.length>8?'…':''}.
         <br><br>Delete those days as well, or keep them marked with no type?`,
        {title:'Delete day type',ok:'Delete the days',alt:'Keep as untyped',cancel:'Cancel',danger:true});
      if(!ans)return;
      if(ans===true){
        const dates=new Set(days.map(h=>h.date));
        DB.holidays=DB.holidays.filter(h=>!dates.has(h.date));
        DB.outlets.forEach(o=>o.worksOn=(o.worksOn||[]).filter(x=>!dates.has(x)));
      }else{
        DB.holidays.forEach(h=>{if(h.typeId===d.id){h.typeId=null;h.label='';}});
      }
    }
    DB.dayTypes=DB.dayTypes.filter(x=>x.id!==d.id);
    markDirty(); render();
  });

  document.querySelectorAll('[data-ocol]').forEach(i=>i.onchange=()=>{
    const o=outletOf(i.dataset.ocol); if(o){o.color=i.value;markDirty();render();}
  });
  document.querySelectorAll('[data-oname]').forEach(i=>i.onchange=()=>{
    const o=outletOf(i.dataset.oname); if(o){o.name=i.value.trim()||o.name;markDirty();render();}
  });
  document.querySelectorAll('[data-odel]').forEach(b=>b.onclick=async()=>{
    const o=outletOf(b.dataset.odel); if(!o)return;
    if(!await uiConfirm(`Delete <b>${esc(o.name)}</b> and its ${o.tasks.length} tasks?`,{title:'Delete outlet',ok:'Delete',danger:true}))return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    UI.outlets.delete(o.id);
    if(UI.outlet===o.id)UI.outlet=DB.outlets[0]?.id||null;
    markDirty(); render();
  });

  // backup
  on('bkDown',exportJSON);
  on('bkXlsx',()=>exportExcel('all'));
  on('bkUp',()=>$('fileJs').click());

  /* ---- persistent chrome ---- */
  const sw=$('editSwitch');
  if(sw){ sw.checked=UI.cpEdit; sw.onchange=()=>{UI.cpEdit=sw.checked;render();}; }
  on('btnExport',exportMenu);
  on('btnImport',()=>$('fileXl').click());
  const fx=$('fileXl');
  if(fx&&!fx._wired){fx._wired=true;fx.onchange=()=>{if(fx.files[0])handleXlsx(fx.files[0]);fx.value='';};}
  const fj=$('fileJs');
  if(fj&&!fj._wired){fj._wired=true;fj.onchange=async()=>{
    const f=fj.files[0]; fj.value='';
    if(!f)return;
    const fr=new FileReader();
    fr.onload=async e=>{
      try{
        const j=JSON.parse(e.target.result);
        if(!j.outlets)throw new Error('not a tracker backup');
        if(!await uiConfirm(`Restore <b>${j.outlets.length} outlets</b> from this backup? It replaces the live data for everyone.`,{title:'Restore backup',ok:'Restore',danger:true}))return;
        DB=j; normalise();
        UI.outlet=DB.outlets[0]?.id; UI.outlets=new Set(DB.outlets.map(o=>o.id));
        markDirty(); render(); toast('Backup restored — publishing…');
      }catch(err){toast('Could not load: '+err.message);}
    };
    fr.readAsText(f);
  };}
}

function moveTask(taskId,d){
  const o=outletOf(UI.outlet);
  const i=o.tasks.findIndex(x=>x.id===taskId),j=i+d;
  if(i<0||j<0||j>=o.tasks.length)return;
  [o.tasks[i],o.tasks[j]]=[o.tasks[j],o.tasks[i]];
  markDirty(); render();
}

/* re-render when crossing the mobile breakpoint (frozen columns change) */
let _wasMob=window.innerWidth<860;
window.addEventListener('resize',()=>{
  const m=window.innerWidth<860;
  if(m!==_wasMob){_wasMob=m;render();}
});
boot();
</script>
</body>
</html>
