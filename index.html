    const h=holidayOn(i.dataset.hlbl); if(h){h.label=i.value.trim()||'Non-working day';markDirty();render();}
  });
  document.querySelectorAll('[data-htype]').forEach(s=>s.onchange=()=>{
    const h=holidayOn(s.dataset.htype); if(h){h.typeId=s.value;markDirty();render();}
  });
  document.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{
    DB.holidays=DB.holidays.filter(h=>h.date!==b.dataset.hdel);
    DB.outlets.forEach(o=>o.worksOn=(o.worksOn||[]).filter(d=>d!==b.dataset.hdel));
    markDirty(); render();
  });

  document.querySelectorAll('[data-ocol]').forEach(i=>i.onchange=()=>{
    const o=outletOf(i.dataset.ocol); if(o){o.color=i.value;markDirty();render();}
  });
  document.querySelectorAll('[data-oname]').forEach(i=>i.onchange=()=>{
    const o=outletOf(i.dataset.oname); if(o){o.name=i.value.trim()||o.name;markDirty();render();}
  });
  document.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{
    const o=outletOf(b.dataset.odel);
    if(!o||!confirm('Delete "'+o.name+'" and its '+o.tasks.length+' tasks?'))return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    UI.outlets.delete(o.id);
    if(UI.outlet===o.id)UI.outlet=DB.outlets[0]?.id||null;
    markDirty(); render();
  });

  /* ---- data ---- */
  on('dExpJSON',exportJSON);
  on('dImpJSON',()=>$('fileJs').click());
  on('dImpXL',()=>$('fileXl').click());
  on('dSave',()=>saveLocal());
  on('dReset',()=>{
    if(!confirm('Discard the draft on this device and reload the published data?'))return;
    localStorage.removeItem(LS);
    DB=JSON.parse(JSON.stringify(PUB)); normalise();
    UI.outlet=DB.outlets[0]?.id; UI.outlets=new Set(DB.outlets.map(o=>o.id));
    dirty=false; render();
  });
  on('sb_connect',async()=>{
    const url=$('sb_url').value.trim().replace(/\/$/,''), key=$('sb_key').value.trim();
    if(!url||!key){toast('Both the project URL and the anon key are needed');return;}
    localStorage.setItem(LSB,JSON.stringify({url,key}));
    cloud.on=true; cloud.state='saving'; renderSync();
    try{
      const row=await sbLoad();
      if(row&&row.data&&row.data.outlets){
        if(confirm('The cloud already holds a dataset ('+row.data.outlets.length+' outlets, updated '+
          (row.updated_at?new Date(row.updated_at).toLocaleString():'unknown')+').\n\nOK = load it here · Cancel = keep this data and push it up instead')){
          DB=row.data; normalise();
          UI.outlet=DB.outlets[0]?.id; UI.outlets=new Set(DB.outlets.map(o=>o.id));
          dirty=false; cloud.state='ok'; cloud.at=row.updated_at?new Date(row.updated_at):null;
          toast('Loaded from cloud');
        }else{ await pushCloud(); }
      }else{
        cloud.state='empty';
        if(confirm('Connected — the cloud is empty. Push the current dataset up now?')) await pushCloud();
      }
    }catch(e){ cloud.state='err'; toast('Could not reach Supabase: '+e.message); }
    render();
  });
  on('sb_push',pushCloud);
  on('sb_off',()=>{
    localStorage.removeItem(LSB);
    cloud={on:false,state:'off',at:null};
    toast('Disconnected — this device keeps working from its local copy');
    render();
  });

  /* ---- persistent chrome ---- */
  on('btnSave',saveAll);
  on('btnImport',()=>$('fileXl').click());
  const fx=$('fileXl');
  if(fx&&!fx._wired){fx._wired=true;fx.onchange=()=>{if(fx.files[0])handleXlsx(fx.files[0]);fx.value='';};}
  const fj=$('fileJs');
  if(fj&&!fj._wired){fj._wired=true;fj.onchange=()=>{
    const f=fj.files[0]; fj.value='';
    if(!f)return;
    const fr=new FileReader();
    fr.onload=e=>{
      try{
        const j=JSON.parse(e.target.result);
        if(!j.outlets)throw new Error('not a tracker file');
        DB=j; normalise();
        UI.outlet=DB.outlets[0]?.id; UI.outlets=new Set(DB.outlets.map(o=>o.id));
        markDirty(); render(); toast('Loaded '+DB.outlets.length+' outlets — press Save to keep it');
      }catch(err){toast('Could not load: '+err.message);}
    };
    fr.readAsText(f);
  };}
}

function moveTask(taskId,d){
  const o=outletOf(UI.outlet);
  const i=o.tasks.findIndex(x=>x.id===taskId),j=i+d;
  if(i<0||j<0||j>=o.tasks.length)return;
  [o.tasks[i],o.tasks[j]]=[o.tasks[j],o.tasks[i]];
  markDirty(); render();
}

window.addEventListener('beforeunload',e=>{
  if(dirty){e.preventDefault();e.returnValue='';}
});
boot();
</script>
</body>
</html>
