<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonshot Programme Tracker</title>
<meta name="theme-color" content="#FBFBFD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFBFD; --surface:#FFFFFF; --surface-2:#F5F5F7;
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#8E8E93;
  --line:#E5E5EA; --line-2:#D2D2D7;
  --accent:#509353; --accent-soft:#EAF3EC; --accent-deep:#3D7240; --accent-line:#BBD9BD;
  --ok:#34C759; --warn:#FF9500; --danger:#FF3B30;
  --radius:18px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 30px rgba(0,0,0,.06);
  --shadow-soft:0 1px 2px rgba(0,0,0,.05);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Plus Jakarta Sans","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --cell:21px; --labelw:290px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv05","ss01";font-size:13.5px;line-height:1.45}
body{padding:0 0 70px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:-.02em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(251,251,253,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.topbar .twrap{max-width:1800px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;min-height:58px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:16px;letter-spacing:-.02em;font-family:var(--font-display);flex:none}
.brand .dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#8FC492,#509353 62%,#2E5931);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);flex:none}
.brand small{font-weight:430;color:var(--ink-3);font-size:13px;letter-spacing:0}
.blogo{height:30px;width:auto;margin-right:2px;display:block}
.swt{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer;user-select:none}
.swt input{position:absolute;opacity:0;width:0;height:0}
.swt .knob{width:38px;height:22px;border-radius:999px;background:var(--line-2);position:relative;transition:background .18s;flex:none}
.swt .knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.swt input:checked+.knob{background:var(--ok)}
.swt input:checked+.knob::after{transform:translateX(16px)}
.swt input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;box-shadow:0 1px 6px rgba(0,0,0,.07);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:var(--surface);font:inherit;font-size:13px;font-weight:500;color:var(--ink-2);padding:6px 16px;border-radius:999px;cursor:pointer;transition:background .18s,color .15s;letter-spacing:-.01em;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.seg button:not(.on):hover{background:var(--surface-2);color:var(--ink)}
.seg.mini button{padding:5px 13px;font-size:12.5px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#437C45}
.btn.dark{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.btn.dark:hover{background:#2E5931}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.dngr{color:#C0271A;border-color:#F3C9C4}
.btn.dngr:hover{background:#FFF1F0}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- layout ---------- */
.wrap{padding:22px 24px 0;max-width:1800px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft)}
.card+.card{margin-top:16px}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px 13px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px;font-weight:700}
.card-h .sub{font-size:12px;color:var(--ink-3);font-weight:450}
.card-b{padding:18px 20px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);position:relative;z-index:20;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
select,input[type=text],input[type=date],input[type=number],input[type=password],textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:12.5px;min-width:0;transition:border-color .13s}
select:hover,input:hover{border-color:#B9BDC6}
select:focus,input:focus{border-color:var(--accent);outline:none}
input[type=color]{width:34px;height:31px;padding:2px;border:1px solid var(--line-2);border-radius:8px;background:#fff;cursor:pointer}

/* chips (filters) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4.5px 12px;font-size:12px;font-weight:550;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px;transition:.13s}
.fchip i{width:8px;height:8px;border-radius:3px;background:currentColor;flex:none;display:block}
.fchip.on{color:var(--ink);border-color:var(--line-2);background:var(--surface-2)}
.fchip:not(.on){opacity:.42}
.fchip:hover{opacity:1}

/* ---------- sync banner ---------- */
.sync{max-width:1800px;margin:14px auto 0;padding:0 24px}
.sync-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-soft)}
.sync-in.dirty{background:#FFF9EE;border-color:#F0DDB8;color:#7A5A18}
.sync-in.warn{background:#FFF1F0;border-color:#F3C9C4;color:#8C2318}
.dot2{width:7px;height:7px;border-radius:50%;flex:none}
.dot2.g{background:var(--ok)} .dot2.a{background:var(--warn)} .dot2.r{background:var(--danger)} .dot2.c{background:var(--accent)}

/* ---------- generic table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line-2);background:var(--surface-2);position:sticky;top:0;z-index:2;white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFAFB}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- milestone matrix (old slide design) ---------- */
.mtx-outer{padding:26px 26px 30px;overflow:auto;-webkit-overflow-scrolling:touch}
.slide-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;gap:14px;flex-wrap:wrap}
.slide-head .eyebrow{display:block}
.slide-head h2{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.slide-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-weight:430}
.slide-head .right{text-align:right;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.slide-head .right b{color:var(--ink);font-size:13px;font-weight:600;display:block}
table.mtx{border-collapse:separate;border-spacing:0;font-size:13.5px;table-layout:fixed;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 auto}
table.mtx th,table.mtx td{padding:0;text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
table.mtx th:last-child,table.mtx td:last-child{border-right:0}
table.mtx tbody tr:last-child td{border-bottom:0}
table.mtx thead th{padding:14px 12px;height:58px;font-weight:600;font-size:13px;letter-spacing:-.01em;color:#fff;vertical-align:middle}
table.mtx thead th.lead{text-align:left;padding-left:16px;color:var(--ink-2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;white-space:nowrap;background:var(--surface-2)}
table.mtx thead th .oname{display:block;line-height:1.25;overflow-wrap:break-word;word-break:break-word;hyphens:auto}
table.mtx tbody td{height:44px;font-variant-numeric:tabular-nums}
table.mtx tbody tr:nth-child(even) td{background:#FAFAFB}
table.mtx tbody td.lead{text-align:left;font-weight:600;color:var(--ink);padding:0 14px 0 16px;letter-spacing:-.012em;font-size:13px;background:var(--surface-2);border-right:2px solid var(--line-2);white-space:nowrap}
table.mtx tbody tr:nth-child(even) td.lead{background:#F0F0F3}
table.mtx tbody td.lead .num{color:var(--ink-3);font-weight:600;margin-right:11px;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
table.mtx tbody td.lead .cdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:9px;vertical-align:1px}
table.mtx tbody td .dt{display:inline-block;min-width:44px;padding:6px 5px;border-radius:7px;letter-spacing:-.02em;line-height:1.3;font-size:12.5px}
table.mtx tbody td .dt.rng{font-size:12px;white-space:normal}
table.mtx tbody td .dt.pick{cursor:pointer}
table.mtx tbody td .dt.pick:hover{background:var(--accent-soft)}
table.mtx tbody td .dt.done{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.65}
table.mtx tbody tr.hand td{border-top:2px solid var(--line-2)}
table.mtx tbody tr.hand td.lead{font-weight:700}
table.mtx tbody tr.launch td.lead{font-weight:700;color:var(--accent);background:var(--accent-soft)}
table.mtx tbody tr.launch td{background:rgba(80,147,83,.06)}
.dim{color:var(--line-2)}

/* ---------- gantt ---------- */
.gantt{overflow:auto;-webkit-overflow-scrolling:touch;position:relative;max-height:calc(100vh - 250px);border-radius:0 0 var(--radius) var(--radius)}
.gt{border-collapse:separate;border-spacing:0;font-size:12px}
.gt th,.gt td{padding:0;margin:0}
.gt .fc{position:sticky;z-index:3;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;text-align:left;vertical-align:middle;font-size:11px}
.gt .fc.last{border-right:2px solid var(--line-2)}
.gt thead .fc{z-index:7;top:0;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;vertical-align:bottom;padding-bottom:8px}
.gt tbody tr:hover .fc{background:#F3F8F3}
.gt thead th{position:sticky;top:0;z-index:4;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.gt .d{width:var(--cell);min-width:var(--cell);max-width:var(--cell);border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.gt tbody tr{height:var(--cell)}
.gt tbody .d{position:relative;height:var(--cell);padding:0}
.gt tbody .fc{height:var(--cell);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt tbody .fc>*{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gt .dh{padding:3px 0 4px;line-height:1.1;vertical-align:bottom}
.gt .dh .dow{font-size:7.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.gt .dh .dd{font-size:10.5px;font-weight:620;font-family:var(--mono)}
.gt .dh .mo{font-size:7px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;min-height:9px}
.gt .dh.we{background:#F0F0F3}
.gt .dh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.gt .dh.today .dd{color:var(--accent)}
.gt .dh.hol .dow,.gt .dh.hol .dd,.gt .dh.hol .mo{color:#fff}
.gt tbody .d.we{background:#F7F7F9}
.gt tbody .d.cell{cursor:pointer}
.gt tbody .d.cell:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.gbar{position:absolute;inset:1.5px 0;background:var(--barc,#2b3d4d);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);z-index:2}
.gbar.s{left:2px;border-radius:6px 3px 3px 6px}
.gbar.e{right:2px;border-radius:3px 6px 6px 3px}
.gbar.ms::after{content:"";position:absolute;top:50%;left:50%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:#fff;border-radius:1px}
.holcurtain{position:absolute;inset:0;pointer-events:none;z-index:1}
.collbl{position:absolute;left:0;right:0;bottom:2px;height:var(--lblh,180px);display:flex;align-items:flex-end;justify-content:center;pointer-events:none;z-index:6;overflow:visible}
.collbl span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;color:var(--lblc,#fff);text-shadow:0 0 3px rgba(0,0,0,.28)}
.tname{font-weight:550;line-height:1.15;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.fc .sub2{font-size:10px;color:var(--ink-3);line-height:1.3}
.fc.wrap{white-space:nowrap;line-height:1.2;font-size:10.5px;color:var(--ink-2)}
.catdot{width:7px;height:7px;border-radius:2.5px;flex:none;display:inline-block}
.msflag{color:var(--warn);font-size:10px;font-weight:700}
.gt .fc input[type=text],.gt .fc input[type=date],.gt .fc select{width:100%;padding:1px 5px;font-size:10.5px;border-radius:5px;height:calc(var(--cell) - 3px)}
.rowact{display:flex;gap:1px;flex-wrap:wrap}
.ibtn{border:0;background:none;padding:3px 5px;border-radius:6px;color:var(--ink-3);font-size:12px;line-height:1;cursor:pointer;transition:.12s}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.ibtn.on{color:var(--warn)}
.ibtn.del:hover{background:#FFF1F0;color:#C0271A}
.stat{display:flex;gap:22px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-top:1px}
/* critical-path day-type legend (also captured in the export) */
.cp-legend{display:flex;gap:9px 20px;flex-wrap:wrap;align-items:center;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--radius) var(--radius)}
.cp-legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);font-weight:550}
.cp-legend i{width:11px;height:11px;border-radius:3px;flex:none}
/* exporting: neutralise sticky so the whole table rasterises flat */
.exporting .gt .fc,.exporting .gt thead th,.exporting .gt thead .fc{position:static!important}
.exporting .gantt{max-height:none!important;overflow:visible!important}
.exporting .mtx-outer{overflow:visible!important}
.exporting .dgroup-h{position:static!important}
.exporting .cp-legend{border-radius:0}
/* ---------- calendar (old chip design) ---------- */
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:7px;padding:18px 20px 0}
.cal-dow div{text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(96px,auto);gap:8px;padding:8px 20px 20px}
.cell-day{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 9px;display:flex;flex-direction:column;gap:6px;position:relative;transition:.14s}
.cell-day.quiet{background:transparent;border-style:dashed}
.cell-day .dnum{font-size:13px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;line-height:1;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.cell-day.quiet .dnum{color:var(--ink-3);font-weight:500}
.cell-day.today{border-color:var(--accent)}
.cell-day.today .dnum{color:var(--accent);font-weight:700}
.cell-day.hol{background:var(--hb,#eee);border-color:transparent}
.cell-day.hol .dnum,.cell-day.hol .hlbl{color:var(--ht,#fff)}
.hlbl{font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.2;text-align:right}
.dchips{display:flex;flex-direction:column;gap:5px}
.chip{display:flex;flex-direction:column;gap:1px;color:#fff;padding:6px 9px;border-radius:8px;overflow-wrap:anywhere;border:0;text-align:left;width:100%;cursor:pointer;transition:filter .12s}
.chip:hover{filter:brightness(.94)}
.chip .cn{font-weight:700;font-size:12px;line-height:1.28;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:6px}
.chip .cn .n{font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.chip .cp{font-size:11px;line-height:1.28;opacity:.92;font-weight:480}
.more{font-size:11px;color:var(--ink-2);padding:1px 4px;text-align:left;background:none;border:0;font-weight:550;cursor:pointer}
.more:hover{color:var(--accent)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:14px 20px 20px}
.wkcol{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:340px;padding:9px;display:flex;flex-direction:column;gap:6px}
.wkcol.today{border-color:var(--accent)}
.wkhead{font-size:12.5px;font-weight:650;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.daylist{display:flex;flex-direction:column}
.dgroup{border-bottom:1px solid var(--line)}
.dgroup:last-child{border-bottom:0}
.dgroup-h{display:flex;align-items:center;gap:9px;padding:10px 20px;background:var(--surface-2);font-weight:650;font-size:13px;position:sticky;top:0;z-index:2}
.dgroup-h i{width:10px;height:10px;border-radius:3px;flex:none}
.dgroup-h .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.dtask{display:flex;gap:10px;align-items:flex-start;padding:8px 20px 8px 30px;border-top:1px solid var(--line)}
.dtask:first-of-type{border-top:0}
.dtask .who{margin-left:auto;font-size:10.5px;color:var(--ink-3);text-align:right;white-space:nowrap}
.cal-legend{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:center;padding:0 20px 18px}
.cal-legend span{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);font-weight:500}
.cal-legend i{width:9px;height:9px;border-radius:3px}

/* ---------- outlet cards ---------- */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;padding:16px 20px}
.ocard{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;background:var(--surface)}
.ocard .orow{display:flex;align-items:center;gap:8px}
.ocard input[type=text]{flex:1;font-weight:600;font-size:13px;border-color:transparent;padding:5px 7px}
.ocard input[type=text]:hover,.ocard input[type=text]:focus{border-color:var(--line-2)}
.ocard .ometa{font-size:11px;color:var(--ink-3);line-height:1.5;padding-left:2px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.mod{background:var(--surface);border-radius:20px;box-shadow:0 20px 70px rgba(0,0,0,.3);width:min(600px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.mod.wide{width:min(940px,100%)}
.mod-h{display:flex;align-items:center;gap:10px;padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.mod-h h3{font-size:17px;font-weight:700}
.mod-h .x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--ink-2);display:grid;place-items:center;flex:none}
.mod-h .x:hover{background:var(--line)}
.mod-b{padding:18px 24px;overflow:auto}
.mod-f{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fld input,.fld select,.fld textarea{width:100%}
.hint{font-size:12px;color:var(--ink-2);line-height:1.5}
.cbrow{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer}
.cbrow input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.note{background:#FFF9EE;border:1px solid #F0DDB8;border-radius:12px;padding:12px 14px;font-size:12.5px;color:#7A5A18;margin-bottom:14px}
.note b{display:block;margin-bottom:3px}
.note.blue{background:var(--accent-soft);border-color:var(--accent-line);color:#2B5A2E}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:var(--accent-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.3);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.hidden{display:none!important}

@media(max-width:860px){
  :root{--labelw:180px;--cell:19px}
  .wrap{padding:12px 12px 0}
  .sync{padding:0 12px;margin-top:10px}
  .topbar .twrap{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .seg button{padding:6px 11px;font-size:12px}
  .card-h,.bar{padding:11px 13px}
  .card-b{padding:13px}
  .mtx-outer{padding:14px}
  .grid2{grid-template-columns:1fr}
  .cal-grid{gap:4px;padding:4px 10px 12px;grid-auto-rows:minmax(72px,auto)}
  .cal-dow{gap:4px;padding:12px 10px 0}
  .cell-day{padding:5px 5px;border-radius:9px}
  .chip{padding:4px 6px}
  .gantt{max-height:calc(100vh - 230px)}
  .hidesm{display:none!important}
  .slide-head h2{font-size:19px}
}
@media(hover:none){
  .rowbtns{opacity:1}
  [data-tup],[data-tdn],[data-tdel]{display:none}
}
@media print{
  .topbar,.bar,.sync,.rowbtns,.noprint{display:none!important}
  body{background:#fff;padding:0}
  .card{box-shadow:none;border:0}
  .gantt{max-height:none;overflow:visible}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============================================================

const LS  = 'moonshot.tracker.v3';

let DB=null, PUB=null, dirty=false, cloud={on:true, state:'off', at:null};

const PALETTE=["#0071E3","#34C759","#FF9500","#AF52DE","#FF2D55","#E91E8C","#00897B","#F59E0B","#A2845E","#7B1FA2","#C7A500","#8E8E93"];
/* Day types are read as full-height columns behind the bars, so they take the
   deeper, quieter end of the range — and each new one a colour of its own. */
const DT_PALETTE=["#4c5566","#a3324a","#9a5b18","#5b4b8a","#1f6f8b","#2f6b4f","#7a3d6b","#8a6d1f","#3b5f8a","#6b4630"];

/* ---------- date helpers ('YYYY-MM-DD' strings throughout) ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
function d2s(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function s2d(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d);}
function diffDays(a,b){return Math.round((s2d(b)-s2d(a))/864e5);}
function range(a,b){const o=[];let c=a,g=0;while(c<=b&&g++<3000){o.push(c);c=addDays(c,1);}return o;}
function dowOf(s){return s2d(s).getDay();}
function isWeekend(s){const d=dowOf(s);return d===0||d===6;}
function fmt(s){if(!s)return '·';const d=s2d(s);return d.getDate()+' '+MON[d.getMonth()];}
function fmtY(s){if(!s)return '·';const d=s2d(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();}
/** "8 Jun" / "27 Jul – 10 Aug" / "27–29 Jul" — compact, matching the old matrix. */
function fmtRange(a,b){
  if(!a) return '·';
  if(!b||a===b) return fmt(a);
  const da=s2d(a), db=s2d(b);
  if(da.getMonth()===db.getMonth()) return da.getDate()+'–'+db.getDate()+' '+MON[da.getMonth()];
  return fmt(a)+' – '+fmt(b);
}
function today(){return d2s(new Date());}
const uid=p=>p+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function darken(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*(1-f)), g=Math.round(((n>>8)&255)*(1-f)), b=Math.round((n&255)*(1-f));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
/** Largest of the given sizes at which every word fits inside `avail` px. */
let _measCtx=null;
function fitHeadFont(names,avail,sizes=[13,12.5,12,11.5,11,10.5]){
  if(!names.length)return sizes[0];
  _measCtx=_measCtx||document.createElement('canvas').getContext('2d');
  const fam=getComputedStyle(document.body).fontFamily;
  const words=names.join(' ').split(/\s+/).filter(Boolean);
  for(const px of sizes){
    _measCtx.font='600 '+px+'px '+fam;
    if(words.every(w=>_measCtx.measureText(w).width<=avail))return px;
  }
  return sizes[sizes.length-1];
}

/* ---------- lookups ---------- */
const cat=id=>id?(DB.categories.find(c=>c.id===id)||null):null;
const UNCAT={id:null,name:'Uncategorised',color:'#8E8E93',inMilestones:false};
const catOf=t=>cat(t.cat)||UNCAT;
const NOTYPE={id:null,name:'',color:'#8E8E93',text:'#ffffff'};
/** Unknown ids resolve to the no-type object — never to another type, which would
    silently relabel days that belonged to a type someone deleted. */
const dayType=id=>(id?DB.dayTypes.find(t=>t.id===id):null)||NOTYPE;
const dayTypeRaw=id=>DB.dayTypes.find(t=>t.id===id)||null;
const outletOf=id=>DB.outlets.find(o=>o.id===id);

/** The programme calendar is global. */
function holidayOn(date){ return DB.holidays.find(h=>h.date===date)||null; }
/** Display label always comes from the day type, so Setup and the charts can never disagree. */
function holLabel(h){ return h.typeId?dayType(h.typeId).name.toUpperCase():''; }
/** Distinct day types marked across `days`, first seen first. The legend for a
    chart — shared by the Critical Path card, its image/PDF export and the Excel
    sheet, so the three can never disagree about what a colour means. */
function dayTypeLegend(days){
  const seen=new Set(), out=[];
  days.forEach(d=>{
    const h=holidayOn(d); if(!h)return;
    const k=h.typeId||'';
    if(seen.has(k))return;
    seen.add(k); out.push(dayType(h.typeId));
  });
  return out;
}
/** Blocked for this outlet: any marked day, unless the outlet has a works-anyway exception. */
function blockedOn(o,date){
  const h=holidayOn(date);
  if(!h) return false;
  return !(o && (o.worksOn||[]).includes(date));
}
function activeDays(o,t){
  if(!t.start||!t.end||t.end<t.start) return t.start?[t.start]:[];
  const skip=new Set(t.skip||[]);
  return range(t.start,t.end).filter(d=>!skip.has(d)&&!blockedOn(o,d));
}
function workDays(o,t){return activeDays(o,t).length;}
function taskOn(o,t,date){
  if(date<t.start||date>t.end) return false;
  if((t.skip||[]).includes(date)) return false;
  return !blockedOn(o,date);
}
function outletSpan(o){
  let s=o.start,e=o.end;
  o.tasks.forEach(t=>{if(t.start&&(!s||t.start<s))s=t.start;if(t.end&&(!e||t.end>e))e=t.end;});
  return [s||today(),e||today()];
}
function handoverDate(o){
  const h=o.tasks.filter(t=>t.cat==='handover'||/handing over|hand over/i.test(t.name));
  if(h.length) return h.map(t=>t.end).sort().pop();
  return outletSpan(o)[1];
}
/** A milestone is a category: its range spans every task of that category. */
function msRange(o,cid){
  const ts=o.tasks.filter(t=>t.cat===cid);
  if(!ts.length) return null;
  const s=ts.map(t=>t.start).sort()[0], e=ts.map(t=>t.end).sort().pop();
  return {start:s,end:e,n:ts.length};
}

}

async function boot(){

  try{

    if(r.ok){const j=await r.json(); if(j&&j.outlets) PUB=j;}
  }catch(e){}

  try{
    const row=await sbLoad();
    if(row&&row.data&&row.data.outlets){
      DB=row.data; cloud.state='ok'; cloud.at=row.updated_at?new Date(row.updated_at):null; loaded=true;
    }else{ cloud.state='empty'; }
  }catch(e){ cloud.state='err'; }
  if(!loaded){
    const local=readLocal();
    if(local&&local.data&&local.data.outlets) DB=local.data;
    else DB=JSON.parse(JSON.stringify(PUB));
  }
  normalise();
  UI.outlet=DB.outlets.length?DB.outlets[0].id:null;
  UI.outlets=new Set(DB.outlets.map(o=>o.id));
  loadUI();
  UI.calDate=defaultCalMonth();
  render();
}
function defaultCalMonth(){
  const t=today();
  const all=DB.outlets.flatMap(o=>o.tasks.map(x=>x.end)).filter(Boolean).sort();
  if(!all.length) return t.slice(0,7)+'-01';
  if(t<all[0]) return all[0].slice(0,7)+'-01';
  if(t>all[all.length-1]) return all[all.length-1].slice(0,7)+'-01';
  return t.slice(0,7)+'-01';
}
/** Fill gaps in older / imported files, migrate v2 → v3 holiday model. */
function normalise(){
  DB.categories=DB.categories||[]; DB.dayTypes=DB.dayTypes||[];
  DB.holidays=DB.holidays||[]; DB.outlets=DB.outlets||[];
  DB.categories.forEach(c=>{
    if(c.inMilestones===undefined)c.inMilestones=true;
    if(c.inCalendar===undefined)c.inCalendar=true;
  });
  DB.outlets.forEach((o,i)=>{
    o.tasks=o.tasks||[]; o.worksOn=o.worksOn||[];
    if(o.launch===undefined)o.launch=null;
    if(!o.color)o.color=PALETTE[i%PALETTE.length];
    // v2 files carried per-outlet holidays: fold them into the global calendar
    if(o.holidays&&o.holidays.length){
      o.holidays.forEach(h=>{ if(!DB.holidays.some(g=>g.date===h.date)) DB.holidays.push({date:h.date,label:h.label,typeId:h.typeId}); });
      delete o.holidays;
    }
    o.tasks.forEach(t=>{
      t.skip=t.skip||[];
      if(t.cat==='other')t.cat=null;
      if(t.cat===undefined)t.cat=null;
      delete t.ms;
      if(t.done===undefined)t.done=null;
      if(!t.id)t.id=uid('t');
    });
  });
  DB.categories=DB.categories.filter(c=>c.id!=='other');
  DB.taskMap=DB.taskMap||{};
  // learn from existing choices, then apply everywhere so same-named tasks agree
  DB.outlets.forEach(o=>o.tasks.forEach(t=>{
    const k=t.name.trim().toLowerCase();
    if(!(k in DB.taskMap))DB.taskMap[k]=t.cat;
  }));
  Object.keys(DB.taskMap).forEach(k=>{
    if(DB.taskMap[k]&&!DB.categories.some(c=>c.id===DB.taskMap[k]))DB.taskMap[k]=null;
  });
  applyTaskMap();
  DB.dayTypes.forEach(t=>{delete t.working; if(t.name==='Note (work continues)')t.name='Note';});
  // a day type that no longer exists must not borrow another type's identity:
  // drop the dead id so the day shows as untyped, and keep the label in step
  const dtIds=new Set(DB.dayTypes.map(t=>t.id));
  DB.holidays.forEach(h=>{
    if(h.typeId&&!dtIds.has(h.typeId))h.typeId=null;
    h.label=holLabel(h);
  });
  DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
}

/** Re-render, keeping every scroll position where it was (fixes the jump-to-top). */
function render(){
  saveUI();
  const winY=window.scrollY;
  const keep={};
  document.querySelectorAll('[data-keepscroll]').forEach(el=>{
    keep[el.dataset.keepscroll]={l:el.scrollLeft,t:el.scrollTop};
  });
  renderTabs(); renderSync();
  const app=document.getElementById('app');
  if(UI.view==='calendar')app.innerHTML=viewCalendar();
  else if(UI.view==='critical')app.innerHTML=viewCritical();
  else if(UI.view==='manage')app.innerHTML=viewManage();
  else app.innerHTML=viewMilestones();
  wire();
  document.querySelectorAll('[data-keepscroll]').forEach(el=>{
    const k=keep[el.dataset.keepscroll];
    if(k){el.scrollLeft=k.l;el.scrollTop=k.t;}
  });
  window.scrollTo(0,winY);
}

function uiPrompt(msg,opt={}){
  return new Promise(res=>{
    showModal(`<div class="mod" style="width:min(430px,100%)">
      <div class="mod-h"><h3>${esc(opt.title||'Enter a value')}</h3><span class="spacer"></span>
        <button class="x" id="up_x">✕</button></div>

      <div class="mod-f">

        <span class="spacer"></span>
        <button class="btn" id="up_no">Cancel</button>
      </div></div>`);
    const done=v=>{closeModal();res(v);};
    const inp=document.getElementById('up_v'); inp.focus();

    const val=()=>opt.allowEmpty?inp.value.trim():(inp.value.trim()||null);

    document.getElementById('up_no').onclick=()=>done(null);
    document.getElementById('up_x').onclick=()=>done(null);
  });

/* ---------- shared outlet picker ---------- */

/* ================== MILESTONES (transposed slide matrix) ================== */
function viewMilestones(){
  const cats=DB.categories.filter(c=>c.inMilestones);
  const outs=DB.outlets.filter(o=>UI.outlets.has(o.id));

  /* Explicit widths keep table-layout:fixed deterministic: header and body can
     never drift apart, on screen or in an export. Without a width the table
     shrinks to its container and squeezes every column instead of scrolling. */
  const LEADW=236, COLW=132, HPADX=12;
  /* A long single-word name would break mid-word in a fixed column, so the header
     type steps down until the longest word fits. Measured rather than guessed, and
     the same size is used on screen and in the export. */
  const hfs=fitHeadFont(outs.map(o=>o.name),COLW-2*HPADX);
  const head=outs.map(o=>`<th style="background:${o.color};width:${COLW}px;font-size:${hfs}px">
      <span class="oname">${esc(o.name)}</span></th>`).join('');

  let body='';
  cats.forEach((c,idx)=>{
    const tds=outs.map(o=>{
      const r=msRange(o,c.id);
      if(!r) return `<td><span class="dt dim">·</span></td>`;
      const txt=fmtRange(r.start,r.end);
      const done=r.end<today();
      return `<td><span class="dt ${r.start!==r.end?'rng':''} ${done&&UI.strike?'done':''}"
        title="${r.n} task${r.n===1?'':'s'} in this category"
        style="color:${darken(o.color,.30)};font-weight:600">${txt}</span></td>`;
    }).join('');
    body+=`<tr><td class="lead"><span class="num">${String(idx+1).padStart(2,'0')}</span><span class="cdot" style="background:${c.color}"></span>${esc(c.name)}</td>${tds}</tr>`;
  });

  if(cats.length){
    body+=`<tr class="hand"><td class="lead"><span class="num" style="visibility:hidden">00</span>Handover</td>`+
      outs.map(o=>`<td><span class="dt" style="color:${darken(o.color,.30)};font-weight:700">${fmt(handoverDate(o))}</span></td>`).join('')+`</tr>`;
    body+=`<tr class="launch"><td class="lead"><span class="num" style="visibility:hidden">00</span>Launch date</td>`+
      outs.map(o=>{
        const has=!!o.launch;
        if(!UI.cpEdit) return `<td><span class="dt" style="color:${has?'var(--accent)':'var(--line-2)'};font-weight:${has?700:400}">${has?fmt(o.launch):'·'}</span></td>`;
        return `<td><span class="dt pick" data-launch="${o.id}" title="Click to set"
          style="color:${has?'var(--accent)':'var(--line-2)'};font-weight:${has?700:400}">${has?fmt(o.launch):'·'}</span></td>`;
      }).join('')+`</tr>`;

  return `<div class="card">

        `<button class="fchip ${c.inMilestones?'on':''}" data-mscat="${c.id}" style="color:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}</div>

    <div class="bar">${outletChips()}</div>

      <div class="slide-head">
        <div><span class="eyebrow">Moonshot Programme</span>
          <h2>Milestone Matrix</h2></div>
        <div class="right"><b>${outs.length} outlets</b>${cats.length} of ${DB.categories.length} categories shown</div>
      </div>

/* ============================== CALENDAR ============================== */
/* Every category shows on the calendar. Real categories group into one chip
   per outlet+category; tasks without a category (Other) show individually. */
function calItemsOn(date){
  const out=[];
  DB.outlets.forEach(o=>{
    if(!UI.outlets.has(o.id)) return;
    o.tasks.forEach(t=>{
      if(taskOn(o,t,date)) out.push({o,t,c:catOf(t)});
    });
  });
  return out;
}
function calChips(date,limit){
  const items=calItemsOn(date);
  if(!items.length) return '';
  let entries=[];
  const m=new Map();
  items.forEach(({o,t,c})=>{
    if(!c.id){ entries.push({sort:o.name+'~'+t.name,html:
      `<button class="chip" data-day="${date}" style="background:${o.color}">
        <span class="cn">${esc(t.name)}</span><span class="cp">${esc(o.name)}</span></button>`}); return; }
    const k=o.id+'|'+c.id;
    if(!m.has(k)) m.set(k,{o,c,n:0});
    m.get(k).n++;
  });
  [...m.values()].forEach(g=>entries.push({sort:g.o.name+'|'+g.c.name,html:
    `<button class="chip" data-day="${date}" style="background:${g.o.color}">
      <span class="cn">${esc(g.o.name)}<span class="n">${g.n}</span></span>
      <span class="cp">${esc(g.c.name)}</span></button>`}));
  entries.sort((a,b)=>a.sort.localeCompare(b.sort));
  const show=limit?entries.slice(0,limit):entries;
  return show.map(e=>e.html).join('')
    +(limit&&entries.length>limit?`<button class="more" data-day="${date}">+${entries.length-limit} more</button>`:'');
}
function viewCalendar(){
  let body='',title='';
  if(UI.calMode==='month')[body,title]=calMonth();
  else if(UI.calMode==='week')[body,title]=calWeek();
  else [body,title]=calDay();
  const legend=DB.outlets.filter(o=>UI.outlets.has(o.id));
  return `<div class="card">
    <div class="card-h"><h2>${title}</h2>
      <span class="sub">${legend.length} outlet${legend.length===1?'':'s'}</span></div>
    <div class="bar">

        `<button data-cal="${m}" class="${UI.calMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn sm" id="calPrev" title="Previous">‹</button>
        ${UI.calMode==='month'
          ?`<input type="month" id="calJumpM" value="${UI.calDate.slice(0,7)}">`
          :`<input type="date" id="calJump" value="${UI.calDate}">`}

    </div>
  </div>`;
}
function calMonth(){
  const first=UI.calDate.slice(0,7)+'-01';
  const d0=s2d(first),y=d0.getFullYear(),m=d0.getMonth();
  const start=addDays(first,-d0.getDay());
  const last=d2s(new Date(y,m+1,0));
  const end=addDays(last,6-s2d(last).getDay());
  const t=today();
  const cells=range(start,end).map(date=>{
    const inMo=date.slice(0,7)===first.slice(0,7);
    const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
    return `<div class="cell-day ${inMo?'':'quiet'} ${date===t?'today':''} ${h?'hol':''}"
      style="${h?`--hb:${dt.color};--ht:${dt.text||'#fff'}`:''}">
      <div class="dnum"><span>${s2d(date).getDate()}</span>${h?`<span class="hlbl">${esc(holLabel(h))}</span>`:''}</div>
      <div class="dchips">${calChips(date,4)}</div>
    </div>`;
  }).join('');
  return [`<div class="cal-dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div><div class="cal-grid">${cells}</div>`,
          MONF[m]+' '+y];
}
function calWeek(){
  const start=addDays(UI.calDate,-dowOf(UI.calDate));
  const t=today();
  const cols=range(start,addDays(start,6)).map(date=>{
    const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
    return `<div class="wkcol ${date===t?'today':''}" style="${h?`background:${dt.color}14;border-color:${dt.color}55`:''}">
      <div class="wkhead"><span>${DOW[dowOf(date)]} ${s2d(date).getDate()}</span>
        ${h?`<span class="hlbl" style="color:${dt.color}">${esc(holLabel(h))}</span>`:''}</div>
      ${calChips(date,null)||'<span class="dim" style="text-align:center">·</span>'}</div>`;
  }).join('');
  return [`<div class="wk">${cols}</div>`,'Week of '+fmtY(start)];
}
function calDay(){
  const date=UI.calDate;
  const items=calItemsOn(date);
  const h=holidayOn(date); const dt=h?dayType(h.typeId):null;
  const byOut=new Map();
  items.forEach(({o,t,c})=>{ if(!byOut.has(o.id))byOut.set(o.id,{o,items:[]}); byOut.get(o.id).items.push({t,c}); });
  const groups=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>{
    const list=g.items.sort((a,b)=>a.c.name.localeCompare(b.c.name)||a.t.name.localeCompare(b.t.name))
      .map(({t,c})=>`<div class="dtask">
        <span class="catdot" style="background:${c.color};margin-top:4px"></span>
        <div><div style="font-weight:550">${esc(t.name)}</div>
          <div class="tmeta">${esc(c.name)} · day ${diffDays(t.start,date)+1} of ${diffDays(t.start,t.end)+1}</div></div>
        <div class="who">${esc(t.resp||'')}<br><span style="color:var(--ink-3)">${esc(t.dept||'')}</span></div>
      </div>`).join('');
    return `<div class="dgroup"><div class="dgroup-h"><i style="background:${g.o.color}"></i>${esc(g.o.name)}<span class="cnt">${g.items.length}</span></div>${list}</div>`;
  }).join('');
  const head=h?`<div class="note" style="margin:16px 20px 0;background:${dt.color}12;border-color:${dt.color}44;color:${darken(dt.color,.2)};font-weight:650">
    ${esc(holLabel(h)||'Marked day')}</div>`:'';
  return [head+`<div class="daylist">${groups||'<div class="card-b hint">Nothing scheduled on this day for the selected outlets.</div>'}</div>`,
          DOW[dowOf(date)]+', '+fmtY(date)];
}
function dayDrill(date){
  const items=calItemsOn(date);
  const h=holidayOn(date);
  const byOut=new Map();
  items.forEach(({o,t,c})=>{if(!byOut.has(o.id))byOut.set(o.id,{o,items:[]});byOut.get(o.id).items.push({t,c});});
  const body=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>
    `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:6px">
        <i style="width:10px;height:10px;border-radius:3px;background:${g.o.color};display:inline-block"></i>${esc(g.o.name)}
        <span class="mono" style="color:var(--ink-3);font-weight:400;font-size:11px">${g.items.length}</span></div>
      ${g.items.map(({t,c})=>`<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);padding:7px 12px;background:var(--surface-2);border-radius:9px;margin-bottom:5px">
        <span>${esc(t.name)}</span><span style="color:${c.color};font-weight:600;flex:none">${esc(c.name)}</span></div>`).join('')}
    </div>`).join('')||'<div class="hint">Nothing scheduled.</div>';
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${DOW[dowOf(date)]}, ${fmtY(date)}</h3><span class="spacer"></span>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      ${h?`<div class="note" style="font-weight:650">${esc(holLabel(h)||'Marked day')}</div>`:''}
      ${body}</div>
    <div class="mod-f"><button class="btn" id="drillDay">Open day view</button>
      <span class="spacer"></span><button class="btn" onclick="closeModal()">Done</button></div></div>`);
  document.getElementById('drillDay').onclick=()=>{UI.calMode='day';UI.calDate=date;closeModal();render();};
}

<script>
/* =========================== CRITICAL PATH =========================== */
/* Frozen left pane: Task | Start | End | Responsible | Department
   (+ Category and row actions when Edit is on). Everything edits inline —
   no popup. The date header row is frozen too and carries the special-day
   labels, so they stay visible however far you scroll. */
function cpCols(){
  const MOB=window.innerWidth<860;
  if(UI.cpEdit)
    return MOB
      ? [['start','Start',62],['end','End',62],['name','Task',150],['act','',56]]
      : [['start','Start',68],['end','End',68],['name','Task',290],['resp','Responsible',122],['dept','Dept',100],['act','',70]];
  return MOB
    ? [['start','Start',62],['end','End',62],['name','Task',150]]
    : [['start','Start',68],['end','End',68],['name','Task',300],['resp','Responsible',126],['dept','Dept',100]];
}

function viewCritical(){
  const o=outletOf(UI.outlet)||DB.outlets[0];
  if(!o) return `<div class="card"><div class="card-b">
    No outlets yet. <button class="btn pri" id="btnImport2">Import a critical path from Excel</button></div></div>`;
  UI.outlet=o.id;

  const [ws0,we0]=outletSpan(o);
  const ws=addDays(ws0,-3), we=addDays(we0,14);   // padding: room to drag work earlier or later
  const days=range(ws,we);
  const t=today();
  const cols=cpCols();
  const offs=[]; let acc=0;
  cols.forEach(c=>{offs.push(acc);acc+=c[2];});

  const fixHead=cols.map((c,i)=>
    `<th class="fc ${i===cols.length-1?'last':''}" style="left:${offs[i]}px;min-width:${c[2]}px;max-width:${c[2]}px;width:${c[2]}px">${c[1]}</th>`).join('');

  const head=days.map(d=>{

    const worked=h&&(o.worksOn||[]).includes(d);
    const dd=s2d(d);
    return `<th class="d dh ${isWeekend(d)?'we':''} ${d===t?'today':''} ${h?'hol':''}"
      style="${h?`background:${dt.color};`:''}" data-hday="${d}"

      <div class="dd">${dd.getDate()}</div>

  }).join('');

  const rowH=window.innerWidth<860?19:21;
  const rows=o.tasks.map((task,ri)=>{
    const isLast=ri===o.tasks.length-1;
    const c=catOf(task);
    const act=new Set(activeDays(o,task));
    const cells=days.map(d=>{
      const h=holidayOn(d);
      const on=act.has(d);
      const first=on&&!act.has(addDays(d,-1)), last=on&&!act.has(addDays(d,1));
      // a special-day column is filled in every cell except the ones carrying work
      const curtain=(h&&!on)?`<div class="holcurtain" style="background:${dayType(h.typeId).color}"></div>`:'';
      const lbl=(h&&isLast&&holLabel(h))?`<div class="collbl" style="--lblh:${Math.min(220,26+o.tasks.length*rowH)}px;--lblc:${darken(dayType(h.typeId).color,.12)}"><span>${esc(holLabel(h))}</span></div>`:'';
      return `<td class="d ${UI.cpEdit?'cell':''} ${isWeekend(d)?'we':''}" ${UI.cpEdit?`data-cell="${task.id}" data-d="${d}"`:''}>
        ${curtain}${on?`<div class="gbar ${first?'s':''} ${last?'e':''}" style="--barc:${c.color}"></div>`:''}${lbl}</td>`;
    }).join('');

    const fixed=cols.map((cd,i)=>{
      const key=cd[0], left=`left:${offs[i]}px;min-width:${cd[2]}px;max-width:${cd[2]}px;width:${cd[2]}px`;
      const last=i===cols.length-1?'last':'';
      if(!UI.cpEdit){
        if(key==='name') return `<td class="fc ${last}" style="${left}">
          <span class="tname" title="${esc(task.name)} — ${esc(c.name)} · ${workDays(o,task)} work day${workDays(o,task)===1?'':'s'}">
            <span class="catdot" style="background:${c.color};margin-right:6px"></span>${esc(task.name)}</span></td>`;
        if(key==='start') return `<td class="fc mono ${last}" style="${left}">${fmt(task.start)}</td>`;
        if(key==='end')   return `<td class="fc mono ${last}" style="${left}">${fmt(task.end)}</td>`;
        if(key==='resp')  return `<td class="fc wrap ${last}" style="${left}" title="${esc(task.resp||'')}">${esc(task.resp||'')}</td>`;
        if(key==='dept')  return `<td class="fc wrap ${last}" style="${left}" title="${esc(task.dept||'')}">${esc(task.dept||'')}</td>`;
      }else{
        if(key==='name') return `<td class="fc ${last}" style="${left}"><input type="text" value="${esc(task.name)}" data-fname="${task.id}" title="${esc(c.name)}"></td>`;
        if(key==='start')return `<td class="fc mono ${last}" style="${left}">${fmt(task.start)}</td>`;
        if(key==='end')  return `<td class="fc mono ${last}" style="${left}">${fmt(task.end)}</td>`;
        if(key==='resp') return `<td class="fc ${last}" style="${left}"><input type="text" value="${esc(task.resp)}" placeholder="Udara / Nisal" data-fresp="${task.id}"></td>`;
        if(key==='dept') return `<td class="fc ${last}" style="${left}"><input type="text" value="${esc(task.dept)}" placeholder="Projects / IT" data-fdept="${task.id}"></td>`;
        if(key==='act')  return `<td class="fc ${last}" style="${left}"><div class="rowact">
            <button class="ibtn" data-tup="${task.id}" title="Move up">↑</button>
            <button class="ibtn" data-tdn="${task.id}" title="Move down">↓</button>
            <button class="ibtn" data-tdup="${task.id}" title="Duplicate">⧉</button>
            <button class="ibtn del" data-tdel="${task.id}" title="Delete">✕</button></div></td>`;
      }
      return '';
    }).join('');
    return `<tr data-row="${task.id}">${fixed}${cells}</tr>`;
  }).join('');

  const sug=(DB.suggestedHolidays||[]).filter(s=>!holidayOn(s.date));

  // legend for every day type marked inside this outlet's window — the in-column
  // labels are gone, so this is what tells the colours apart (exported too)
  const legend=dayTypeLegend(days);
  const legendHtml=legend.length?`<div class="cp-legend">${legend.map(dt=>
    `<span><i style="background:${dt.color}"></i>${esc(dt.name||'Marked day')}</span>`).join('')}</div>`:'';

  return `<div class="card">
    <div class="card-h">
      <h2>Critical Path</h2>
      <select id="cpOutlet">${DB.outlets.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <span class="sub hidesm">${fmtY(ws0)} → ${fmtY(we0)}</span>
      <span class="spacer"></span>
      ${UI.cpEdit?'<button class="btn sm pri" id="cpAdd">Add task</button>':''}
      <button class="btn sm" id="cpToday">Today</button>
      ${UI.cpEdit?'<button class="btn sm dngr" id="cpDelOut">Delete outlet</button>':''}
    </div>
    <div class="bar">
      <div class="stat">
        <div><b>${o.tasks.length}</b><span>Tasks</span></div>
        <div><b>${days.length}</b><span>Cal. days</span></div>
        <div><b>${days.filter(d=>!blockedOn(o,d)).length}</b><span>Work days</span></div>
        <div><b class="mono" style="font-size:16px">${fmt(handoverDate(o))}</b><span>Handover</span></div>
        ${o.launch?`<div><b class="mono" style="font-size:16px;color:var(--accent)">${fmt(o.launch)}</b><span>Launch</span></div>`:''}
      </div>
    </div>
    ${sug.length?`<div class="card-b" style="padding:14px 20px 0;border-bottom:0"><div class="note">
      <b>${sug.length} date${sug.length===1?'':'s'} in the workbook look like unmarked non-working days</b>
      Tasks pause on ${sug.slice(0,6).map(s=>fmt(s.date)).join(', ')}${sug.length>6?'…':''} across several
      outlets, but no holiday text was written there in Excel. If these were real non-working days, add
      them and every bar recalculates; if the pauses were intentional, dismiss this.
      <div style="margin-top:8px"><button class="btn sm" id="cpAddSug">Add all as non-working days</button>
      <button class="btn sm ghost" id="cpDismissSug">Dismiss</button></div></div></div>`:''}
    <div id="cpExport">
      <div class="gantt" id="cpWrap" data-keepscroll="cp" data-stickyw="${stickyW}">
        <table class="gt" id="gtb"><thead><tr>${fixHead}${head}</tr></thead>
        <tbody>${rows||`<tr><td class="fc" colspan="99" style="padding:20px;position:static">No tasks yet — use <b>Add task</b>.</td></tr>`}</tbody></table>
      </div>
      ${legendHtml}
    </div>
  </div>`;
}

/* ------------------------- special-day editor ------------------------- */
/* One programme-wide calendar; days can be marked singly or as a range.
   Work may still continue at specific outlets via the works-anyway tick. */
function editHoliday(outId,date){
  const o=outId?outletOf(outId):null;
  const cur=holidayOn(date);
  const works=o&&(o.worksOn||[]).includes(date);
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${cur?'Edit special day':'Mark a special day'}</h3>
      <span class="sub">${DOW[dowOf(date)]}, ${fmtY(date)}</span>
      <span class="spacer"></span>
      <button class="x" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      <div class="grid2">
        <div class="fld"><label>Day type <span style="text-transform:none;letter-spacing:0;font-weight:450">(optional)</span></label><select id="h_type">
          <option value="" ${cur&&!cur.typeId?'selected':''}>— No type —</option>
          ${DB.dayTypes.map(dt=>`<option value="${dt.id}" ${cur&&cur.typeId===dt.id?'selected':''}>${esc(dt.name||'(no label)')}</option>`).join('')}</select></div>
        <div class="fld"><label>Until (optional, for multi-day)</label>
          <input type="date" id="h_until" value="" min="${date}"></div>
      </div>
      ${o?`<div class="fld"><label class="cbrow"><input type="checkbox" id="h_works" ${works?'checked':''}>
        Work carries on at ${esc(o.name)} on ${cur?'this day':'these days'}</label></div>`:''}
    </div>
    <div class="mod-f">
      <button class="btn pri" id="h_save">${cur?'Save':'Mark'}</button>
      <span class="spacer"></span>
      ${cur?'<button class="btn dngr" id="h_clear">Remove this day</button>':''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div></div>`);

  document.getElementById('h_save').onclick=()=>{
    const typeId=document.getElementById('h_type').value||null;
    const label=typeId?dayType(typeId).name.toUpperCase():'';
    const until=document.getElementById('h_until').value;
    const dates=until&&until>date?range(date,until):[date];
    const w=document.getElementById('h_works')?.checked;
    dates.forEach(d=>{
      DB.holidays=DB.holidays.filter(x=>x.date!==d);
      DB.holidays.push({date:d,label,typeId});
      if(o){
        o.worksOn=(o.worksOn||[]).filter(x=>x!==d);
        if(w)o.worksOn.push(d);
      }
    });
    if(o)o.worksOn.sort();
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    markDirty(); closeModal(); render();
  };
  document.getElementById('h_clear')?.addEventListener('click',()=>{
    DB.holidays=DB.holidays.filter(h=>h.date!==date);
    DB.outlets.forEach(x=>x.worksOn=(x.worksOn||[]).filter(d=>d!==date));
    markDirty(); closeModal(); render();
  });
}

/* --------------- gantt cell click: toggle a single work day --------------- */
/* Pick the exact days a task runs — start and end derive themselves, and gaps
   between picked days are simply days the work doesn't carry. */
function cellClick(taskId,date){
  if(!UI.cpEdit)return;
  const o=outletOf(UI.outlet);
  const t=o.tasks.find(x=>x.id===taskId);
  if(!t)return;
  if(blockedOn(o,date)){ editHoliday(UI.outlet,date); return; }
  const S=new Set(activeDays(o,t));
  if(S.has(date)){
    if(S.size===1){ toast('A task needs at least one work day — delete the task instead'); return; }
    S.delete(date);
  }else S.add(date);
  const days=[...S].sort();
  t.start=days[0]; t.end=days[days.length-1];
  t.skip=range(t.start,t.end).filter(d=>!S.has(d)&&!blockedOn(o,d));
  markDirty(); render();
}

/* -------- vertical scroll auto-pans horizontally to the visible tasks --------
   Waits for scrolling to settle, then glides with an eased animation. Any manual
   horizontal input (wheel, touch, drag) cancels the glide immediately. */
function glideTo(el,left){
  cancelAnimationFrame(el._gl);
  const s=el.scrollLeft, d=left-s;
  if(Math.abs(d)<6)return;
  const t0=performance.now(), D=450, ease=x=>1-Math.pow(1-x,3);
  el._gliding=true;
  const f=n=>{
    const p=Math.min(1,(n-t0)/D);
    el.scrollLeft=s+d*ease(p);
    if(p<1)el._gl=requestAnimationFrame(f); else el._gliding=false;
  };
  el._gl=requestAnimationFrame(f);
}
function cpAttachAutoPan(){
  const w=document.getElementById('cpWrap');
  if(!w)return;
  const o=outletOf(UI.outlet); if(!o)return;
  const ws=addDays(outletSpan(o)[0],-3);
  const stickyW=+w.dataset.stickyw||0;
  const cancel=()=>{cancelAnimationFrame(w._gl);w._gliding=false;clearTimeout(w._pan);};
  w.addEventListener('wheel',cancel,{passive:true});
  w.addEventListener('touchstart',cancel,{passive:true});
  w.addEventListener('pointerdown',cancel,{passive:true});
  let lastTop=w.scrollTop, lastLeft=w.scrollLeft;
  w.addEventListener('scroll',()=>{
    const dv=w.scrollTop-lastTop, dh=w.scrollLeft-lastLeft;
    lastTop=w.scrollTop; lastLeft=w.scrollLeft;
    if(dh&&!w._gliding)cancel();        // the user is panning by hand — stay out of the way
    if(!dv)return;
    clearTimeout(w._pan);
    w._pan=setTimeout(()=>{             // scrolling has settled
      const dhc=w.querySelector('th.d.dh'); if(!dhc)return;
      const cellW=dhc.offsetWidth;
      const headH=w.querySelector('thead').offsetHeight;
      const rows=[...w.querySelectorAll('tbody tr[data-row]')];
      const top=rows.find(r=>r.offsetTop+r.offsetHeight>w.scrollTop+headH);
      if(!top)return;
      const t=o.tasks.find(x=>x.id===top.dataset.row); if(!t)return;
      const idx=Math.max(0,diffDays(ws,t.start));
      const barL=stickyW+idx*cellW;
      const viewL=w.scrollLeft+stickyW, viewR=w.scrollLeft+w.clientWidth;
      if(barL<viewL||barL>viewR-cellW*3)
        glideTo(w,Math.max(0,barL-stickyW-cellW*2));
    },380);
  });
}
</script>

<script>

/* ========================== EXCEL IMPORT ========================== */
const CAT_RULES=[
 ['prep',/tempor|tempory|to the container|equipment removal|rack arrangement|temporary setup/i],
 ['merchandising',/merchandi|merchendi|bulk bin/i],
 ['cookedsweet',/cooked sweet/i],
 ['juicebakery',/juice|bakery/i],
 ['kitchen',/kitchen/i],
 ['backwall',/back ?wall|back area|backwall/i],
 ['fresh',/fresh|leafy|pola bunk/i],
 ['relocation',/relocat|moving pizza|pharmacy|cctv|bottle cooler|8 door|dairy|siren/i],
 ['handover',/handing over|hand over|final finishing|troubleshoot|final touch/i],
 ['civil',/tiling|blockwall|block wall|floor leveling|perimeter wall|sokage|hume pipe|civil|plinth|cool room|demolition/i],
 ['mep',/electric|conduit|plumb|gas line|canopy|network|\bit\b|power supply|linear light|signage|neon|tv bracket|\bac\b|trunking|duct|lighting/i]];
function guessCat(n){for(const[id,re]of CAT_RULES)if(re.test(n)&&DB.categories.some(c=>c.id===id))return id;return null;}
function labelType(l){
  const u=(l||'').toUpperCase();
  let id='noworks';
  if(u.includes('POYA'))id='poya';
  else if(u.includes('PUBLIC')||u.includes('HOLIDAY'))id='public';
  else if(u.includes('STOCK'))id='stock';
  // the matching type may have been deleted — import the day untyped rather than
  // stamping it with an id nothing answers to
  return dayTypeRaw(id)?id:null;
}
function jsd(v){
  if(v instanceof Date&&!isNaN(v))return d2s(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  return null;
}
function parseWorkbook(wb){
  const results=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    if(!grid.length)return;
    let hr=-1,best=0;
    for(let r=0;r<Math.min(8,grid.length);r++){
      const n=(grid[r]||[]).filter((v,i)=>i>=3&&jsd(v)).length;
      if(n>best){best=n;hr=r;}
    }
    if(hr<0||best<3)return;
    const dateCols={};
    (grid[hr]||[]).forEach((v,i)=>{const d=jsd(v);if(d&&i>=3)dateCols[i]=d;});
    const dcIdx=Object.keys(dateCols).map(Number).sort((a,b)=>a-b);
    const firstDC=dcIdx[0];
    const find=(re,fb)=>{const i=(grid[hr]||[]).findIndex((v,i)=>i<firstDC&&typeof v==='string'&&re.test(v));return i>=0?i:fb;};
    const cDesc=find(/descript/i,4),cResp=find(/responsib/i,5),cLvl=find(/completed/i,6),cDept=find(/department/i,7);
    const hols={};
    (ws['!merges']||[]).forEach(m=>{
      if(m.s.c!==m.e.c||m.s.r<=hr)return;
      if(!(m.s.c in dateCols))return;
      const v=(grid[m.s.r]||[])[m.s.c];
      if(typeof v==='string'&&v.trim())hols[dateCols[m.s.c]]={label:v.trim().replace(/\s+/g,' '),typeId:labelType(v)};
    });
    const tasks=[];
    for(let r=hr+1;r<grid.length;r++){
      const row=grid[r]||[];
      const nm=row[cDesc];
      if(typeof nm!=='string'||!nm.trim())continue;
      const bars=dcIdx.filter(i=>{const v=row[i];return v===1||v==='1'||v===true;});
      if(!bars.length)continue;
      const start=dateCols[bars[0]],end=dateCols[bars[bars.length-1]];
      const lvl=row[cLvl];
      const name=String(nm).replace(/\s+/g,' ').trim();
      const k=name.trim().toLowerCase();
      tasks.push({id:uid('t'),name,start,end,
        _on:new Set(bars.map(i=>dateCols[i])),
        resp:row[cResp]?String(row[cResp]).replace(/\s+/g,' ').trim():'',
        dept:row[cDept]?String(row[cDept]).replace(/\s+/g,' ').trim():'',
        cat:(k in DB.taskMap)?DB.taskMap[k]:guessCat(name),
        done:(typeof lvl==='number'&&lvl<=1)?lvl*100:null});
    }
    if(!tasks.length)return;
    results.push({
      id:sn.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid('o'),
      name:sn.trim(),
      start:tasks.map(t=>t.start).sort()[0],
      end:tasks.map(t=>t.end).sort().pop(),
      _hols:hols, worksOn:[], launch:null, tasks});
  });
  return results;
}
/** After picking sheets: fold holidays into the global calendar, work out
    works-anyway exceptions from the bar data, then compute per-task skips. */
function finaliseImport(imported){
  imported.forEach(o=>{
    Object.entries(o._hols).forEach(([date,h])=>{
      if(!DB.holidays.some(g=>g.date===date))
        DB.holidays.push({date,label:h.label,typeId:h.typeId});
    });
  });
  DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
  const blockedDates=DB.holidays.map(h=>h.date);
  imported.forEach(o=>{
    const worked=new Set();
    o.tasks.forEach(t=>t._on.forEach(d=>worked.add(d)));
    o.worksOn=blockedDates.filter(d=>worked.has(d));
    const blocked=new Set(blockedDates.filter(d=>!o.worksOn.includes(d)));
    o.tasks.forEach(t=>{
      t.skip=range(t.start,t.end).filter(d=>!t._on.has(d)&&!blocked.has(d));
      delete t._on;
    });
    delete o._hols;
  });
}
function handleXlsx(file){
  const fr=new FileReader();
  fr.onload=e=>{
    let found;
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      found=parseWorkbook(wb);
    }catch(err){toast('Could not read that file: '+err.message);return;}
    if(!found.length){toast('No critical paths found — check for a date row and a Description column');return;}
    const rows=found.map((o,i)=>{
      const exists=DB.outlets.some(x=>x.name.toLowerCase()===o.name.toLowerCase());
      return `<tr><td><label class="cbrow"><input type="checkbox" data-imp="${i}" checked> ${esc(o.name)}</label></td>
        <td class="mono">${o.tasks.length}</td><td class="mono">${fmt(o.start)} – ${fmt(o.end)}</td>
        <td class="mono">${Object.keys(o._hols).length}</td>
        <td>${exists?'<span class="fchip on" style="color:var(--warn)"><i></i>Replaces existing</span>':'<span class="fchip on" style="color:var(--ok)"><i></i>New</span>'}</td></tr>`;
    }).join('');
    showModal(`<div class="mod wide"><div class="mod-h"><h3>Import critical paths</h3>
        <span class="sub">${found.length} sheet${found.length===1?'':'s'} read from ${esc(file.name)}</span>
        <span class="spacer"></span><button class="x" onclick="closeModal()">✕</button></div>
      <div class="mod-b">
        <div class="scroll" style="max-height:46vh"><table class="tbl"><thead><tr>
          <th>Outlet</th><th>Tasks</th><th>Window</th><th>Marked days</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div class="fld" style="margin-top:14px"><label class="cbrow">
          <input type="checkbox" id="imp_keep" checked> Keep my category and milestone choices where the task name is unchanged</label></div>
      </div>
      <div class="mod-f"><button class="btn pri" id="imp_go">Import selected</button>
        <span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button></div></div>`);
    document.getElementById('imp_go').onclick=()=>{
      const keep=document.getElementById('imp_keep').checked;
      const chosen=[...document.querySelectorAll('[data-imp]:checked')].map(cb=>found[+cb.dataset.imp]);
      finaliseImport(chosen);
      chosen.forEach(o=>{
        const old=DB.outlets.find(x=>x.name.toLowerCase()===o.name.toLowerCase());
        if(old&&keep){
          const prev=new Map(old.tasks.map(t=>[t.name.toLowerCase(),t]));
          o.tasks.forEach(t=>{const p=prev.get(t.name.toLowerCase());if(p){t.cat=p.cat;if(p.done!=null)t.done=p.done;}});
          o.launch=old.launch;
        }
        if(old){o.id=old.id;o.color=old.color;DB.outlets[DB.outlets.indexOf(old)]=o;}
        else DB.outlets.push(o);
      });
      normalise();
      UI.outlets=new Set(DB.outlets.map(o=>o.id));
      UI.view='critical'; UI.outlet=chosen.length?(DB.outlets.find(x=>x.name.toLowerCase()===chosen[0].name.toLowerCase())||DB.outlets[0]).id:DB.outlets[0].id;
      markDirty(); closeModal(); render();
      toast(chosen.length+' outlet'+(chosen.length===1?'':'s')+' imported — check the categories, then Save');
    };
  };
  fr.readAsArrayBuffer(file);
}

const hex2argb=x=>'FF'+x.replace('#','').toUpperCase();
function tint(hex,f){ // toward white
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)+(255-((n>>16)&255))*f),
        g=Math.round(((n>>8)&255)+(255-((n>>8)&255))*f),
        b=Math.round((n&255)+(255-(n&255))*f);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

    });
    [46,20,14,22,7].forEach((w,i)=>ws.getColumn(i+1).width=w);
    ws.getRow(2).height=54;
    o.tasks.forEach((t,r)=>{
      const row=3+r; const c=catOf(t);

      ws.getCell(row,5).value=workDays(o,t);
      [1,2,3].forEach(i=>ws.getCell(row,i).font={size:10});
      const act=new Set(activeDays(o,t));
      days.forEach((d,i)=>{

        else if(isWeekend(d)) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F7F9'}};

    // rotated labels over fully blocked columns, like the workbook
    if(o.tasks.length)days.forEach((d,i)=>{

      const col=F+1+i, r1=3, r2=2+o.tasks.length;

      const c=ws.getCell(r1,col);

      c.alignment={textRotation:90,horizontal:'center',vertical:'middle'};
      c.font={size:8,bold:true,color:{argb:hex2argb(darken(dayType(hol.typeId).color,.25))}};

async function exportImage(pdf,size){
  const t=exportTarget();
  if(!t||!t.el){toast('Nothing to export');return;}
  const el=t.el;
  toast('Rendering the full table…');
  document.body.classList.add('exporting');
  const undo=[];
  const pin=(node,prop,val)=>{undo.push([node,prop,node.style[prop]]);node.style[prop]=val;};
  await new Promise(r=>setTimeout(r,60));   // let layout settle without sticky
  try{
    /* html2canvas re-lays-out in a cloned document, where an auto-width table
       can size its header differently from its body. Pin every table to a fixed
       px width so the capture is identical at 1 outlet or 20.
       Two passes: a table-layout:fixed table with no width shrinks to its
       container and squeezes its columns, and only springs back to its real
       column sum once a width is set — so measure again after pinning. */
    let inner=0;
    const tables=[...el.querySelectorAll('table')];
    tables.forEach(tb=>pin(tb,'width',Math.ceil(tb.getBoundingClientRect().width)+'px'));
    await new Promise(r=>setTimeout(r,20));
    tables.forEach(tb=>{
      const tw=Math.ceil(tb.getBoundingClientRect().width);
      tb.style.width=tw+'px';
      pin(tb,'minWidth',tw+'px'); pin(tb,'maxWidth',tw+'px');
      inner=Math.max(inner,tw);
    });
    const cs=getComputedStyle(el);
    const pad=parseFloat(cs.paddingLeft||0)+parseFloat(cs.paddingRight||0);
    const w=inner?Math.max(520,inner+pad):el.scrollWidth;
    pin(el,'width',w+'px'); pin(el,'maxWidth','none');
    await new Promise(r=>setTimeout(r,30));
    const hgt=el.scrollHeight;
    const scale=Math.min(size||1.5,12000/w);
    const canvas=await html2canvas(el,{scale,backgroundColor:'#ffffff',logging:false,windowWidth:w+80,windowHeight:hgt+80});
    const name='moonshot-'+t.name+'-'+today();
    if(pdf){
      const {jsPDF}=window.jspdf;
      const land=canvas.width>canvas.height;
      const doc=new jsPDF({orientation:land?'l':'p',unit:'pt',format:'a3',compress:true});
      const pw=doc.internal.pageSize.getWidth()-36,ph=doc.internal.pageSize.getHeight()-36;
      const r=Math.min(pw/canvas.width,ph/canvas.height);
      doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',18,18,canvas.width*r,canvas.height*r,undefined,'FAST');
      doc.save(name+'.pdf');
    }else{
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/png');a.download=name+'.png';a.click();
    }
  }catch(e){toast('Export failed: '+e.message);}
  undo.forEach(([node,prop,val])=>{node.style[prop]=val;});
  document.body.classList.remove('exporting');
}
