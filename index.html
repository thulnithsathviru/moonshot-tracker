<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonshot Programme Tracker</title>
<meta name="theme-color" content="#12222f">
<style>
:root{
  --ink:#0f1a24; --ink2:#33454f; --muted:#69808f; --faint:#93a5b2;
  --line:#dbe3e9; --line2:#eaeff3; --paper:#eff3f6; --surface:#fff;
  --brand:#12384f; --brand2:#1c6f96; --brand-soft:#e4f0f6;
  --signal:#c2410c; --ok:#0d7a5f; --warn:#b45309; --danger:#a3244a;
  --r:7px; --shadow:0 1px 2px rgba(15,26,36,.06),0 4px 14px rgba(15,26,36,.06);
  --f-ui:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-data:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --cell:30px; --rowh:30px; --labelw:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-ui); background:var(--paper); color:var(--ink);
  font-size:13.5px; line-height:1.45; -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.011em}
a{color:var(--brand2)}
:focus-visible{outline:2px solid var(--brand2);outline-offset:1px;border-radius:3px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:60;background:var(--brand);color:#eaf2f6;
  padding:0 14px;display:flex;align-items:center;gap:14px;height:52px;
  padding-top:env(safe-area-inset-top);
  box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.brand{display:flex;align-items:baseline;gap:9px;flex:none}
.brand b{font-size:15px;font-weight:680;letter-spacing:-.02em;color:#fff}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#84a8bd}
.tabs{display:flex;gap:2px;margin-left:6px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;color:#a9c6d6;padding:7px 12px;border-radius:6px;
  font-size:13px;font-weight:550;white-space:nowrap;
}
.tab:hover{background:rgba(255,255,255,.09);color:#fff}
.tab.on{background:rgba(255,255,255,.15);color:#fff}
.topact{display:flex;gap:6px;align-items:center;flex:none}

/* ---------- buttons ---------- */
.btn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 11px;font-size:12.5px;font-weight:550;color:var(--ink2);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{border-color:#b9c7d2;background:#fbfcfd}
.btn:active{transform:translateY(.5px)}
.btn.pri{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.pri:hover{background:#17607f;border-color:#17607f}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line2);color:var(--ink)}
.btn.dngr{color:var(--danger);border-color:#f0d3db}
.btn.dngr:hover{background:#fdf2f5;border-color:#e2b4c1}
.btn.sm{padding:4px 8px;font-size:11.5px}
.btn.on{background:var(--brand-soft);border-color:#9dc6da;color:var(--brand)}
.btn[disabled]{opacity:.45;pointer-events:none}
.top .btn{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.16);color:#e8f1f6}
.top .btn:hover{background:rgba(255,255,255,.2)}

/* ---------- layout ---------- */
.wrap{padding:14px;max-width:1900px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.card-h{
  position:relative;z-index:21;background:var(--surface);border-radius:10px 10px 0 0;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-bottom:1px solid var(--line2)
}
.card-h h2{font-size:14px}
.card-h .sub{font-size:11.5px;color:var(--muted);font-weight:450}
.spacer{flex:1}
.card-b{padding:14px}
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-weight:650}

/* ---------- toolbar / filters ---------- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);position:relative;z-index:20;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:650}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font-size:12.5px;min-width:0
}
select:hover,input:hover{border-color:#b9c7d2}
input[type=color]{width:34px;height:29px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:550;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}

/* chips for category filter */
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:3.5px 10px;
  font-size:11.5px;font-weight:550;color:var(--muted);display:inline-flex;align-items:center;gap:6px
}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:block}
.chip.on{color:var(--ink);border-color:#b9c7d2;background:#fbfcfd}
.chip:not(.on){opacity:.5}
.chip:not(.on) i{background:var(--faint)}

/* ---------- sync banner ---------- */
.sync{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;font-size:12px;border-bottom:1px solid var(--line2);
  background:#fbfcfd;color:var(--muted)
}
.sync.dirty{background:#fff8ed;color:#7c4a12;border-bottom-color:#f0dcbe}
.sync.warn{background:#fdf2f5;color:#7d2038;border-bottom-color:#eecbd6}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.g{background:var(--ok)} .dot.a{background:var(--warn)} .dot.r{background:var(--danger)}

/* ---------- generic table ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.tbl th{
  text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:650;padding:8px 10px;border-bottom:1px solid var(--line);
  background:#fbfcfd;position:sticky;top:0;z-index:2;white-space:nowrap
}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#fafcfd}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}

/* ---------- gantt ---------- */
.gantt{overflow:auto;-webkit-overflow-scrolling:touch;position:relative;max-height:calc(100vh - 250px)}
.gt{border-collapse:separate;border-spacing:0;font-size:12px}
.gt th,.gt td{padding:0;margin:0}
.gt .lab{
  position:sticky;left:0;z-index:3;background:var(--surface);
  min-width:var(--labelw);max-width:var(--labelw);width:var(--labelw);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line2);
  padding:4px 8px;text-align:left;vertical-align:middle
}
.gt thead .lab{z-index:6;background:#fbfcfd;border-bottom:1px solid var(--line)}
.gt thead th{position:sticky;top:0;z-index:4;background:#fbfcfd;border-bottom:1px solid var(--line)}
.gt .d{
  width:var(--cell);min-width:var(--cell);max-width:var(--cell);
  border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  text-align:center;position:relative
}
.gt .dh{cursor:pointer;padding:3px 0 4px;line-height:1.15}
.gt .dh:hover{background:var(--brand-soft)!important}
.gt .dh .dow{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:650}
.gt .dh .dd{font-size:12px;font-weight:620;font-family:var(--f-data)}
.gt .dh .mo{font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.gt .dh.we{background:#f2f5f8}
.gt .dh.today{box-shadow:inset 0 -3px 0 var(--signal)}
.gt .dh.today .dd{color:var(--signal)}
.gt .dh.hol .dow,.gt .dh.hol .dd,.gt .dh.hol .mo{color:#fff}
.gt tbody .d.we{background:#f7f9fb}
.gt tbody .d.hol{opacity:.9}
.gt tbody .d.cell{cursor:pointer}
.gt tbody .d.cell:hover{box-shadow:inset 0 0 0 2px var(--brand2)}
.gt tbody tr:hover .lab{background:#f7fbfd}
.gbar{
  position:absolute;inset:3px 0;background:var(--barc,#2b3d4d);
  border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)
}
.gbar.s{left:2px;border-radius:4px 2px 2px 4px}
.gbar.e{right:2px;border-radius:2px 4px 4px 2px}
.gbar.ms::after{
  content:"";position:absolute;top:50%;left:50%;width:7px;height:7px;
  transform:translate(-50%,-50%) rotate(45deg);background:#fff;border-radius:1px
}
.holcurtain{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;overflow:hidden
}
.holcurtain span{
  writing-mode:vertical-rl;transform:rotate(180deg);font-size:9.5px;font-weight:680;
  letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;opacity:.95
}
.tname{font-weight:550;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmeta{font-size:10px;color:var(--faint);display:flex;gap:5px;align-items:center;margin-top:1px}
.catdot{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}
.msflag{color:var(--warn);font-size:10px;font-weight:700}
.rowbtns{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.gt tbody tr:hover .rowbtns{opacity:1}
.ibtn{border:0;background:none;padding:2px 4px;border-radius:4px;color:var(--faint);font-size:12px;line-height:1}
.ibtn:hover{background:var(--line2);color:var(--ink)}
.ibtn.del:hover{background:#fdf2f5;color:var(--danger)}

/* ---------- milestone matrix ---------- */
.mx{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.mx th{
  position:sticky;top:0;z-index:3;background:#fbfcfd;padding:7px 9px;
  border-bottom:1px solid var(--line);text-align:left;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;font-weight:650;color:var(--faint);
  vertical-align:bottom
}
.mx th.cat{border-top:3px solid var(--cc,#ccc);min-width:145px}
.mx td{padding:5px 9px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);vertical-align:top}
.mx td.out,.mx th.out{
  position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);
  min-width:150px;font-weight:600
}
.mx th.out{z-index:5;background:#fbfcfd}
.mx tbody tr:hover td{background:#fafcfd}
.mx tbody tr:hover td.out{background:#f4f9fc}
.msc{display:flex;flex-direction:column;gap:3px}
.msi{
  border-left:2.5px solid var(--cc,#ccc);padding:1px 0 1px 6px;
  display:flex;flex-direction:column;gap:0
}
.msi b{font-weight:550;font-size:11.5px;line-height:1.2}
.msi span{font-size:10.5px;color:var(--muted);font-family:var(--f-data)}
.msi.done b{color:var(--muted);text-decoration:line-through}
.empty{color:#c3cfd8;font-size:14px;line-height:1}

/* ---------- calendar ---------- */
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line2)}
.caldow{background:#fbfcfd;padding:6px 8px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:650;text-align:center}
.calday{background:var(--surface);min-height:104px;padding:5px 5px 6px;display:flex;flex-direction:column;gap:3px}
.calday.out{background:#f7f9fb}
.calday.today{box-shadow:inset 0 0 0 2px var(--signal)}
.calday.hol{background:var(--hb,#eee)}
.calday-h{display:flex;align-items:center;gap:5px;justify-content:space-between}
.calday-n{font-family:var(--f-data);font-size:12.5px;font-weight:620}
.calday.out .calday-n{color:var(--faint)}
.calday.hol .calday-n,.calday.hol .callbl{color:var(--ht,#fff)}
.callbl{font-size:9px;font-weight:680;letter-spacing:.05em;text-transform:uppercase;opacity:.95;text-align:right;line-height:1.15}
.ev{
  border-radius:4px;padding:2.5px 6px;font-size:10.5px;line-height:1.25;
  background:var(--evb,#eef);border-left:2.5px solid var(--cc,#88a);
  display:block;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0
}
.ev:hover{filter:brightness(.96)}
.ev b{font-weight:640;display:block}
.ev span{color:var(--muted);display:block;font-size:9.5px}
.ev .n{float:right;font-family:var(--f-data);font-weight:700;color:var(--muted)}
.more{font-size:10px;color:var(--muted);padding:1px 4px;text-align:left;background:none;border:0}
.more:hover{color:var(--brand2);text-decoration:underline}

/* week / day list modes */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line2)}
.wkcol{background:var(--surface);min-height:340px;padding:6px;display:flex;flex-direction:column;gap:4px}
.daylist{display:flex;flex-direction:column;gap:0}
.dgroup{border-bottom:1px solid var(--line2)}
.dgroup:last-child{border-bottom:0}
.dgroup-h{
  display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fbfcfd;
  font-weight:620;font-size:12.5px;position:sticky;top:0;z-index:2
}
.dgroup-h .cnt{margin-left:auto;font-family:var(--f-data);font-size:11px;color:var(--muted)}
.dtask{display:flex;gap:9px;align-items:flex-start;padding:6px 14px 6px 22px;border-top:1px solid var(--line2)}
.dtask:first-of-type{border-top:0}
.dtask .who{margin-left:auto;font-size:10.5px;color:var(--faint);text-align:right;white-space:nowrap}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(15,26,36,.42);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.mod{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(15,26,36,.28);width:min(620px,100%);max-height:88vh;display:flex;flex-direction:column}
.mod.wide{width:min(940px,100%)}
.mod-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.mod-h h3{font-size:14.5px}
.mod-b{padding:16px;overflow:auto}
.mod-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line2);background:#fbfcfd;border-radius:0 0 12px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld>label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:650}
.fld input,.fld select,.fld textarea{width:100%}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
.cbrow{display:flex;align-items:center;gap:7px;font-size:12.5px}
.cbrow input{width:15px;height:15px;accent-color:var(--brand2)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:400;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:12.5px;
  box-shadow:0 8px 26px rgba(15,26,36,.3);animation:tin .2s
}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.hidden{display:none!important}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--f-data);font-size:19px;font-weight:650;letter-spacing:-.02em}
.stat span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:650}
.note{background:#fffaf0;border:1px solid #f0dcbe;border-radius:8px;padding:10px 12px;font-size:12px;color:#7c4a12;margin-bottom:12px}
.note b{display:block;margin-bottom:3px}

@media(max-width:820px){
  :root{--labelw:180px;--cell:26px}
  .wrap{padding:9px}
  .brand span{display:none}
  .top{gap:8px;padding:0 9px;height:48px}
  .card-h,.bar{padding:9px 10px}
  .card-b{padding:10px}
  .grid2{grid-template-columns:1fr}
  .calday{min-height:76px}
  .gantt{max-height:calc(100vh - 220px)}
  .hidesm{display:none!important}
}
@media print{
  .top,.bar,.sync,.rowbtns,.noprint{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;border:0}
  .gantt{max-height:none;overflow:visible}
}
@media(hover:none){
  /* No hover on touch — keep the two buttons that matter and drop the fiddly ones.
     Reorder and delete live in the task editor. */
  .rowbtns{opacity:1}
  [data-tup],[data-tdn],[data-tdel]{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Moonshot</b><span>Tracker</span></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="topact">
    <button class="btn sm" id="btnImport">Import Excel</button>
    <button class="btn sm" id="btnSave">Save</button>
  </div>
</header>
<div id="sync" class="sync"></div>
<main class="wrap" id="app"></main>
<input type="file" id="fileXl" accept=".xlsx,.xlsm,.csv" class="hidden">
<input type="file" id="fileJs" accept=".json" class="hidden">
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ============================================================
   Moonshot Programme Tracker
   Single-file tool. Data lives in three places, in priority order:
     1. localStorage  — your working draft on this device
     2. data.json     — the published dataset next to this file
     3. SEED          — the copy baked into this file
   ============================================================ */

const LS = 'moonshot.tracker.v2';
let DB = null;             // live dataset
let PUB = null;            // published dataset (data.json or SEED)
let dirty = false;
let UI = {
  view: 'milestones',
  outlet: null,
  calMode: 'month',
  calDate: null,
  outlets: null,           // Set of visible outlet ids (calendar)
  group: true,             // calendar: group by category
  showDone: true,
  cpEdit: false
};

/* ---------- date helpers (all dates are 'YYYY-MM-DD' strings) ---------- */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONF = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function d2s(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function s2d(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=s2d(s); d.setDate(d.getDate()+n); return d2s(d); }
function diffDays(a,b){ return Math.round((s2d(b)-s2d(a))/864e5); }
function range(a,b){ const out=[]; let c=a; let guard=0; while(c<=b && guard++<3000){ out.push(c); c=addDays(c,1);} return out; }
function dowOf(s){ return s2d(s).getDay(); }
function isWeekend(s){ const d=dowOf(s); return d===0||d===6; }
function fmt(s){ if(!s) return '—'; const d=s2d(s); return d.getDate()+' '+MON[d.getMonth()]; }
function fmtY(s){ if(!s) return '—'; const d=s2d(s); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function today(){ return d2s(new Date()); }
const uid = p => p+Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- lookups ---------- */
const cat = id => DB.categories.find(c=>c.id===id) || {id:'other',name:'Other',color:'#6b7280'};
const dayType = id => DB.dayTypes.find(t=>t.id===id) || DB.dayTypes[0];
const outletOf = id => DB.outlets.find(o=>o.id===id);

/** Holiday in force on a date for an outlet. Outlet entry beats global. */
function holidayOn(o, date){
  if(o){ const h=(o.holidays||[]).find(h=>h.date===date); if(h) return h; }
  return DB.holidays.find(h=>h.date===date) || null;
}
function blockedOn(o, date){
  const h = holidayOn(o,date);
  return h ? !dayType(h.typeId).working : false;
}
/** Dates a task is actually worked: start..end, minus blocked days, minus manual skips. */
function activeDays(o, t){
  if(!t.start||!t.end||t.end<t.start) return t.start?[t.start]:[];
  const skip = new Set(t.skip||[]);
  return range(t.start,t.end).filter(d=>!skip.has(d) && !blockedOn(o,d));
}
function workDays(o,t){ return activeDays(o,t).length; }
function taskOn(o,t,date){
  if(date<t.start||date>t.end) return false;
  if((t.skip||[]).includes(date)) return false;
  return !blockedOn(o,date);
}
/** Outlet window, widened to cover every task. */
function outletSpan(o){
  let s=o.start, e=o.end;
  o.tasks.forEach(t=>{ if(t.start&&(!s||t.start<s)) s=t.start; if(t.end&&(!e||t.end>e)) e=t.end; });
  return [s||today(), e||today()];
}
function handoverDate(o){
  const h = o.tasks.filter(t=>t.cat==='handover'||/handing over|hand over/i.test(t.name));
  if(h.length) return h.map(t=>t.end).sort().pop();
  return outletSpan(o)[1];
}

/* ---------- storage & sync ---------- */
function saveLocal(){
  try{
    localStorage.setItem(LS, JSON.stringify({
      savedAt: new Date().toISOString(),
      base: PUB ? PUB.generatedAt : null,
      data: DB
    }));
    dirty=false; renderSync(); toast('Saved to this device');
  }catch(e){ toast('Could not save: '+e.message); }
}
function readLocal(){
  try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function markDirty(){ dirty=true; renderSync(); }

async function boot(){
  PUB = JSON.parse(JSON.stringify(SEED));
  // A data.json sitting next to this file wins over the baked-in copy.
  try{
    const r = await fetch('data.json?t='+Date.now(), {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && j.outlets) PUB = j;
    }
  }catch(e){ /* offline or opened via file:// — SEED is fine */ }

  const local = readLocal();
  if(local && local.data && local.data.outlets){
    DB = local.data;
    DB._localAt = local.savedAt;
    DB._stale = (local.base && PUB.generatedAt && local.base !== PUB.generatedAt);
  }else{
    DB = JSON.parse(JSON.stringify(PUB));
  }
  normalise();
  UI.outlet = DB.outlets.length ? DB.outlets[0].id : null;
  UI.outlets = new Set(DB.outlets.map(o=>o.id));
  UI.calDate = defaultCalMonth();
  render();
}
function defaultCalMonth(){
  const t=today();
  const all=DB.outlets.flatMap(o=>o.tasks.map(x=>x.end)).filter(Boolean).sort();
  if(!all.length) return t.slice(0,7)+'-01';
  if(t<all[0]) return all[0].slice(0,7)+'-01';
  if(t>all[all.length-1]) return all[all.length-1].slice(0,7)+'-01';
  return t.slice(0,7)+'-01';
}
/** Fill in anything an older/imported file might be missing. */
function normalise(){
  DB.categories = DB.categories||[];
  DB.dayTypes   = DB.dayTypes||[];
  DB.holidays   = DB.holidays||[];
  DB.outlets    = DB.outlets||[];
  DB.categories.forEach(c=>{
    if(c.inMilestones===undefined) c.inMilestones=true;
    if(c.inCalendar===undefined)   c.inCalendar=true;
  });
  DB.outlets.forEach(o=>{
    o.holidays=o.holidays||[]; o.tasks=o.tasks||[];
    o.tasks.forEach(t=>{
      t.skip=t.skip||[]; t.cat=t.cat||'other'; t.ms=!!t.ms;
      if(t.done===undefined) t.done=null;
      if(!t.id) t.id=uid('t');
    });
  });
}

/* ---------- chrome ---------- */
const VIEWS = [
  ['milestones','Milestone Plan'],
  ['calendar','Calendar'],
  ['critical','Critical Path'],
  ['manage','Categories & Holidays'],
  ['data','Data']
];
function renderTabs(){
  document.getElementById('tabs').innerHTML = VIEWS.map(([k,l])=>
    `<button class="tab ${UI.view===k?'on':''}" data-v="${k}">${l}</button>`).join('');
}
function renderSync(){
  const el=document.getElementById('sync');
  const pubStamp = PUB && PUB.generatedAt ? PUB.generatedAt : '—';
  let cls='sync', html='';
  if(DB._stale){
    cls+=' warn';
    html = `<span class="dot r"></span><b>Published data has moved on.</b>
      This device is showing your own draft. Published set is dated ${esc(pubStamp)}.
      <button class="btn sm" id="syncTakePub">Replace with published</button>
      <button class="btn sm" id="syncKeep">Keep my draft</button>`;
  }else if(dirty){
    cls+=' dirty';
    html = `<span class="dot a"></span><b>Unsaved changes on this device.</b>
      <button class="btn sm" id="syncSave">Save draft</button>
      <button class="btn sm" id="syncPub">Download data.json to publish</button>`;
  }else{
    html = `<span class="dot g"></span>Published set ${esc(pubStamp)} ·
      ${DB.outlets.length} outlets · ${DB.outlets.reduce((n,o)=>n+o.tasks.length,0)} tasks
      ${DB._localAt?'· local draft saved '+esc(new Date(DB._localAt).toLocaleString()):''}
      <span class="spacer"></span>
      <button class="btn sm" id="syncPub">Download data.json</button>`;
  }
  el.className=cls; el.innerHTML=html;
  el.querySelector('#syncSave')?.addEventListener('click',saveLocal);
  el.querySelector('#syncPub')?.addEventListener('click',exportJSON);
  el.querySelector('#syncKeep')?.addEventListener('click',()=>{ DB._stale=false; saveLocal(); render(); });
  el.querySelector('#syncTakePub')?.addEventListener('click',()=>{
    if(!confirm('Replace this device\'s draft with the published dataset? Your local edits will be lost.')) return;
    DB=JSON.parse(JSON.stringify(PUB)); normalise();
    UI.outlet=DB.outlets[0]?.id; localStorage.removeItem(LS); dirty=false; render();
    toast('Now showing the published dataset');
  });
}
function render(){
  renderTabs(); renderSync();
  const app=document.getElementById('app');
  if(UI.view==='milestones') app.innerHTML=viewMilestones();
  else if(UI.view==='calendar') app.innerHTML=viewCalendar();
  else if(UI.view==='critical') app.innerHTML=viewCritical();
  else if(UI.view==='manage') app.innerHTML=viewManage();
  else app.innerHTML=viewData();
  wire();
}
function toast(m){
  const t=document.getElementById('toast');
  t.innerHTML=`<div class="toast">${esc(m)}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.innerHTML='',2400);
}
function closeModal(){ document.getElementById('modal').innerHTML=''; }
function showModal(html){
  document.getElementById('modal').innerHTML=`<div class="ov" id="ov">${html}</div>`;
  document.getElementById('ov').addEventListener('mousedown',e=>{ if(e.target.id==='ov') closeModal(); });
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
</script>

<script>
/* =========================== MILESTONE PLAN =========================== */
function viewMilestones(){
  const cats = DB.categories.filter(c=>c.inMilestones);
  const rows = DB.outlets.map(o=>{
    const [s,e]=outletSpan(o);
    const cells = cats.map(c=>{
      const ms = o.tasks.filter(t=>t.ms && t.cat===c.id).sort((a,b)=>a.start.localeCompare(b.start));
      if(!ms.length) return `<td><span class="empty">·</span></td>`;
      return `<td><div class="msc">`+ms.map(t=>{
        const one = t.start===t.end;
        return `<div class="msi ${t.done===100?'done':''}" style="--cc:${c.color}">
          <b>${esc(t.name)}</b>
          <span>${one?fmt(t.start):fmt(t.start)+' – '+fmt(t.end)}</span>
        </div>`;
      }).join('')+`</div></td>`;
    }).join('');
    return `<tr data-out="${o.id}">
      <td class="out"><div>${esc(o.name)}</div>
        <div class="tmeta mono">${fmt(s)} – ${fmt(e)}</div></td>
      ${cells}
      <td class="mono" style="white-space:nowrap"><b>${fmt(handoverDate(o))}</b></td>
    </tr>`;
  }).join('');

  const totalMs = DB.outlets.reduce((n,o)=>n+o.tasks.filter(t=>t.ms).length,0);
  return `
  <div class="card">
    <div class="card-h">
      <h2>Milestone Plan</h2>
      <span class="sub">${DB.outlets.length} outlets · ${totalMs} milestones · ${cats.length} of ${DB.categories.length} categories shown</span>
      <span class="spacer"></span>
      <button class="btn sm" id="msPick">Choose categories</button>
      <button class="btn sm" id="expPNG" data-t="msTable">Export PNG</button>
      <button class="btn sm" id="expPDF" data-t="msTable">Export PDF</button>
    </div>
    <div class="bar">
      <div class="chips">${DB.categories.map(c=>
        `<button class="chip ${c.inMilestones?'on':''}" data-mscat="${c.id}" style="color:${c.color}">
          <i></i>${esc(c.name)}</button>`).join('')}</div>
    </div>
    <div class="scroll" style="max-height:calc(100vh - 250px)" id="msTable">
      <table class="mx">
        <thead><tr>
          <th class="out">Outlet</th>
          ${cats.map(c=>`<th class="cat" style="--cc:${c.color}">${esc(c.name)}</th>`).join('')}
          <th style="border-top:3px solid var(--ink)">Handover</th>
        </tr></thead>
        <tbody>${rows||`<tr><td colspan="9">No outlets yet — import a critical path.</td></tr>`}</tbody>
      </table>
    </div>
  </div>
  <div class="card"><div class="card-b hint">
    A milestone is any critical-path task you have flagged. Open <b>Critical Path</b>, use the flag
    button on a row to mark it, and pick the category it belongs to. Categories toggled off above stay
    in the plan — they are just hidden from this table.
  </div></div>`;
}

/* ============================== CALENDAR ============================== */
function calTasksOn(date){
  const out=[];
  DB.outlets.forEach(o=>{
    if(!UI.outlets.has(o.id)) return;
    o.tasks.forEach(t=>{
      const c=cat(t.cat); if(!c.inCalendar) return;
      if(taskOn(o,t,date)) out.push({o,t,c});
    });
  });
  return out;
}
function calChips(date, limit){
  const items = calTasksOn(date);
  if(!items.length) return '';
  if(UI.group){
    const m=new Map();
    items.forEach(({o,t,c})=>{
      const k=o.id+'|'+c.id;
      if(!m.has(k)) m.set(k,{o,c,n:0});
      m.get(k).n++;
    });
    const arr=[...m.values()].sort((a,b)=> a.o.name.localeCompare(b.o.name)||a.c.name.localeCompare(b.c.name));
    const show=limit?arr.slice(0,limit):arr;
    return show.map(g=>
      `<button class="ev" data-day="${date}" style="--cc:${g.c.color};--evb:${g.c.color}12">
        <b>${esc(g.o.name)}<span class="n">${g.n}</span></b>
        <span>${esc(g.c.name)}</span></button>`).join('')
      + (limit&&arr.length>limit?`<button class="more" data-day="${date}">+${arr.length-limit} more</button>`:'');
  }
  const arr=items.sort((a,b)=>a.o.name.localeCompare(b.o.name));
  const show=limit?arr.slice(0,limit):arr;
  return show.map(({o,t,c})=>
    `<button class="ev" data-day="${date}" style="--cc:${c.color};--evb:${c.color}12">
      <b>${esc(t.name)}</b><span>${esc(o.name)}</span></button>`).join('')
    + (limit&&arr.length>limit?`<button class="more" data-day="${date}">+${arr.length-limit} more</button>`:'');
}
function calFilters(){
  return `<div class="bar">
    <div class="seg">
      ${['day','week','month'].map(m=>`<button data-cal="${m}" class="${UI.calMode===m?'on':''}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}
    </div>
    <button class="btn sm" id="calPrev">‹</button>
    <button class="btn sm" id="calToday">Today</button>
    <button class="btn sm" id="calNext">›</button>
    <div class="field"><label>Jump to</label><input type="date" id="calJump" value="${UI.calDate}"></div>
    <div class="field"><label>Outlets</label>
      <select id="calOut"><option value="__all">All outlets (${UI.outlets.size})</option>
        ${DB.outlets.map(o=>`<option value="${o.id}" ${UI.outlets.size===1&&UI.outlets.has(o.id)?'selected':''}>${esc(o.name)}</option>`).join('')}
      </select></div>
    <button class="btn sm ${UI.group?'on':''}" id="calGroup">${UI.group?'Grouped by category':'Every task listed'}</button>
    <span class="spacer"></span>
    <button class="btn sm" id="expPNG" data-t="calBody">Export PNG</button>
  </div>
  <div class="bar">
    <div class="chips">
      <button class="chip on" id="calAll" style="color:var(--ink2)"><i></i>All</button>
      <button class="chip on" id="calNone" style="color:var(--ink2)"><i></i>None</button>
      ${DB.categories.map(c=>`<button class="chip ${c.inCalendar?'on':''}" data-calcat="${c.id}" style="color:${c.color}"><i></i>${esc(c.name)}</button>`).join('')}
    </div>
  </div>`;
}
function viewCalendar(){
  let body='', title='';
  if(UI.calMode==='month'){ [body,title]=calMonth(); }
  else if(UI.calMode==='week'){ [body,title]=calWeek(); }
  else { [body,title]=calDay(); }
  const n = DB.outlets.filter(o=>UI.outlets.has(o.id)).length;
  return `<div class="card">
    <div class="card-h"><h2>${title}</h2>
      <span class="sub">${n} outlet${n===1?'':'s'} · ${DB.categories.filter(c=>c.inCalendar).length} of ${DB.categories.length} categories</span></div>
    ${calFilters()}
    <div id="calBody">${body}</div>
  </div>`;
}
function calMonth(){
  const first = UI.calDate.slice(0,7)+'-01';
  const d0=s2d(first), y=d0.getFullYear(), m=d0.getMonth();
  const start = addDays(first, -d0.getDay());
  const last = d2s(new Date(y,m+1,0));
  const end = addDays(last, 6-s2d(last).getDay());
  const days = range(start,end);
  const t=today();
  const cells = days.map(date=>{
    const inMo = date.slice(0,7)===first.slice(0,7);
    const h = holidayOn(null,date);
    const dt = h?dayType(h.typeId):null;
    const st = h?`--hb:${dt.color};--ht:${dt.text||'#fff'}`:'';
    return `<div class="calday ${inMo?'':'out'} ${date===t?'today':''} ${h?'hol':''}" style="${st}">
      <div class="calday-h">
        <span class="calday-n">${s2d(date).getDate()}</span>
        ${h?`<span class="callbl">${esc(h.label)}</span>`:''}
      </div>
      ${calChips(date, 4)}
    </div>`;
  }).join('');
  return [`<div class="calgrid">${DOW.map(d=>`<div class="caldow">${d}</div>`).join('')}${cells}</div>`,
          MONF[m]+' '+y];
}
function calWeek(){
  const start = addDays(UI.calDate, -dowOf(UI.calDate));
  const days = range(start, addDays(start,6));
  const t=today();
  const cols = days.map(date=>{
    const h=holidayOn(null,date); const dt=h?dayType(h.typeId):null;
    return `<div class="wkcol ${date===t?'today':''}" style="${h?`background:${dt.color}18`:''}">
      <div class="calday-h" style="border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:2px">
        <span class="calday-n">${DOW[dowOf(date)]} ${s2d(date).getDate()}</span>
        ${h?`<span class="callbl" style="color:${dt.color}">${esc(h.label)}</span>`:''}
      </div>${calChips(date,null)||'<span class="empty">·</span>'}</div>`;
  }).join('');
  return [`<div class="wk">${cols}</div>`,
          'Week of '+fmtY(start)];
}
function calDay(){
  const date=UI.calDate;
  const items=calTasksOn(date);
  const h=holidayOn(null,date); const dt=h?dayType(h.typeId):null;
  const byOut=new Map();
  items.forEach(({o,t,c})=>{
    if(!byOut.has(o.id)) byOut.set(o.id,{o,items:[]});
    byOut.get(o.id).items.push({t,c});
  });
  const groups=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>{
    const list=g.items.sort((a,b)=>a.c.name.localeCompare(b.c.name)||a.t.name.localeCompare(b.t.name))
      .map(({t,c})=>`<div class="dtask">
        <span class="catdot" style="background:${c.color};margin-top:4px"></span>
        <div><div style="font-weight:550">${esc(t.name)}</div>
          <div class="tmeta">${esc(c.name)} · day ${diffDays(t.start,date)+1} of ${diffDays(t.start,t.end)+1}</div></div>
        <div class="who">${esc(t.resp||'')}<br><span style="color:var(--faint)">${esc(t.dept||'')}</span></div>
      </div>`).join('');
    return `<div class="dgroup"><div class="dgroup-h">${esc(g.o.name)}<span class="cnt">${g.items.length}</span></div>${list}</div>`;
  }).join('');
  const head = h?`<div class="note" style="margin:14px 14px 0;background:${dt.color}12;border-color:${dt.color}44;color:${dt.color}">
    <b>${esc(h.label)}</b>${dt.working?'Work continues on this day.':'No work scheduled — this day is blocked for every outlet unless overridden.'}</div>`:'';
  return [head+`<div class="daylist">${groups||'<div class="card-b hint">Nothing scheduled on this day for the current filters.</div>'}</div>`,
          DOW[dowOf(date)]+', '+fmtY(date)];
}
function dayDrill(date){
  const items=calTasksOn(date);
  const h=holidayOn(null,date);
  const byOut=new Map();
  items.forEach(({o,t,c})=>{ if(!byOut.has(o.id)) byOut.set(o.id,{o,items:[]}); byOut.get(o.id).items.push({t,c}); });
  const body=[...byOut.values()].sort((a,b)=>a.o.name.localeCompare(b.o.name)).map(g=>
    `<div style="margin-bottom:12px">
      <div style="font-weight:640;margin-bottom:4px">${esc(g.o.name)} <span class="mono" style="color:var(--muted);font-weight:400">${g.items.length}</span></div>
      ${g.items.map(({t,c})=>`<div style="display:flex;gap:8px;padding:3px 0;align-items:flex-start">
        <span class="catdot" style="background:${c.color};margin-top:5px"></span>
        <div style="flex:1"><div>${esc(t.name)}</div><div class="tmeta">${esc(c.name)} · ${esc(t.resp||'—')}</div></div>
      </div>`).join('')}
    </div>`).join('') || '<div class="hint">Nothing scheduled.</div>';
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${DOW[dowOf(date)]}, ${fmtY(date)}</h3><span class="spacer"></span>
      <button class="btn ghost sm" onclick="closeModal()">Close</button></div>
    <div class="mod-b">
      ${h?`<div class="note"><b>${esc(h.label)}</b>${dayType(h.typeId).working?'Work continues.':'Blocked — no work counted.'}</div>`:''}
      ${body}</div>
    <div class="mod-f"><button class="btn" id="drillDay">Open day view</button>
      <span class="spacer"></span><button class="btn" onclick="closeModal()">Done</button></div></div>`);
  document.getElementById('drillDay').onclick=()=>{ UI.calMode='day'; UI.calDate=date; closeModal(); render(); };
}
</script>

<script>
/* =========================== CRITICAL PATH =========================== */
function viewCritical(){
  const o = outletOf(UI.outlet) || DB.outlets[0];
  if(!o) return `<div class="card"><div class="card-b">
    No outlets yet. <button class="btn pri" id="btnImport2">Import a critical path from Excel</button></div></div>`;
  UI.outlet=o.id;

  const [ws,we] = outletSpan(o);
  const pad = 0;
  const days = range(addDays(ws,-pad), addDays(we,pad));
  const t = today();

  const head = days.map(d=>{
    const h=holidayOn(o,d); const dt=h?dayType(h.typeId):null;
    const st = h?`background:${dt.color};`:'';
    const dd=s2d(d);
    return `<th class="d dh ${isWeekend(d)?'we':''} ${d===t?'today':''} ${h?'hol':''}"
      style="${st}" data-hday="${d}" title="${h?esc(h.label):'Click to mark this day'}">
      <div class="dow">${DOW[dd.getDay()][0]}</div>
      <div class="dd">${dd.getDate()}</div>
      <div class="mo">${dd.getDate()===1||d===days[0]?MON[dd.getMonth()]:''}</div></th>`;
  }).join('');

  const rows = o.tasks.map((task,i)=>{
    const c=cat(task.cat);
    const act=new Set(activeDays(o,task));
    const cells = days.map(d=>{
      const h=holidayOn(o,d); const dt=h?dayType(h.typeId):null;
      const on=act.has(d);
      const first=on&&!act.has(addDays(d,-1)), last=on&&!act.has(addDays(d,1));
      const curtain = (h && !dt.working) ? `<div class="holcurtain" style="background:${dt.color}">${
        i===0?`<span style="color:${dt.text||'#fff'}">${esc(h.label)}</span>`:''}</div>` : '';
      return `<td class="d cell ${isWeekend(d)?'we':''} ${h?'hol':''}" data-cell="${task.id}" data-d="${d}">
        ${on?`<div class="gbar ${first?'s':''} ${last?'e':''} ${task.ms?'ms':''}" style="--barc:${c.color}"></div>`:''}
        ${curtain}</td>`;
    }).join('');
    return `<tr data-row="${task.id}">
      <td class="lab">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="catdot" style="background:${c.color}"></span>
          <div style="min-width:0;flex:1">
            <span class="tname" title="${esc(task.name)}">${task.ms?'<span class="msflag">◆</span> ':''}${esc(task.name)}</span>
            <span class="tmeta mono">${fmt(task.start)}–${fmt(task.end)} · ${workDays(o,task)}d${task.resp?' · '+esc(task.resp.split('/')[0].trim()):''}</span>
          </div>
          <div class="rowbtns noprint">
            <button class="ibtn" data-tedit="${task.id}" title="Edit">✎</button>
            <button class="ibtn" data-tms="${task.id}" title="Mark as milestone" style="${task.ms?'color:var(--warn)':''}">◆</button>
            <button class="ibtn" data-tup="${task.id}" title="Move up">↑</button>
            <button class="ibtn" data-tdn="${task.id}" title="Move down">↓</button>
            <button class="ibtn del" data-tdel="${task.id}" title="Delete">✕</button>
          </div>
        </div>
      </td>${cells}</tr>`;
  }).join('');

  const sug = (DB.suggestedHolidays||[]).filter(s=>!holidayOn(null,s.date));
  const ms = o.tasks.filter(x=>x.ms).length;

  return `<div class="card">
    <div class="card-h">
      <h2>Critical Path</h2>
      <select id="cpOutlet">${DB.outlets.map(x=>`<option value="${x.id}" ${x.id===o.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      <span class="sub hidesm">${fmtY(ws)} → ${fmtY(we)} · ${days.length} days</span>
      <span class="spacer"></span>
      <button class="btn sm" id="cpAdd">Add task</button>
      <button class="btn sm" id="cpToday">Today</button>
      <button class="btn sm" id="expPNG" data-t="cpWrap">PNG</button>
      <button class="btn sm" id="expPDF" data-t="cpWrap">PDF</button>
      <button class="btn sm dngr" id="cpDelOut">Delete outlet</button>
    </div>
    <div class="bar">
      <div class="stat">
        <div><b>${o.tasks.length}</b><span>Tasks</span></div>
        <div><b>${ms}</b><span>Milestones</span></div>
        <div><b>${days.length}</b><span>Cal. days</span></div>
        <div><b>${days.filter(d=>!blockedOn(o,d)).length}</b><span>Work days</span></div>
        <div><b class="mono">${fmt(handoverDate(o))}</b><span>Handover</span></div>
      </div>
      <span class="spacer"></span>
      <span class="hint hidesm">Click a date header to mark a holiday · click a cell to extend a bar or knock a day out</span>
    </div>
    ${sug.length?`<div class="card-b" style="padding-bottom:0"><div class="note">
      <b>${sug.length} date${sug.length===1?'':'s'} look like unmarked non-working days</b>
      Tasks pause on ${sug.slice(0,6).map(s=>fmt(s.date)).join(', ')}${sug.length>6?'…':''} across several outlets,
      but nothing is marked in the workbook. Add them as holidays and every bar recalculates.
      <div style="margin-top:7px"><button class="btn sm" id="cpAddSug">Add all as non-working days</button>
      <button class="btn sm ghost" id="cpDismissSug">Dismiss</button></div></div></div>`:''}
    <div class="gantt" id="cpWrap">
      <table class="gt"><thead><tr><th class="lab">Task <span style="color:var(--faint);font-weight:400">(${o.tasks.length})</span></th>${head}</tr></thead>
      <tbody>${rows||`<tr><td class="lab" colspan="99" style="padding:20px">No tasks. Use <b>Add task</b> to start.</td></tr>`}</tbody></table>
    </div>
  </div>`;
}

/* ------------------------- task editor ------------------------- */
function editTask(outId, taskId){
  const o=outletOf(outId);
  const t = taskId ? o.tasks.find(x=>x.id===taskId) : {
    id:uid('t'), name:'', start:today(), end:today(), skip:[], resp:'', dept:'', cat:'other', ms:false, done:null
  };
  const isNew=!taskId;
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${isNew?'Add task':'Edit task'}</h3>
      <span class="sub">${esc(o.name)}</span><span class="spacer"></span>
      <button class="btn ghost sm" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      <div class="fld"><label>Task name</label>
        <input type="text" id="f_name" value="${esc(t.name)}" placeholder="e.g. Backwall Fitouts (SS | Furniture | Graphics)"></div>
      <div class="grid2">
        <div class="fld"><label>Start date</label><input type="date" id="f_start" value="${t.start}"></div>
        <div class="fld"><label>End date</label><input type="date" id="f_end" value="${t.end}"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Responsibility</label><input type="text" id="f_resp" value="${esc(t.resp)}" placeholder="Udara / Nisal"></div>
        <div class="fld"><label>Department</label><input type="text" id="f_dept" value="${esc(t.dept)}" placeholder="Projects / IT"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Category</label><select id="f_cat">
          ${DB.categories.map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
        <div class="fld"><label>Progress %</label><input type="number" id="f_done" min="0" max="100" step="5" value="${t.done==null?'':t.done}" placeholder="—"></div>
      </div>
      <div class="fld"><label class="cbrow"><input type="checkbox" id="f_ms" ${t.ms?'checked':''}> Show this task on the Milestone Plan</label>
        <div class="hint">It will appear under its category, in this outlet's row.</div></div>
      ${(t.skip||[]).length?`<div class="fld"><label>Days knocked out of this task</label>
        <div class="chips">${t.skip.map(d=>`<button class="chip on" data-unskip="${d}" style="color:var(--danger)"><i></i>${fmt(d)} ✕</button>`).join('')}</div>
        <div class="hint">These sit inside the date range but are not worked. Click to put a day back.</div></div>`:''}
      <div class="hint">Working days are counted automatically: everything between start and end, less any
      holiday or non-working day, less the days knocked out above.</div>
    </div>
    <div class="mod-f">
      <button class="btn pri" id="f_save">${isNew?'Add task':'Save changes'}</button>
      ${isNew?'':'<button class="btn" id="f_dup">Duplicate</button>'}
      ${isNew?'':'<button class="btn" id="f_up" title="Move up">↑</button><button class="btn" id="f_dn" title="Move down">↓</button>'}
      <span class="spacer"></span>
      ${isNew?'':'<button class="btn dngr" id="f_del">Delete</button>'}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div></div>`);

  const read=()=>{
    const v=id=>document.getElementById(id).value;
    let s=v('f_start'), e=v('f_end');
    if(e<s) [s,e]=[e,s];
    return {...t, name:v('f_name').trim()||'Untitled task', start:s, end:e,
      resp:v('f_resp').trim(), dept:v('f_dept').trim(), cat:v('f_cat'),
      ms:document.getElementById('f_ms').checked,
      done: v('f_done')===''?null:Math.max(0,Math.min(100,+v('f_done'))),
      skip:(t.skip||[]).filter(d=>d>=s&&d<=e)};
  };
  document.getElementById('f_save').onclick=()=>{
    const n=read();
    if(isNew) o.tasks.push(n); else Object.assign(t,n);
    markDirty(); closeModal(); render();
  };
  document.getElementById('f_dup')?.addEventListener('click',()=>{
    const n={...read(), id:uid('t'), name:read().name+' (copy)'};
    o.tasks.splice(o.tasks.indexOf(t)+1,0,n); markDirty(); closeModal(); render();
  });
  document.getElementById('f_del')?.addEventListener('click',()=>{
    if(!confirm('Delete "'+t.name+'"?')) return;
    o.tasks=o.tasks.filter(x=>x.id!==t.id); markDirty(); closeModal(); render();
  });
  const shift=d=>{
    const i=o.tasks.indexOf(t), j=i+d;
    if(j<0||j>=o.tasks.length) return;
    [o.tasks[i],o.tasks[j]]=[o.tasks[j],o.tasks[i]];
    markDirty(); closeModal(); render();
  };
  document.getElementById('f_up')?.addEventListener('click',()=>shift(-1));
  document.getElementById('f_dn')?.addEventListener('click',()=>shift(1));
  document.querySelectorAll('[data-unskip]').forEach(b=>b.onclick=()=>{
    t.skip=t.skip.filter(d=>d!==b.dataset.unskip); markDirty(); editTask(outId,taskId);
  });
}

/* ------------------------- holiday editor ------------------------- */
function editHoliday(outId, date){
  const o=outId?outletOf(outId):null;
  const local = o ? (o.holidays||[]).find(h=>h.date===date) : null;
  const glob  = DB.holidays.find(h=>h.date===date);
  const cur = local || glob;
  const scope = local ? 'outlet' : 'global';
  showModal(`<div class="mod"><div class="mod-h">
      <h3>${DOW[dowOf(date)]}, ${fmtY(date)}</h3><span class="spacer"></span>
      <button class="btn ghost sm" onclick="closeModal()">✕</button></div>
    <div class="mod-b">
      ${glob&&local?`<div class="note"><b>This outlet overrides the programme calendar</b>Programme-wide, this day is “${esc(glob.label)}”.</div>`:''}
      <div class="fld"><label>Label shown on the chart</label>
        <input type="text" id="h_label" value="${esc(cur?cur.label:'')}" placeholder="POYA DAY"></div>
      <div class="fld"><label>Day type</label><select id="h_type">
        ${DB.dayTypes.map(dt=>`<option value="${dt.id}" ${cur&&cur.typeId===dt.id?'selected':''}>${esc(dt.name)}${dt.working?' — work continues':' — no work'}</option>`).join('')}</select></div>
      <div class="fld"><label>Applies to</label><select id="h_scope">
        <option value="global" ${scope==='global'?'selected':''}>Every outlet (programme calendar)</option>
        ${o?`<option value="outlet" ${scope==='outlet'?'selected':''}>${esc(o.name)} only</option>`:''}
      </select></div>
      <div class="hint">Marking a day as non-working removes it from every task bar that spans it, and the
      working-day counts recalculate straight away.</div>
    </div>
    <div class="mod-f">
      <button class="btn pri" id="h_save">${cur?'Save':'Mark this day'}</button>
      <span class="spacer"></span>
      ${cur?'<button class="btn dngr" id="h_clear">Clear this day</button>':''}
      <button class="btn" onclick="closeModal()">Cancel</button>
    </div></div>`);

  document.getElementById('h_save').onclick=()=>{
    const label=document.getElementById('h_label').value.trim()||'Non-working day';
    const typeId=document.getElementById('h_type').value;
    const sc=document.getElementById('h_scope').value;
    DB.holidays=DB.holidays.filter(h=>h.date!==date);
    if(o) o.holidays=(o.holidays||[]).filter(h=>h.date!==date);
    const rec={date,label,typeId};
    if(sc==='outlet'&&o) o.holidays.push(rec); else DB.holidays.push(rec);
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    markDirty(); closeModal(); render();
  };
  document.getElementById('h_clear')?.addEventListener('click',()=>{
    DB.holidays=DB.holidays.filter(h=>h.date!==date);
    if(o) o.holidays=(o.holidays||[]).filter(h=>h.date!==date);
    markDirty(); closeModal(); render();
  });
}

/* --------------- click a gantt cell: extend bar or knock a day out --------------- */
function cellClick(taskId, date){
  const o=outletOf(UI.outlet);
  const t=o.tasks.find(x=>x.id===taskId);
  if(!t) return;
  if(date<t.start){ t.start=date; t.skip=(t.skip||[]).filter(d=>d>=t.start); }
  else if(date>t.end){ t.end=date; t.skip=(t.skip||[]).filter(d=>d<=t.end); }
  else if(blockedOn(o,date)){ editHoliday(UI.outlet,date); return; }
  else {
    const s=new Set(t.skip||[]);
    if(s.has(date)) s.delete(date);
    else if(date===t.start){ const a=activeDays(o,t); if(a.length>1) t.start=a[1]; }
    else if(date===t.end){ const a=activeDays(o,t); if(a.length>1) t.end=a[a.length-2]; }
    else s.add(date);
    t.skip=[...s].sort();
  }
  markDirty(); render();
}

const CAT_RULES = [
  ['prep',          /tempor|tempory|to the container|equipment removal|rack arrangement|temporary setup/i],
  ['merchandising', /merchandi|merchendi|bulk bin/i],
  ['cookedsweet',   /cooked sweet/i],
  ['juicebakery',   /juice|bakery/i],
  ['kitchen',       /kitchen/i],
  ['backwall',      /back ?wall|back area|backwall/i],
  ['fresh',         /fresh|leafy|pola bunk/i],
  ['relocation',    /relocat|moving pizza|pharmacy|cctv|bottle cooler|8 door|dairy|siren/i],
  ['handover',      /handing over|hand over|final finishing|troubleshoot|final touch/i],
  ['civil',         /tiling|blockwall|block wall|floor leveling|perimeter wall|sokage|hume pipe|civil|plinth|cool room|demolition/i],
  ['mep',           /electric|conduit|plumb|gas line|canopy|network|\bit\b|power supply|linear light|signage|neon|tv bracket|\bac\b|trunking|duct|lighting/i]
];
const MS_RULE = /handing over|hand over|partition installation|partition removal|merchandi|merchendi|fit ?out works \(ss\)|back ?wall fitouts|equipment placing|equipment commission|final finishing|new store arrangement|setting up the back wall/i;
function guessCat(n){ for(const [id,re] of CAT_RULES) if(re.test(n)) return id; return 'other'; }
function labelType(l){
  const u=(l||'').toUpperCase();
  if(u.includes('POYA')) return 'poya';
  if(u.includes('PUBLIC')||u.includes('HOLIDAY')) return 'public';
  if(u.includes('STOCK')) return 'stock';
  return 'noworks';
}
function jsd(v){
  if(v instanceof Date && !isNaN(v)) return d2s(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  return null;
}
function parseWorkbook(wb){
  const results=[];
  wb.SheetNames.forEach(sn=>{
    const ws=wb.Sheets[sn];
    const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
    if(!grid.length) return;

    // 1. the row carrying the timeline
    let hr=-1, best=0;
    for(let r=0;r<Math.min(8,grid.length);r++){
      const n=(grid[r]||[]).filter((v,i)=>i>=3&&jsd(v)).length;
      if(n>best){ best=n; hr=r; }
    }
    if(hr<0||best<3) return;

    const dateCols={}; 
    (grid[hr]||[]).forEach((v,i)=>{ const d=jsd(v); if(d&&i>=3) dateCols[i]=d; });
    const dcIdx=Object.keys(dateCols).map(Number).sort((a,b)=>a-b);
    const firstDC=dcIdx[0];

    // 2. label columns, by header text where possible
    const find=(re,fb)=>{ const i=(grid[hr]||[]).findIndex((v,i)=>i<firstDC&&typeof v==='string'&&re.test(v)); return i>=0?i:fb; };
    const cDesc=find(/descript/i,4), cResp=find(/responsib/i,5),
          cLvl =find(/completed/i,6), cDept=find(/department/i,7);

    // 3. non-working days from vertical merged blocks
    const hols={};
    (ws['!merges']||[]).forEach(m=>{
      if(m.s.c!==m.e.c || m.s.r<=hr) return;
      if(!(m.s.c in dateCols)) return;
      const v=(grid[m.s.r]||[])[m.s.c];
      if(typeof v==='string' && v.trim()) hols[dateCols[m.s.c]]={label:v.trim().replace(/\s+/g,' '),typeId:labelType(v)};
    });
    const holSet=new Set(Object.keys(hols));

    // 4. tasks
    const tasks=[];
    for(let r=hr+1;r<grid.length;r++){
      const row=grid[r]||[];
      const nm=row[cDesc];
      if(typeof nm!=='string'||!nm.trim()) continue;
      const bars=dcIdx.filter(i=>{ const v=row[i]; return v===1||v==='1'||v===true; });
      if(!bars.length) continue;
      const start=dateCols[bars[0]], end=dateCols[bars[bars.length-1]];
      const onSet=new Set(bars.map(i=>dateCols[i]));
      const skip=range(start,end).filter(d=>!onSet.has(d)&&!holSet.has(d));
      const lvl=row[cLvl];
      const name=String(nm).replace(/\s+/g,' ').trim();
      tasks.push({
        id:uid('t'), name, start, end, skip,
        resp:row[cResp]?String(row[cResp]).replace(/\s+/g,' ').trim():'',
        dept:row[cDept]?String(row[cDept]).replace(/\s+/g,' ').trim():'',
        cat:guessCat(name), ms:MS_RULE.test(name),
        done:(typeof lvl==='number'&&lvl<=1)?lvl*100:null
      });
    }
    if(!tasks.length) return;
    results.push({
      id:sn.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid('o'),
      name:sn.trim(),
      start:tasks.map(t=>t.start).sort()[0],
      end:tasks.map(t=>t.end).sort().pop(),
      holidays:Object.entries(hols).map(([date,v])=>({date,...v})).sort((a,b)=>a.date.localeCompare(b.date)),
      tasks
    });
  });
  return results;
}
function handleXlsx(file){
  const fr=new FileReader();
  fr.onload=e=>{
    let found;
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      found=parseWorkbook(wb);
    }catch(err){ toast('Could not read that file: '+err.message); return; }
    if(!found.length){ toast('No critical paths found — check the sheet has a date row and a Description column'); return; }

    const rows=found.map((o,i)=>{
      const exists=DB.outlets.some(x=>x.name.toLowerCase()===o.name.toLowerCase());
      return `<tr><td><label class="cbrow"><input type="checkbox" data-imp="${i}" checked> ${esc(o.name)}</label></td>
        <td class="mono">${o.tasks.length}</td><td class="mono">${fmt(o.start)} – ${fmt(o.end)}</td>
        <td class="mono">${o.holidays.length}</td>
        <td>${exists?'<span class="chip on" style="color:var(--warn)"><i></i>Replaces existing</span>':'<span class="chip on" style="color:var(--ok)"><i></i>New</span>'}</td></tr>`;
    }).join('');
    showModal(`<div class="mod wide"><div class="mod-h"><h3>Import critical paths</h3>
        <span class="sub">${found.length} sheet${found.length===1?'':'s'} read from ${esc(file.name)}</span>
        <span class="spacer"></span><button class="btn ghost sm" onclick="closeModal()">✕</button></div>
      <div class="mod-b">
        <div class="scroll" style="max-height:46vh"><table class="tbl"><thead><tr>
          <th>Outlet</th><th>Tasks</th><th>Window</th><th>Marked days</th><th></th></tr></thead>
          <tbody>${rows}</tbody></table></div>
        <div class="fld" style="margin-top:14px"><label class="cbrow">
          <input type="checkbox" id="imp_keep" checked> Keep my category and milestone choices where the task name is unchanged</label>
          <div class="hint">Leave this on so re-importing an updated workbook does not undo your work.</div></div>
      </div>
      <div class="mod-f"><button class="btn pri" id="imp_go">Import selected</button>
        <span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button></div></div>`);

    document.getElementById('imp_go').onclick=()=>{
      const keep=document.getElementById('imp_keep').checked;
      let n=0;
      document.querySelectorAll('[data-imp]:checked').forEach(cb=>{
        const o=found[+cb.dataset.imp];
        const old=DB.outlets.find(x=>x.name.toLowerCase()===o.name.toLowerCase());
        if(old&&keep){
          const prev=new Map(old.tasks.map(t=>[t.name.toLowerCase(),t]));
          o.tasks.forEach(t=>{ const p=prev.get(t.name.toLowerCase()); if(p){ t.cat=p.cat; t.ms=p.ms; if(p.done!=null) t.done=p.done; } });
        }
        if(old){ o.id=old.id; DB.outlets[DB.outlets.indexOf(old)]=o; } else DB.outlets.push(o);
        n++;
      });
      // Any label the workbook used that we have no colour for yet
      const known=new Set(DB.dayTypes.map(d=>d.id));
      DB.outlets.forEach(o=>(o.holidays||[]).forEach(h=>{ if(!known.has(h.typeId)) h.typeId='noworks'; }));
      normalise();
      UI.outlets=new Set(DB.outlets.map(o=>o.id));
      UI.view='critical'; UI.outlet=DB.outlets[DB.outlets.length-1].id;
      markDirty(); closeModal(); render();
      toast(n+' outlet'+(n===1?'':'s')+' imported — check the categories, then Save');
    };
  };
  fr.readAsArrayBuffer(file);
}

async function exportImage(targetId, pdf){
  const el=document.getElementById(targetId);
  if(!el){ toast('Nothing to export'); return; }
  toast('Rendering…');
  const prevH=el.style.maxHeight, prevO=el.style.overflow;
  el.style.maxHeight='none'; el.style.overflow='visible';
  try{
    // Wide Gantts blow up fast — cap the pixel budget so exports stay a sane size.
    const w=el.scrollWidth+40;
    const scale=Math.max(1,Math.min(2,3600/w));
    const canvas=await html2canvas(el,{scale,backgroundColor:'#ffffff',windowWidth:w});
    const name='moonshot-'+UI.view+'-'+today();
    if(pdf){
      const {jsPDF}=window.jspdf;
      const land=canvas.width>canvas.height;
      const doc=new jsPDF({orientation:land?'l':'p',unit:'pt',format:'a3',compress:true});
      const pw=doc.internal.pageSize.getWidth()-36, ph=doc.internal.pageSize.getHeight()-36;
      const r=Math.min(pw/canvas.width, ph/canvas.height);
      doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',18,18,canvas.width*r,canvas.height*r,undefined,'FAST');
      doc.save(name+'.pdf');
    }else{
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/png'); a.download=name+'.png'; a.click();
    }
  }catch(e){ toast('Export failed: '+e.message); }
  el.style.maxHeight=prevH; el.style.overflow=prevO;
}
</script>

<script>
/* ============================== WIRING ============================== */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const on = (s,ev,fn)=>$$(s).forEach(el=>el.addEventListener(ev,fn));

function wire(){
  /* tabs */
  on('.tab','click',e=>{ UI.view=e.currentTarget.dataset.v; render(); });

  /* exports */
  on('#expPNG','click',e=>exportImage(e.currentTarget.dataset.t,false));
  on('#expPDF','click',e=>exportImage(e.currentTarget.dataset.t,true));

  /* ---- milestone plan ---- */
  on('[data-mscat]','click',e=>{
    const c=cat(e.currentTarget.dataset.mscat); c.inMilestones=!c.inMilestones; markDirty(); render();
  });
  $('#msPick')?.addEventListener('click',()=>{ UI.view='manage'; render(); });

  /* ---- calendar ---- */
  on('[data-cal]','click',e=>{ UI.calMode=e.currentTarget.dataset.cal; render(); });
  const step=(n)=>{
    if(UI.calMode==='day') UI.calDate=addDays(UI.calDate,n);
    else if(UI.calMode==='week') UI.calDate=addDays(UI.calDate,7*n);
    else{ const d=s2d(UI.calDate); UI.calDate=d2s(new Date(d.getFullYear(),d.getMonth()+n,1)); }
    render();
  };
  $('#calPrev')?.addEventListener('click',()=>step(-1));
  $('#calNext')?.addEventListener('click',()=>step(1));
  $('#calToday')?.addEventListener('click',()=>{ UI.calDate=today(); render(); });
  $('#calJump')?.addEventListener('change',e=>{ if(e.target.value){ UI.calDate=e.target.value; render(); }});
  $('#calGroup')?.addEventListener('click',()=>{ UI.group=!UI.group; render(); });
  $('#calOut')?.addEventListener('change',e=>{
    UI.outlets = e.target.value==='__all' ? new Set(DB.outlets.map(o=>o.id)) : new Set([e.target.value]);
    render();
  });
  $('#calAll')?.addEventListener('click',()=>{ DB.categories.forEach(c=>c.inCalendar=true); markDirty(); render(); });
  $('#calNone')?.addEventListener('click',()=>{ DB.categories.forEach(c=>c.inCalendar=false); markDirty(); render(); });
  on('[data-calcat]','click',e=>{
    const c=cat(e.currentTarget.dataset.calcat); c.inCalendar=!c.inCalendar; markDirty(); render();
  });
  on('.ev[data-day], .more[data-day]','click',e=>dayDrill(e.currentTarget.dataset.day));

  /* ---- critical path ---- */
  $('#cpOutlet')?.addEventListener('change',e=>{ UI.outlet=e.target.value; render(); });
  $('#cpAdd')?.addEventListener('click',()=>editTask(UI.outlet,null));
  $('#btnImport2')?.addEventListener('click',()=>$('#fileXl').click());
  $('#cpToday')?.addEventListener('click',()=>{
    const th=$(`[data-hday="${today()}"]`);
    if(th) th.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
    else toast('Today is outside this outlet’s window');
  });
  $('#cpDelOut')?.addEventListener('click',()=>{
    const o=outletOf(UI.outlet);
    if(!confirm(`Delete ${o.name} and all ${o.tasks.length} of its tasks?`)) return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    UI.outlet=DB.outlets[0]?.id||null; UI.outlets=new Set(DB.outlets.map(x=>x.id));
    markDirty(); render();
  });
  $('#cpAddSug')?.addEventListener('click',()=>{
    (DB.suggestedHolidays||[]).forEach(s=>{
      if(!DB.holidays.some(h=>h.date===s.date))
        DB.holidays.push({date:s.date,label:'NON-WORKING DAY',typeId:'noworks'});
    });
    DB.holidays.sort((a,b)=>a.date.localeCompare(b.date));
    DB.suggestedHolidays=[]; markDirty(); render();
    toast('Marked — rename them under Categories & Holidays');
  });
  $('#cpDismissSug')?.addEventListener('click',()=>{ DB.suggestedHolidays=[]; markDirty(); render(); });

  on('[data-hday]','click',e=>editHoliday(UI.outlet,e.currentTarget.dataset.hday));
  on('[data-cell]','click',e=>{ e.stopPropagation(); cellClick(e.currentTarget.dataset.cell,e.currentTarget.dataset.d); });
  on('[data-tedit]','click',e=>{ e.stopPropagation(); editTask(UI.outlet,e.currentTarget.dataset.tedit); });
  on('[data-tms]','click',e=>{
    e.stopPropagation();
    const t=outletOf(UI.outlet).tasks.find(x=>x.id===e.currentTarget.dataset.tms);
    t.ms=!t.ms; markDirty(); render();
  });
  const move=(id,d)=>{
    const o=outletOf(UI.outlet), i=o.tasks.findIndex(x=>x.id===id), j=i+d;
    if(j<0||j>=o.tasks.length) return;
    [o.tasks[i],o.tasks[j]]=[o.tasks[j],o.tasks[i]]; markDirty(); render();
  };
  on('[data-tup]','click',e=>{ e.stopPropagation(); move(e.currentTarget.dataset.tup,-1); });
  on('[data-tdn]','click',e=>{ e.stopPropagation(); move(e.currentTarget.dataset.tdn,1); });
  on('[data-tdel]','click',e=>{
    e.stopPropagation();
    const o=outletOf(UI.outlet), t=o.tasks.find(x=>x.id===e.currentTarget.dataset.tdel);
    if(!confirm('Delete "'+t.name+'"?')) return;
    o.tasks=o.tasks.filter(x=>x.id!==t.id); markDirty(); render();
  });

  /* ---- manage: categories ---- */
  on('[data-ccol]','input',e=>{ cat(e.target.dataset.ccol).color=e.target.value; markDirty(); });
  on('[data-ccol]','change',()=>render());
  on('[data-cname]','change',e=>{ cat(e.target.dataset.cname).name=e.target.value.trim()||'Untitled'; markDirty(); render(); });
  on('[data-cms]','change',e=>{ cat(e.target.dataset.cms).inMilestones=e.target.checked; markDirty(); });
  on('[data-ccal]','change',e=>{ cat(e.target.dataset.ccal).inCalendar=e.target.checked; markDirty(); });
  on('[data-cdel]','click',e=>{
    const id=e.currentTarget.dataset.cdel;
    if(id==='other'){ toast('Other is the fallback category and cannot be deleted'); return; }
    const n=DB.outlets.reduce((a,o)=>a+o.tasks.filter(t=>t.cat===id).length,0);
    if(!confirm(`Delete this category?${n?` ${n} task${n===1?'':'s'} will move to Other.`:''}`)) return;
    DB.outlets.forEach(o=>o.tasks.forEach(t=>{ if(t.cat===id) t.cat='other'; }));
    DB.categories=DB.categories.filter(c=>c.id!==id);
    markDirty(); render();
  });
  $('#catAdd')?.addEventListener('click',()=>{
    const name=prompt('Name this category','New work package'); if(name===null) return;
    const id=uid('c');
    DB.categories.push({id,name:name.trim()||'New work package',
      color:'#'+Math.floor(Math.random()*0x808080+0x404040).toString(16).padStart(6,'0'),
      inMilestones:true,inCalendar:true});
    markDirty(); render();
  });

  /* ---- manage: day types ---- */
  on('[data-dcol]','input',e=>{ dayType(e.target.dataset.dcol).color=e.target.value; markDirty(); });
  on('[data-dcol]','change',()=>render());
  on('[data-dname]','change',e=>{ dayType(e.target.dataset.dname).name=e.target.value.trim()||'Untitled'; markDirty(); render(); });
  on('[data-dwork]','change',e=>{ dayType(e.target.dataset.dwork).working=e.target.checked; markDirty(); render(); });
  on('[data-ddel]','click',e=>{
    const id=e.currentTarget.dataset.ddel;
    if(DB.dayTypes.length<2){ toast('Keep at least one day type'); return; }
    if(!confirm('Delete this day type? Days using it fall back to the first type.')) return;
    DB.dayTypes=DB.dayTypes.filter(d=>d.id!==id);
    const fb=DB.dayTypes[0].id;
    DB.holidays.forEach(h=>{ if(h.typeId===id) h.typeId=fb; });
    DB.outlets.forEach(o=>(o.holidays||[]).forEach(h=>{ if(h.typeId===id) h.typeId=fb; }));
    markDirty(); render();
  });
  $('#dtAdd')?.addEventListener('click',()=>{
    const name=prompt('Name this day type','Site shutdown'); if(name===null) return;
    DB.dayTypes.push({id:uid('d'),name:name.trim()||'Site shutdown',color:'#5b4b8a',text:'#ffffff',working:false});
    markDirty(); render();
  });

  /* ---- manage: holidays ---- */
  on('[data-hlbl]','change',e=>{
    const h=DB.holidays.find(h=>h.date===e.target.dataset.hlbl);
    h.label=e.target.value.trim()||'Non-working day'; markDirty(); render();
  });
  on('[data-htype]','change',e=>{
    DB.holidays.find(h=>h.date===e.target.dataset.htype).typeId=e.target.value; markDirty(); render();
  });
  on('[data-hdel]','click',e=>{
    DB.holidays=DB.holidays.filter(h=>h.date!==e.currentTarget.dataset.hdel); markDirty(); render();
  });
  $('#holAdd')?.addEventListener('click',()=>{
    const d=$('#holNewDate').value; if(!d) return;
    if(DB.holidays.some(h=>h.date===d)){ toast('That day is already marked'); return; }
    editHoliday(null,d);
  });

  /* ---- manage: outlets ---- */
  on('[data-oname]','change',e=>{ outletOf(e.target.dataset.oname).name=e.target.value.trim()||'Untitled'; markDirty(); render(); });
  on('[data-odel]','click',e=>{
    const o=outletOf(e.currentTarget.dataset.odel);
    if(!confirm(`Delete ${o.name} and all ${o.tasks.length} of its tasks?`)) return;
    DB.outlets=DB.outlets.filter(x=>x.id!==o.id);
    if(UI.outlet===o.id) UI.outlet=DB.outlets[0]?.id||null;
    UI.outlets.delete(o.id); markDirty(); render();
  });

  /* ---- data ---- */
  $('#dExpJSON')?.addEventListener('click',exportJSON);
  $('#dImpJSON')?.addEventListener('click',()=>$('#fileJs').click());
  $('#dImpXL')?.addEventListener('click',()=>$('#fileXl').click());
  $('#dSave')?.addEventListener('click',saveLocal);
  $('#dReset')?.addEventListener('click',()=>{
    if(!confirm('Discard this device\'s draft and go back to the published dataset?')) return;
    localStorage.removeItem(LS);
    DB=JSON.parse(JSON.stringify(PUB)); normalise();
    UI.outlet=DB.outlets[0]?.id||null; UI.outlets=new Set(DB.outlets.map(o=>o.id));
    dirty=false; render(); toast('Back to the published dataset');
  });
}

/* persistent chrome */
document.getElementById('btnSave').addEventListener('click',saveLocal);
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileXl').click());
document.getElementById('fileXl').addEventListener('change',e=>{
  const f=e.target.files[0]; if(f) handleXlsx(f); e.target.value='';
});
document.getElementById('fileJs').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=ev=>{
    try{
      const j=JSON.parse(ev.target.result);
      if(!j.outlets) throw new Error('That file has no outlets in it');
      DB=j; normalise();
      UI.outlet=DB.outlets[0]?.id||null;
      UI.outlets=new Set(DB.outlets.map(o=>o.id));
      markDirty(); render(); toast('Loaded — press Save to keep it on this device');
    }catch(err){ toast('Could not read that file: '+err.message); }
  };
  fr.readAsText(f); e.target.value='';
});
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; }});

boot();
</script>
</body>
